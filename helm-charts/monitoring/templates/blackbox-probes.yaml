# Outside-in synthetic probes (HTTP + ICMP), run by the blackbox exporter on
# the VPS. Each Probe = one module + one tier, because staticConfig labels
# apply to every target in the group. Job names: http-public, http-public-auth,
# http-ops, http-ops-auth, icmp-nodes, icmp-infra, icmp-internet.
# Added 2026-11-05. DNS probes live in dns-probes.yaml.
#
# Target -> expected answer was verified with curl on 2026-11-05 before each
# host was placed in a 2xx or an auth group. Hosts with a /health route are
# probed there so a login redirect or an API 404 at / is not misread.
#
# --- HTTP: public portfolio (tier=public) -----------------------------------
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: http-public-probe
  namespace: {{ .Release.Namespace }}
  labels:
    app: blackbox-exporter
    probe-type: http
    release: {{ .Release.Name }}
spec:
  jobName: http-public
  module: http_2xx
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.{{ .Release.Namespace }}.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - https://el-jefe.me
        - https://www.el-jefe.me                      # 301 -> apex, followed
        - https://bookmarked.el-jefe.me
        - https://code-talk.el-jefe.me
        - https://educationelly.el-jefe.me
        - https://educationelly-graphql-k8s.el-jefe.me
        - https://firebook.el-jefe.me
        - https://intervalai.el-jefe.me
        - https://pop-portfolio.el-jefe.me
        - https://showcase.el-jefe.me
        - https://vertex-platform.el-jefe.me
        - https://gateway.el-jefe.me/health           # graphql gateway; / is 404
        - https://lunary.el-jefe.me
        - https://lunary-api.el-jefe.me/v1/health     # / and /health are 401
      labels:
        probe_type: http
        tier: public
---
# Public apps whose front door is an auth wall: 401 is the healthy answer.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: http-public-auth-probe
  namespace: {{ .Release.Namespace }}
  labels:
    app: blackbox-exporter
    probe-type: http
    release: {{ .Release.Name }}
spec:
  jobName: http-public-auth
  module: http_auth
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.{{ .Release.Namespace }}.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - https://podrick.el-jefe.me/health           # 401
        - https://tenantflow.el-jefe.me/health        # 401
      labels:
        probe_type: http
        tier: public
---
# --- HTTP: operations surfaces (tier=ops) -----------------------------------
