# Cluster-wide default resource *requests* for namespaces whose workloads ship
# without any. Purely additive: LimitRange only mutates pods at admission, so
# nothing changes until a pod is next recreated, and any explicit request in a
# chart or manifest wins over the default.
#
# No destination.namespace: every LimitRange in k8s/limit-ranges/ carries its
# own metadata.namespace, so there is no single namespace to anchor this to.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: limit-ranges
  namespace: argocd
  labels:
    app: limit-ranges
    infrastructure: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/maxjeffwell/devops-portfolio-manager.git
    targetRevision: main
    path: k8s/limit-ranges
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
