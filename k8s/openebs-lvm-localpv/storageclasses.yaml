# lvm-localpv StorageClasses (provisioner local.csi.openebs.io). Both were created
# by hand and lived only in the cluster until 2026-09-30. openebs-lvmpv was already
# Retain; openebs-lvmpv-vg0 changed Delete -> Retain the same day (mimir's PV had
# been hand-patched to Retain to compensate). Retain on lvm-localpv means a released
# PV does NOT free its LV: delete the PV and the lvmvolume CR, or the janitor.
# Applied by hand: kubectl apply -f (the openebs-lvm helm release does not own these).
---
allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-lvmpv
parameters:
  storage: lvm
  thinProvision: 'yes'
  volgroup: openebs-vg
provisioner: local.csi.openebs.io
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  annotations:
    description: 'lvm-localpv thin volumes in vg0 on m920s (the 1 TB OS NVMe, ~765 GiB free).

      Only m920s has a vg0, so claims on this class can only bind there.

      '
  name: openebs-lvmpv-vg0
parameters:
  storage: lvm
  thinProvision: 'yes'
  volgroup: vg0
provisioner: local.csi.openebs.io
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
# 2026-10-15: server-agnostic local LVM class for small replicated workloads
# (first user: the KubeBlocks redis-ha cluster, one pod per server). lvm-localpv
# picks any VG matching vgpattern with free space on the node the pod lands on:
# openebs-vg on elitedesk/m720q, vg0 on m920s (its openebs-vg is full).
# Delete reclaim on purpose: these volumes hold replicated data the app
# re-syncs; a leaked LV per deleted cluster is worse than a lost replica.
allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-lvmpv-servers
  annotations:
    description: 'lvm-localpv thin volumes in openebs-vg OR vg0 (vgpattern), so one claim template works on all three servers.'
parameters:
  storage: lvm
  thinProvision: 'yes'
  vgpattern: '^(openebs-vg|vg0)$'
provisioner: local.csi.openebs.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
