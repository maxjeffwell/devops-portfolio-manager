{{- if .Values.snmpExporter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: snmp-exporter
data:
  snmp.yml: |
    auths:
      {{ .Values.snmpExporter.auth.name }}:
        version: {{ .Values.snmpExporter.auth.version }}
        username: {{ .Values.snmpExporter.auth.username | quote }}
        security_level: {{ .Values.snmpExporter.auth.securityLevel }}
        auth_protocol: {{ .Values.snmpExporter.auth.authProtocol }}
        priv_protocol: {{ .Values.snmpExporter.auth.privProtocol }}
        # expanded at runtime via --config.expand-environment-variables;
        # DSM uses a single passphrase for both auth and privacy
        password: ${SNMP_AUTH_PASSWORD}
        priv_password: ${SNMP_AUTH_PASSWORD}
      {{- range $name, $a := .Values.snmpExporter.extraAuths }}
      {{ $name }}:
        version: {{ $a.version }}
        {{- /* A v2c community can only be a literal: snmp_exporter (checked at
               v0.31.0) expands env vars only in username/password/priv_password.
               Use it for non-secret defaults only; anything else needs SNMPv3. */}}
        {{- if $a.community }}
        community: {{ $a.community | quote }}
        {{- end }}
        {{- if $a.username }}
        username: {{ $a.username | quote }}
        security_level: {{ $a.securityLevel }}
        {{- end }}
        {{- if $a.authProtocol }}
        auth_protocol: {{ $a.authProtocol }}
        password: {{ printf "${%s}" $a.passwordEnv }}
        {{- end }}
        {{- if $a.privProtocol }}
        priv_protocol: {{ $a.privProtocol }}
        priv_password: {{ printf "${%s}" ($a.privPasswordEnv | default $a.passwordEnv) }}
        {{- end }}
      {{- end }}
    modules:
      hrstorage:
        walk:
          - 1.3.6.1.2.1.25.1.1   # hrSystemUptime
          - 1.3.6.1.2.1.25.2.3   # hrStorageTable
          - 1.3.6.1.2.1.1.3      # sysUpTime
        get:
          - 1.3.6.1.2.1.1.3.0
        metrics:
          - name: sysUpTime
            oid: 1.3.6.1.2.1.1.3
            type: gauge
          - name: hrSystemUptime
            oid: 1.3.6.1.2.1.25.1.1
            type: gauge
          - name: hrStorageIndex
            oid: 1.3.6.1.2.1.25.2.3.1.1
            type: gauge
            indexes:
              - labelname: hrStorageIndex
                type: gauge
          - name: hrStorageType
            oid: 1.3.6.1.2.1.25.2.3.1.2
            type: OctetString
            indexes:
              - labelname: hrStorageIndex
                type: gauge
          - name: hrStorageDescr
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString
            indexes:
              - labelname: hrStorageIndex
                type: gauge
          - name: hrStorageAllocationUnits
            oid: 1.3.6.1.2.1.25.2.3.1.4
            type: gauge
            indexes:
              - labelname: hrStorageIndex
                type: gauge
            lookups:
              - labels: [hrStorageIndex]
                labelname: hrStorageDescr
                oid: 1.3.6.1.2.1.25.2.3.1.3
                type: DisplayString
          - name: hrStorageSize
            oid: 1.3.6.1.2.1.25.2.3.1.5
            type: gauge
            indexes:
              - labelname: hrStorageIndex
                type: gauge
            lookups:
              - labels: [hrStorageIndex]
                labelname: hrStorageDescr
                oid: 1.3.6.1.2.1.25.2.3.1.3
                type: DisplayString
          - name: hrStorageUsed
            oid: 1.3.6.1.2.1.25.2.3.1.6
            type: gauge
            indexes:
              - labelname: hrStorageIndex
                type: gauge
            lookups:
              - labels: [hrStorageIndex]
                labelname: hrStorageDescr
                oid: 1.3.6.1.2.1.25.2.3.1.3
                type: DisplayString
      # Three single GETs and no table walks: the gentlest possible poll, for a
      # device whose SNMP agent is not trusted yet. One attempt, no retries.
      system:
        get:
          - 1.3.6.1.2.1.1.1.0   # sysDescr
          - 1.3.6.1.2.1.1.3.0   # sysUpTime
          - 1.3.6.1.2.1.1.5.0   # sysName
        retries: 0
        timeout: 5s
        metrics:
          - name: sysDescr
            oid: 1.3.6.1.2.1.1.1
            type: DisplayString
          - name: sysUpTime
            oid: 1.3.6.1.2.1.1.3
            type: gauge
          - name: sysName
            oid: 1.3.6.1.2.1.1.5
            type: DisplayString
      # Per-port traffic, errors and link state (IF-MIB), for switches/routers.
      if_mib:
        walk:
          - 1.3.6.1.2.1.2.2.1      # ifTable
          - 1.3.6.1.2.1.31.1.1.1   # ifXTable
          - 1.3.6.1.2.1.1.3        # sysUpTime
        metrics:
          - name: sysUpTime
            oid: 1.3.6.1.2.1.1.3
            type: gauge
          {{- $ifMetrics := list
                (list "ifOperStatus"   "1.3.6.1.2.1.2.2.1.8"     "gauge")
                (list "ifAdminStatus"  "1.3.6.1.2.1.2.2.1.7"     "gauge")
                (list "ifInDiscards"   "1.3.6.1.2.1.2.2.1.13"    "counter")
                (list "ifInErrors"     "1.3.6.1.2.1.2.2.1.14"    "counter")
                (list "ifOutDiscards"  "1.3.6.1.2.1.2.2.1.19"    "counter")
                (list "ifOutErrors"    "1.3.6.1.2.1.2.2.1.20"    "counter")
                (list "ifHCInOctets"   "1.3.6.1.2.1.31.1.1.1.6"  "counter")
                (list "ifHCOutOctets"  "1.3.6.1.2.1.31.1.1.1.10" "counter")
                (list "ifHighSpeed"    "1.3.6.1.2.1.31.1.1.1.15" "gauge") }}
          {{- range $m := $ifMetrics }}
          - name: {{ index $m 0 }}
            oid: {{ index $m 1 }}
            type: {{ index $m 2 }}
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifAlias
                oid: 1.3.6.1.2.1.31.1.1.1.18
                type: DisplayString
          {{- end }}
{{- end }}
