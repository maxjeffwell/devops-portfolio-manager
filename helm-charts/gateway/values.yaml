priorityClassName: portfolio-app
# 2026-10-01: 1 -> 2 replicas, Recreate -> RollingUpdate (maxUnavailable 0). This
# chart has only the server component, so replicaCount is safe to raise directly.
# Multi-instance review: the only in-process state is the contact-form rate
# limiter (3/IP/10 min, degrades to 6 across two pods) and the Kafka consumer
# already uses a unique group id per process, so both replicas get every event.
# RollingUpdate matters most here: graphql-ws subscriptions died on every deploy.
replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

pdb:
  enabled: true
  minAvailable: 1

image:
  server:
    repository: maxjeffwell/graphql-gateway
    tag: 20260406-073100-d818b7a
    pullPolicy: Always

service:
  server:
    type: ClusterIP
    port: 4000
    targetPort: 4000

resources:
  server:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      # 2026-09-30: cpu 200m -> 150m. 30-day peak 94m, 7d p95 59m. No HPA.
      cpu: 150m
      memory: 128Mi

autoscaling:
  enabled: false

env:
  server:
    - name: PORT
      value: "4000"
    - name: NODE_ENV
      value: "production"
    - name: CORS_ORIGIN
      value: "https://el-jefe.me"
    - name: PROMETHEUS_URL
      value: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"
    - name: KAFKA_ENABLED
      value: "true"
    - name: KAFKA_BROKERS
      value: "vertex-kafka-kafka-bootstrap.microservices.svc:9092"
    - name: KAFKA_CLIENT_ID
      value: "graphql-gateway"
    # KAFKA_GROUP_ID deliberately NOT set (removed 2026-10-06): every replica must
    # receive every event for its own subscription buffer, so the gateway derives a
    # per-pod group (graphql-gateway-<pod name>, no offset commits). A shared fixed
    # id here would split the partitions between the two replicas.
    - name: KAFKA_AI_EVENTS_TOPIC
      value: "ai.gateway.events"
    - name: ARGOCD_SERVER
      value: "argocd-server.argocd.svc:443"
    - name: ARGOCD_USERNAME
      valueFrom:
        secretKeyRef:
          name: gateway-credentials
          key: argocd-username
    - name: ARGOCD_PASSWORD
      valueFrom:
        secretKeyRef:
          name: gateway-credentials
          key: argocd-password
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: gateway-credentials
          key: github-token
    - name: GITHUB_OWNER
      value: "maxjeffwell"
    - name: GOTIFY_URL
      value: "http://gotify.monitoring.svc:80"
    - name: GOTIFY_TOKEN
      valueFrom:
        secretKeyRef:
          name: gateway-credentials
          key: gotify-token
    - name: NETVIS_SSH_KEY_PATH
      value: "/etc/netvis/id_ed25519"
    - name: MIMIR_URL
      value: "http://mimir-monolithic.monitoring.svc.cluster.local:8080/prometheus"
    - name: GARAGE_ADMIN_URL
      value: "http://garage.monitoring.svc.cluster.local:3903"
    - name: NETWORK_TOPOLOGY_INTERVAL_MS
      value: "30000"

initContainers:
  - name: wait-for-kafka
    image: busybox:1.37
    command: ['sh', '-c', 'until nc -z vertex-kafka-kafka-bootstrap.microservices.svc 9092; do echo "Waiting for Kafka..."; sleep 5; done']
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi

serviceAccount:
  create: false
  name: gateway-sa

podSecurityContext: {}

securityContext: {}

ingress:
  enabled: true
  host: gateway.el-jefe.me

livenessProbeServer:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbeServer:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

volumes:
  - name: netvis-ssh-key
    secret:
      secretName: netvis-ssh-key
      defaultMode: 0600

volumeMounts:
  - name: netvis-ssh-key
    mountPath: /etc/netvis
    readOnly: true

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - "true"
