# CrowdSec LAPI's database password on the native Patroni HA cluster (VIP 192.168.50.60:5000, db/role `crowdsec`).
# Consumed by the monitoring chart (crowdsec-lapi Deployment env CROWDSEC_DB_PASSWORD) (2026-10-23).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-lapi-db
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: crowdsec-lapi-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: CROWDSEC_DB_PASSWORD
