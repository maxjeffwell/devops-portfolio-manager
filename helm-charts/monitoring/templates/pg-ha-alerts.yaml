{{- if .Values.pgHa.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pg-ha-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: pg-ha
      rules:
        - alert: PgHaNoLeader
          expr: sum(patroni_primary{job="pg-ha-patroni"}) < 1
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: pg-ha has no Patroni leader
            description: No member reports itself primary. Writes on 192.168.50.60:5000 fail. Check `patronictl list` and etcd-patroni.
        - alert: PgHaMultipleLeaders
          expr: sum(patroni_primary{job="pg-ha-patroni"}) > 1
          for: 30s
          labels: {severity: critical}
          annotations:
            summary: pg-ha reports more than one leader
            description: Split-brain risk. Check etcd-patroni quorum and watchdog on each host.
        - alert: PgHaReplicationLag
          expr: |
            scalar(max(patroni_xlog_location{job="pg-ha-patroni"}))
              - (patroni_xlog_replayed_location{job="pg-ha-patroni"} and on(instance) patroni_replica{job="pg-ha-patroni"} == 1)
              > 10485760
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: pg-ha replica {{`{{ $labels.instance }}`}} more than 10 MB behind
            description: Sync replication still covers one replica, but this one would be excluded from failover past 1 MB.
        - alert: PgHaEtcdMemberDown
          expr: up{job="pg-ha-etcd"} == 0
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: pg-ha etcd member {{`{{ $labels.instance }}`}} down
            description: Patroni's etcd keeps quorum with 2/3, but one more loss stops all failovers.
        # etcd-patroni compacts itself every hour since 2026-11-28 (live data ~0.4 MB). Before that it
        # grew ~13 MB/day uncompacted toward the 2 GB quota; at the quota etcd raises NOSPACE, refuses
        # writes, and Patroni demotes the primary.
        - alert: PgHaEtcdCompactionStalled
          expr: max by (instance) (etcd_mvcc_db_total_size_in_use_in_bytes{job="pg-ha-etcd"}) > 100e6
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: pg-ha etcd {{`{{ $labels.instance }}`}} holds {{`{{ $value | humanize1024 }}`}}B of live data
            description: Normal is under 1 MB. Auto-compaction (ETCD_AUTO_COMPACTION_* in /etc/etcd-patroni/etcd.env) has stopped working. See docs/runbooks/pg-ha.md in k3s-cluster-config.
        - alert: PgHaEtcdDbNearQuota
          expr: max by (instance) (etcd_mvcc_db_total_size_in_bytes{job="pg-ha-etcd"} / etcd_server_quota_backend_bytes{job="pg-ha-etcd"}) > 0.6
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: pg-ha etcd {{`{{ $labels.instance }}`}} database at {{`{{ $value | humanizePercentage }}`}} of its quota
            description: At 100% etcd refuses writes (NOSPACE) and Patroni demotes the primary. Compact and defrag one member at a time (runbook), then disarm any NOSPACE alarm.
        - alert: PgHaVipDown
          expr: |
            up{job="pg-ha-vip"} == 0
            or haproxy_backend_active_servers{job="pg-ha-vip",proxy="primary"} < 1
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: pg-ha VIP 192.168.50.60 down or no writable leader behind it
            description: HAProxy metrics are scraped through the VIP. up==0 means keepalived/HAProxy; active_servers{proxy="primary"} < 1 means no Patroni leader passes the /primary check.
        - alert: PgHaBackupStale
          expr: |
            (time() - max(pg_ha_backup_last_success_timestamp_seconds) > 93600)
            or absent(pg_ha_backup_last_success_timestamp_seconds)
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: pg-ha base backup older than 26 h
            description: Newest pg_ha_backup.prom across hosts is stale. Check `journalctl -u pg-ha-backup` on the current primary.
        - alert: PgHaOffsiteStale
          # pg-ha-offsite.timer mirrors s3://pg-ha-backups (Garage) to B2 hourly on the current primary;
          # max() across hosts so a failover (new primary writes its own file) is handled.
          expr: |
            (time() - max(pg_ha_offsite_last_success_timestamp_seconds) > 10800)
            or absent(pg_ha_offsite_last_success_timestamp_seconds)
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: pg-ha off-site mirror to B2 older than 3 h
            description: No successful hourly mirror of pg-ha-backups to B2 garage-offsite. Check `journalctl -u pg-ha-offsite` on the current primary; a run refused by the empty-source guard or stopped by --max-delete 400 also lands here.
        - alert: PgHaDumpStale
          # pg-ha-dump.timer (04:00, primary only): pg_dumpall --globals-only + pg_dump -Fc per DB,
          # independent of barman/Garage. Two targets, one series each, max() across hosts for failovers.
          expr: |
            (time() - max(pg_ha_dump_nfs_last_success_timestamp_seconds) > 93600)
            or absent(pg_ha_dump_nfs_last_success_timestamp_seconds)
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: pg-ha logical dump to the Synology older than 26 h
            description: No successful nightly pg_dump set on the Synology. Check `journalctl -u pg-ha-dump` on the current primary; a Synology outage or a failed pg_dump/pg_restore --list lands here.
        - alert: PgHaDumpR2Stale
          expr: |
            (time() - max(pg_ha_dump_r2_last_success_timestamp_seconds) > 93600)
            or absent(pg_ha_dump_r2_last_success_timestamp_seconds)
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: pg-ha logical dump upload to Cloudflare R2 older than 26 h
            description: The Synology copy may be fine but the upload or `rclone check` to R2 failed. Check `journalctl -u pg-ha-dump` on the current primary.
        - alert: PgHaDataDiskFilling
          expr: |
            node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql"}
              / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"} < 0.20
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: pg-ha data LV on {{`{{ $labels.instance }}`}} under 20% free
            description: Usually WAL piling up because archiving to garage is failing — check pg_stat_archiver on the primary.
{{- end }}
