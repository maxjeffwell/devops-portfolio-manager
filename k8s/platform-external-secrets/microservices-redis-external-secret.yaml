# ExternalSecret microservices/microservices-redis-external-secret. Exported from the LIVE spec 2026-09-26 (was hand-applied;
# the old copies in k8s/external-secrets were stale). Verified with an empty kubectl diff.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: microservices-redis-external-secret
  namespace: microservices
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: MICROSERVICES_REDIS_PASSWORD
      metadataPolicy: None
    secretKey: redis-password
  refreshInterval: 23h43m46s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: redis
