# 2026-10-07: Intel GPU DRA (app intel-gpu-dra) replaces the device plugin's
# gpu.intel.com/i915. Used by immich-ml (dm Iris Xe) and immich-server (m920s
# UHD 630, device plugin retired the same day). adminAccess lets immich-ml share
# dm's iGPU with ovms-llm/tdarr-node (Intel's driver has no consumable capacity).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: igpu
spec:
  # metadata/allocationMode/count are the API server defaults, spelled out so
  # ArgoCD's diff matches the stored object (otherwise permanently OutOfSync).
  metadata: {}
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            allocationMode: ExactCount
            count: 1
            adminAccess: true
