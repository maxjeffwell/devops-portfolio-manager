        operator: Equal
        value: "true"
        effect: PreferNoSchedule
    nodeSelector:
      gpu-node: "true"
      intel-gpu-gen: xe
      # Second copy, on the other GPU node.
      kubernetes.io/hostname: neonmarmoset
    priorityClassName: portfolio-critical
    serviceAccountName: ovms-models
    terminationGracePeriodSeconds: 30
