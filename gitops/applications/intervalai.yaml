apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intervalai
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/maxjeffwell/devops-portfolio-manager.git
    targetRevision: main
    path: helm-charts/intervalai
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    # Only the HPA-managed server's replicas are owned outside git. Scoping by
    # name (2026-10-15) so client replica changes are still diffed and synced;
    # the unscoped rule left the clients stuck at 1 after replicaCount moved to 2.
    - group: apps
      kind: Deployment
      name: intervalai-server
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
