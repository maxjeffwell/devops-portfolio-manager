# Basic-auth users for the Traefik dashboard IngressRoute (traefik.el-jefe.me,
# defined in portfolio-orchestration-platform/k8s/ingress/traefik-dashboard-ingress.yaml).
# 2026-10-06: until now the dashboard + /api were served to the internet with NO
# authentication. The POP dashboard links to this hostname, so it stays public
# but behind basicAuth + the CrowdSec bouncer. Doppler key TRAEFIK_DASHBOARD_HTPASSWD
# holds one htpasswd line (user:bcrypt-hash).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traefik-dashboard-auth-external-secret
  namespace: kube-system
spec:
  refreshInterval: 24h11m29s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    name: traefik-dashboard-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: users
      remoteRef:
        key: TRAEFIK_DASHBOARD_HTPASSWD
