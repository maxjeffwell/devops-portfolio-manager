# ExternalSecret microservices/microservices-mongodb-external-secret. Exported from the LIVE spec 2026-09-26 (was hand-applied;
# the old copies in k8s/external-secrets were stale). Verified with an empty kubectl diff.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: microservices-mongodb-external-secret
  namespace: microservices
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: MICROSERVICES_MONGODB_ROOT_PASSWORD
      metadataPolicy: None
    secretKey: mongodb-root-password
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: MICROSERVICES_MONGODB_ROOT_PASSWORD
      metadataPolicy: None
    secretKey: mongodb-passwords
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: mongodb
