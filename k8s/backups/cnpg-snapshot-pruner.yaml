---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-snapshot-pruner
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-snapshot-pruner
  namespace: default
rules:
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["backups"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-snapshot-pruner
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-snapshot-pruner
subjects:
- kind: ServiceAccount
  name: cnpg-snapshot-pruner
  namespace: default
---
# 2026-09-25: cnpg-immich (namespace immich) was never pruned.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-snapshot-pruner
  namespace: immich
rules:
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["backups"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-snapshot-pruner
  namespace: immich
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-snapshot-pruner
subjects:
- kind: ServiceAccount
  name: cnpg-snapshot-pruner
  namespace: default
---
# 2026-10-02: cnpg-vaultwarden got a daily volumeSnapshot schedule.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-snapshot-pruner
  namespace: vaultwarden
rules:
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["backups"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-snapshot-pruner
  namespace: vaultwarden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-snapshot-pruner
subjects:
- kind: ServiceAccount
  name: cnpg-snapshot-pruner
  namespace: default
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-snapshot-pruner
  namespace: default
spec:
  timeZone: "America/New_York"
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # retry on transient API failures instead of skipping a whole day
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: cnpg-snapshot-pruner
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - marmoset
          containers:
          - name: prune
            image: alpine/k8s:1.31.0
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 128Mi
            command:
            - /bin/sh
            - -c
            # exits 1 if any list/delete failed so the Job (and CronJob status)
            # surfaces the failure instead of silently reporting success
            args:
            - |
              set -u
              RETENTION_DAYS="${RETENTION_DAYS:-7}"
              NOW=$(date -u +%s)
              CUTOFF=$((NOW - RETENTION_DAYS * 86400))
              echo "Pruning CNPG VolumeSnapshots older than ${RETENTION_DAYS} days"
              echo "Cutoff epoch: ${CUTOFF}"
              TMP=$(mktemp)
              TOTAL=0
              FAILED=0
              # namespace/cluster pairs. Deleting a VolumeSnapshot frees the Mayastor
              # snapshot only because the CNPG clusters use mayastor-snapclass-cnpg
              # (deletionPolicy Delete) since 2026-09-25; with the old Retain class
              # every pruned snapshot left an orphan backend snapshot behind.
              for pair in default/cnpg-auth default/cnpg-codetalk default/cnpg-lunary default/cnpg-bookmarked immich/cnpg-immich vaultwarden/cnpg-vaultwarden; do
                ns="${pair%%/*}"; cluster="${pair#*/}"
                echo "--- ${ns}/${cluster} ---"
                if ! kubectl get volumesnapshot -n "$ns" -l "cnpg.io/cluster=${cluster}" \
                     -o jsonpath='{range .items[*]}{.metadata.name}|{.metadata.creationTimestamp}{"\n"}{end}' > "$TMP"; then
                  echo "  ERROR: list failed for ${cluster}"
                  FAILED=$((FAILED + 1))
                  continue
                fi
                while IFS='|' read -r name created; do
                  [ -z "$name" ] && continue
                  created_epoch=$(date -u -D "%Y-%m-%dT%H:%M:%SZ" -d "$created" +%s 2>/dev/null) || continue
                  if [ "$created_epoch" -lt "$CUTOFF" ]; then
                    if kubectl delete volumesnapshot -n "$ns" "$name" --wait=false >/dev/null; then
                      echo "  deleted: $name"
                      TOTAL=$((TOTAL + 1))
                    else
                      echo "  FAIL: $name"
                      FAILED=$((FAILED + 1))
                    fi
                  fi
                done < "$TMP"
              done
              # 2026-10-07: also prune Backup RECORDS. Nothing else ever deleted them
              # (325 by 10/7, back to 08-08). Safe: no finalizers, snapshots have no
              # ownerRef to their Backup, and B2 data is expired by each ObjectStore's
              # own retentionPolicy (30d), never by deleting the record. Records go
              # once the data they describe has aged out:
              #   volumeSnapshot completed > RETENTION_DAYS (its snapshot is gone)
              #   plugin (B2) completed    > PLUGIN_RECORD_DAYS (30d retention + margin)
              #   failed (any method)      > FAILED_RECORD_DAYS (alert stays visible)
              PLUGIN_RECORD_DAYS="${PLUGIN_RECORD_DAYS:-35}"
              FAILED_RECORD_DAYS="${FAILED_RECORD_DAYS:-3}"
              RECORDS=0
              for ns in default immich vaultwarden; do
                echo "--- Backup records in ${ns} ---"
                if ! kubectl get backups.postgresql.cnpg.io -n "$ns" \
                     -o jsonpath='{range .items[*]}{.metadata.name}|{.metadata.creationTimestamp}|{.spec.method}|{.status.phase}{"\n"}{end}' > "$TMP"; then
                  echo "  ERROR: list failed in ${ns}"
                  FAILED=$((FAILED + 1))
                  continue
                fi
                while IFS='|' read -r name created method phase; do
                  [ -z "$name" ] && continue
                  created_epoch=$(date -u -D "%Y-%m-%dT%H:%M:%SZ" -d "$created" +%s 2>/dev/null) || continue
                  case "$phase" in
                    failed) days="$FAILED_RECORD_DAYS" ;;
                    completed)
                      if [ "$method" = "plugin" ]; then days="$PLUGIN_RECORD_DAYS"; else days="$RETENTION_DAYS"; fi ;;
                    *) continue ;;  # running/pending/unknown: never touch
                  esac
                  if [ "$created_epoch" -lt $((NOW - days * 86400)) ]; then
                    if kubectl delete backups.postgresql.cnpg.io -n "$ns" "$name" --wait=false >/dev/null; then
                      echo "  deleted record: $name (${method:-?}/${phase})"
                      RECORDS=$((RECORDS + 1))
                    else
                      echo "  FAIL record: $name"
                      FAILED=$((FAILED + 1))
                    fi
                  fi
                done < "$TMP"
              done
              rm -f "$TMP"
              echo "Total deleted: ${TOTAL} snapshots, ${RECORDS} records, failures: ${FAILED}"
              [ "$FAILED" -eq 0 ] || exit 1
