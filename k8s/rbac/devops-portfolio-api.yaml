apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-portfolio-api
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helm-viewer
# Read-only since 2026-11-21. The API (Podrick) runs `helm list -A`, `helm get`
# and `helm history`; Helm keeps releases in Secrets and RBAC cannot filter
# Secrets by type, so cluster-wide Secret READ is unavoidable for this app.
# update/patch/delete were removed together with the API's rollback route: they
# let an internet-facing app (basic-auth only) rewrite any Secret or ConfigMap,
# and the rollback could not patch Deployments with this role anyway.
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-portfolio-api-helm-viewer
subjects:
- kind: ServiceAccount
  name: devops-portfolio-api
  namespace: default
roleRef:
  kind: ClusterRole
  name: helm-viewer
  apiGroup: rbac.authorization.k8s.io
