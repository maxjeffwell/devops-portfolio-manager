priorityClassName: portfolio-app
replicaCount: 1

# 2026-10-01: Recreate -> RollingUpdate (maxUnavailable 0) and 2 replicas for the
# server so deploys and node reboots are zero-downtime; the client is unaffected
# (HPA + PDB are rendered for the server component only).
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  server:
    repository: maxjeffwell/educationelly-graphql-server
    tag: 20261007-062928-e889f24
    pullPolicy: Always
  client:
    repository: maxjeffwell/educationelly-graphql-client
    tag: 20261007-062928-e889f24
    pullPolicy: Always
service:
  server:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    nodePort: 30009
  client:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30010
resources:
  server:
    # 2026-09-07: cpu 200m -> 100m, measured 2-day peak 17m. Memory left alone
    # (peak 218Mi vs a 256Mi request) -- that one was already about right.
    # NOTE: bookmarked-server was deliberately NOT cut the same way; it peaks at
    # 164m against its 200m request, so it is correctly sized as-is.
    # 2026-09-30: REVERTED to 200m. Over 30 days the server sits at ~100m for
    # hours (7d p95 100m, peak 134m) -- the 2-day sample was a quiet spell and
    # the pod has been running AT its request. Size to 30-day peaks, not p95.
    limits:
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  client:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
autoscaling:
  enabled: true
  minReplicas: 2
  # 2026-10-07: 2 -> 4 (min == max pinned the HPA; same fix as bookmarked accb55c).
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1
env:
  server:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "8000"
    - name: ALLOWED_ORIGINS
      value: "https://educationelly-graphql-k8s.el-jefe.me"
    - name: MONGODB_URI
      valueFrom:
        secretKeyRef:
          name: educationelly-graphql-secret
          key: MONGODB_URI
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: educationelly-graphql-secret
          key: JWT_SECRET
    - name: SENTRY_DSN
      valueFrom:
        secretKeyRef:
          name: educationelly-graphql-secret
          key: SENTRY_DSN
    # MongoDB Connection Pool Configuration
    # min=2 reduces startup time; connections scale up on demand
    - name: MONGODB_POOL_MIN_SIZE
      value: "2"
    - name: MONGODB_POOL_MAX_SIZE
      value: "50"
    - name: MONGODB_MAX_IDLE_TIME_MS
      value: "30000"
    - name: MONGODB_WAIT_QUEUE_TIMEOUT_MS
      value: "5000"
    - name: MONGODB_SERVER_SELECTION_TIMEOUT_MS
      value: "5000"
  client:
    - name: REACT_APP_GRAPHQL_URL
      value: "http://educationelly-graphql-server:8000/graphql"
serviceAccount:
  create: false
podSecurityContext:
  fsGroup: 2000
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  runAsUser: 1001

# Client-specific security context (nginx needs root for PID file)
securityContextClient:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: false

# Startup probe gates liveness/readiness until the server is ready
# babel-node compilation + MongoDB pool init can take 60-90s on a loaded node
startupProbeServer:
  httpGet:
    path: /health
    port: 8000
  failureThreshold: 30
  periodSeconds: 5
  timeoutSeconds: 5
  # 30 * 5s = 150s max startup time before pod is killed

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

# Client-specific probes (nginx on port 80)
livenessProbeClient:
  tcpSocket:
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbeClient:
  tcpSocket:
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5

# ⚠️ CRITICAL SECURITY WARNING ⚠️
# NEVER commit real secrets to Git repositories!
# Use one of these secure alternatives:
#
# Option 1: External Secrets Operator (Recommended for production)
# externalSecret:
#   enabled: true
#   backendType: gcpSecretsManager  # or awsSecretsManager, azureKeyVault
#   projectID: your-project-id
#   data:
#     - key: educationelly-graphql-mongodb-uri
#       name: MONGODB_URI
#     - key: educationelly-graphql-jwt-secret
#       name: JWT_SECRET
#
# Option 2: Sealed Secrets (GitOps-friendly)
# kubectl create secret generic educationelly-graphql-secret \
#   --from-literal=MONGODB_URI='your-uri' \
#   --from-literal=JWT_SECRET='your-secret' \
#   --dry-run=client -o yaml | \
#   kubeseal -o yaml > sealed-secret.yaml
#
# Option 3: Helm values override at deploy time (for development)
# helm install educationelly-graphql . --set secret.data.MONGODB_URI='...' --set secret.data.JWT_SECRET='...'
#
# Cloud Database Configuration
# IMPORTANT: Replace these placeholders before deployment
secret:
  # Secrets managed externally - do not recreate
  data:
    # Base64 encode your MongoDB Atlas connection string:
    # echo -n "mongodb+srv://user:pass@cluster.mongodb.net/educationelly-graphql" | base64
    MONGODB_URI: "REPLACE_WITH_BASE64_ENCODED_MONGODB_ATLAS_URI"

    # Base64 encode your JWT secret (use strong random string):
    # openssl rand -base64 32 | base64
    JWT_SECRET: "REPLACE_WITH_BASE64_ENCODED_JWT_SECRET"

# Ingress Configuration
ingress:
  enabled: true
  host: educationelly-graphql-k8s.el-jefe.me
  apiPaths:
    - /graphql

# MongoDB Configuration
mongodb:
  enabled: false
  # Backup configuration (mongodump to Garage S3)
  backup:
    enabled: true
    schedule: "10 3 * * *"
    b2Bucket: "app-dumps"
    b2Endpoint: "http://garage.monitoring.svc.cluster.local:3900"
    b2SecretName: "garage-velero-creds"
    retentionDays: 30
  # Connection Pool Configuration
  # These settings prevent connection exhaustion under load
  pool:
    # Minimum number of connections to maintain
    minSize: 10
    # Maximum number of connections allowed
    maxSize: 50
    # Time (ms) before idle connections are closed
    maxIdleTimeMs: 30000
    # Timeout (ms) for waiting for available connection
    waitQueueTimeoutMs: 5000
    # Timeout (ms) for server selection
    serverSelectionTimeoutMs: 5000

topologySpreadConstraints:
  enabled: true
  maxSkew: 1

nodeSelector: {}

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - "true"

# Static client runs on the edge node next to Traefik (assets served from the public IP,
# no home round-trip); API calls already go browser -> Traefik -> server via ingress paths.
nodeSelectorClient:
  role: edge
tolerationsClient:
  - key: role
    operator: Equal
    value: edge
    effect: PreferNoSchedule
