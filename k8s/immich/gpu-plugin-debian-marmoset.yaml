# Intel GPU device plugin instance for debian-marmoset's Iris Xe (Alder Lake).
# Was a hand-applied, untracked CR selecting gpu-node=true (2026-09-30: brought
# into git and switched to a hostname selector like its four siblings, because
# gpu-node=true is now a FACT label on every i915 node and would otherwise
# schedule a second plugin instance onto each of them). 4 shares of the one iGPU.
apiVersion: deviceplugin.intel.com/v1
kind: GpuDevicePlugin
metadata:
  name: gpudeviceplugin-debian-marmoset
spec:
  image: intel/intel-gpu-plugin:0.35.0
  sharedDevNum: 4
  nodeSelector:
    kubernetes.io/hostname: debian-marmoset
