apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-orchestration-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/maxjeffwell/portfolio-orchestration-platform.git
      targetRevision: main
      path: k8s/deployments
    # POP's own ingresses (pop-portfolio.el-jefe.me, portfolio-api). Still also
    # holds 3 pre-existing non-POP ingresses (ai-gateway, argocd,
    # traefik-dashboard) -- candidates to move out like the 2026-09-26 batch.
    - repoURL: https://github.com/maxjeffwell/portfolio-orchestration-platform.git
      targetRevision: main
      path: k8s/ingress
    - repoURL: https://github.com/maxjeffwell/portfolio-orchestration-platform.git
      targetRevision: main
      path: k8s/services
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Replicas are tuned out-of-band by HPA / manual scale on the platform deployments;
  # ignore so ArgoCD doesn't fight scaling decisions.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
