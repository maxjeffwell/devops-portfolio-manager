apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podrick-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: podrick.el-jefe.me
    http:
      paths:
      - backend:
          service:
            name: devops-portfolio-dashboard
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - podrick.el-jefe.me
    secretName: podrick-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-devops-api-prefix
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /devops-api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: podrick-api-route
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`podrick.el-jefe.me`) && PathPrefix(`/devops-api`)
      kind: Rule
      middlewares:
        - name: strip-devops-api-prefix
      services:
        - name: devops-portfolio-api
          port: 5001
  tls:
    secretName: podrick-tls
---
# podrick-api: /api -> devops-portfolio-api:5001 WITHOUT prefix strip (the API serves
# /api/*). Older sibling of podrick-api-route (/devops-api, stripped). Adopted from
# the live cluster 2026-09-26; possibly redundant -- remove only after confirming
# nothing calls https://podrick.el-jefe.me/api/.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: podrick-api
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`podrick.el-jefe.me`) && PathPrefix(`/api`)
    services:
    - name: devops-portfolio-api
      port: 5001
  tls:
    secretName: podrick-tls
---
# devops-api route (Ingress + its 2 Middlewares). Moved 2026-09-26 from the
# portfolio-orchestration-platform repo; was hand-applied before that.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-api-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd,default-devops-api-cors@kubernetescrd,default-devops-api-stripprefix@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: '200'
spec:
  ingressClassName: traefik
  rules:
  - host: podrick.el-jefe.me
    http:
      paths:
      - path: /devops-api
        pathType: Prefix
        backend:
          service:
            name: devops-portfolio-api
            port:
              number: 5001
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: devops-api-cors
  namespace: default
spec:
  headers:
    accessControlAllowOriginList:
    - https://el-jefe.me
    accessControlAllowMethods:
    - GET
    - POST
    - OPTIONS
    accessControlAllowHeaders:
    - Content-Type
    - Authorization
    accessControlMaxAge: 86400
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: devops-api-stripprefix
  namespace: default
spec:
  stripPrefix:
    prefixes:
    - /devops-api
