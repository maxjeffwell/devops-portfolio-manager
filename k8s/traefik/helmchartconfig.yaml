apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      websecure:
        forwardedHeaders:
          trustedIPs:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32
          - 10.42.0.0/16
          - 10.43.0.0/16
      xray:
        port: 2083
        expose:
          default: true
        exposedPort: 2083
        protocol: TCP
    experimental:
      plugins:
        crowdsec-bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.3.5
    service:
      spec:
        externalTrafficPolicy: Local
    logs:
      access:
        enabled: true
        format: json
        filePath: "/var/log/traefik/access.log"
    deployment:
      # 2 replicas on the edge node (2026-09-25): zero-downtime rollouts and a PDB
      # that permits one disruption. Both stay on role=edge via nodeSelector, so the
      # old failure (spare replica on m720q, no wg0 route to headscale's
      # Endpoints 10.0.0.9:8081 -> ~50% 504s) cannot recur. Anti-affinity is
      # only *preferred*, so replicas spread if a second edge node ever exists.
      replicas: 2
      additionalVolumes:
      - name: access-logs
        hostPath:
          path: /var/log/traefik
          type: DirectoryOrCreate
      - name: crowdsec-lapi-key
        secret:
          secretName: crowdsec-bouncer-lapi-key
      initContainers:
      - name: fix-log-permissions
        image: busybox:1.37
        # Per-pod log dir (main container mounts it via subPathExpr) must be
        # writable by uid 65532; kubelet would create it root-owned.
        command: ["sh", "-c", "mkdir -p /var/log/traefik/$POD_NAME && chown 65532:65532 /var/log/traefik /var/log/traefik/$POD_NAME"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - name: access-logs
          mountPath: /var/log/traefik
    additionalVolumeMounts:
    - name: access-logs
      mountPath: /var/log/traefik
      # One file per replica on the host: /var/log/traefik/<pod>/access.log
      # (crowdsec globs /var/log/traefik/*/access.log). POD_NAME is set by the chart.
      subPathExpr: $(POD_NAME)
    - name: crowdsec-lapi-key
      mountPath: /etc/crowdsec
      readOnly: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - traefik
            topologyKey: kubernetes.io/hostname
    # Public entry point gets reserved capacity (actual ~7m CPU / ~100Mi).
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Chart key is top-level `updateStrategy` (a `deployment.strategy` key here was
    # silently ignored). Surge first => zero-downtime rollouts with 2 replicas.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # Public origin is the edge VPS only (LAN DNS sends every el-jefe.me name to
    # Cloudflare/the VPS), and it is the only node with wg0 to dm for headscale.
    # Pinned by role label (not hostname) so a VPS swap is a relabel; the edge
    # node's public IP lives only in DNS record edge.el-jefe.me. 2026-09-25:
    # vmi2951245 -> vmi3610371.
    nodeSelector:
      role: edge
