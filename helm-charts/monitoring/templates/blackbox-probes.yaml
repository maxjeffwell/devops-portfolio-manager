        tier: ops
---
# --- ICMP ---------------------------------------------------------------------
# Targets are Tailscale IPs, not names: MagicDNS names NXDOMAIN inside the pod
# (verified 2026-11-05) and an IP target keeps a DNS fault from masquerading
# as a node outage. The relabelings add a human `host` label per IP;
# `instance` stays the IP. Keep this list in step with `tailscale status`.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: icmp-nodes-probe
  namespace: {{ .Release.Namespace }}
  labels:
    app: blackbox-exporter
    probe-type: icmp
    release: {{ .Release.Name }}
spec:
  jobName: icmp-nodes
  module: icmp
  interval: 30s
  scrapeTimeout: 10s
  prober:
    url: blackbox-exporter.{{ .Release.Namespace }}.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - 100.64.0.2     # m920s
        - 100.64.0.3     # marmoset
        - 100.64.0.8     # elitedesk
        - 100.64.0.11    # m720q
        - 100.64.0.12    # debian-marmoset
        - 100.64.0.15    # neonmarmoset
        - 100.64.0.14    # vmi3610371 (self; loopback over tailscale0)
      labels:
        probe_type: icmp
        tier: nodes
      relabelingConfigs:
        - {sourceLabels: [instance], regex: '100\.64\.0\.2',  targetLabel: host, replacement: m920s}
        - {sourceLabels: [instance], regex: '100\.64\.0\.3',  targetLabel: host, replacement: marmoset}
        - {sourceLabels: [instance], regex: '100\.64\.0\.8',  targetLabel: host, replacement: elitedesk}
        - {sourceLabels: [instance], regex: '100\.64\.0\.11', targetLabel: host, replacement: m720q}
        - {sourceLabels: [instance], regex: '100\.64\.0\.12', targetLabel: host, replacement: debian-marmoset}
        - {sourceLabels: [instance], regex: '100\.64\.0\.15', targetLabel: host, replacement: neonmarmoset}
        - {sourceLabels: [instance], regex: '100\.64\.0\.14', targetLabel: host, replacement: vmi3610371}
---
# Home infrastructure reachable over Tailscale. be88u (100.64.0.6) is NOT
# listed: it does not answer ICMP on its Tailscale address (verified
# 2026-11-05, 5 s timeout), so it would be a permanent false alarm.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: icmp-infra-probe
  namespace: {{ .Release.Namespace }}
  labels:
    app: blackbox-exporter
    probe-type: icmp
    release: {{ .Release.Name }}
spec:
  jobName: icmp-infra
  module: icmp
  interval: 30s
  scrapeTimeout: 10s
  prober:
    url: blackbox-exporter.{{ .Release.Namespace }}.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - 100.64.0.5     # asustor
        - 100.64.0.9     # synology
        - 100.64.0.7     # ax86u (AX86U Pro)
        - 100.64.0.13    # axe7800
      labels:
        probe_type: icmp
        tier: infra
      relabelingConfigs:
        - {sourceLabels: [instance], regex: '100\.64\.0\.5',  targetLabel: host, replacement: asustor}
        - {sourceLabels: [instance], regex: '100\.64\.0\.9',  targetLabel: host, replacement: synology}
        - {sourceLabels: [instance], regex: '100\.64\.0\.7',  targetLabel: host, replacement: ax86u}
        - {sourceLabels: [instance], regex: '100\.64\.0\.13', targetLabel: host, replacement: axe7800}
---
# Control group: public anycast resolvers. Both failing = the VPS lost
# internet egress, which also explains every other probe going red at once.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: icmp-internet-probe
  namespace: {{ .Release.Namespace }}
  labels:
    app: blackbox-exporter
    probe-type: icmp
    release: {{ .Release.Name }}
spec:
  jobName: icmp-internet
  module: icmp
  interval: 30s
  scrapeTimeout: 10s
  prober:
    url: blackbox-exporter.{{ .Release.Namespace }}.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - 1.1.1.1
        - 8.8.8.8
      labels:
        probe_type: icmp
        tier: internet
      relabelingConfigs:
        - {sourceLabels: [instance], regex: '1\.1\.1\.1', targetLabel: host, replacement: cloudflare}
        - {sourceLabels: [instance], regex: '8\.8\.8\.8', targetLabel: host, replacement: google}
