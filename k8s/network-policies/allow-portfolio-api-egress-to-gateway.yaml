# NetworkPolicy default/allow-portfolio-api-egress-to-gateway. Exported from the live cluster 2026-09-26 (it was
# hand-applied, tracked by nothing); verified with an empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portfolio-api-egress-to-gateway
  namespace: default
spec:
  egress:
  - ports:
    - port: 8002
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: shared-ai-gateway
  podSelector:
    matchLabels:
      app: portfolio-api
  policyTypes:
  - Egress
