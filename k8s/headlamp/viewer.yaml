# Read-only permissions for Headlamp's own service account `headlamp` (created
# by the chart). Since 2026-11-27 Headlamp runs with unsafeUseServiceAccountToken
# behind the admin basic auth (see helm-charts/headlamp/values-override.yaml), so
# everything anyone sees in the UI is limited to this: the built-in `view` role
# (no Secrets) plus Kubescape's results. Nothing can be changed through the UI,
# so the Kubescape plugin's editing features (custom frameworks, exceptions) are
# unavailable.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
---
# Kubescape stores its results in an aggregated API (spdx.softwarecomposition.
# kubescape.io) that `view` does not cover.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-kubescape-read
rules:
  - apiGroups: ["spdx.softwarecomposition.kubescape.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubescape.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-kubescape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-kubescape-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
