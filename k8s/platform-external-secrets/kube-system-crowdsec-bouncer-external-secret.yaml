# ExternalSecret kube-system/crowdsec-bouncer-external-secret. Exported from the LIVE spec 2026-09-26 (was hand-applied;
# the old copies in k8s/external-secrets were stale). Verified with an empty kubectl diff.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-bouncer-external-secret
  namespace: kube-system
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: CROWDSEC_LAPI_KEY
      metadataPolicy: None
    secretKey: lapi-key
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: crowdsec-bouncer-lapi-key
