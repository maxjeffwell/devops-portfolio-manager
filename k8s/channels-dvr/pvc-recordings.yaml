# Standby's /shares/DVR (Channels DVR dir incl. Database/). The standby has
# recording passes DISABLED, so this only grows after a failover.
#
# 2026-08-29: moved to NFS on the ASUSTOR /volume1 pool (pv-recordings.yaml)
# — the "move it to the NAS if that ever becomes permanent" note below came
# due. New PVC name because storageClassName/volumeName are immutable.
#
# History:
# 2026-07-25..2026-08-23: static local PV on the 1TB ex-HDHomeRun WD My
# Passport (channels-usb). Dropped: the drive failed to spin up at boot, and
# its hung SCSI probe blocked every kernel module load for 3 minutes
# (k3s-agent stuck "activating"); when it was absent, a local PV at the bare
# mountpoint silently wrote to the root NVMe instead.
# 2026-08-23..2026-08-29: local-path on the root NVMe as warm-standby scratch.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: channels-dvr-recordings-nfs
  namespace: channels-dvr
  labels:
    app: channels-dvr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: channels-dvr-recordings-nfs
  resources:
    requests:
      storage: 500Gi
