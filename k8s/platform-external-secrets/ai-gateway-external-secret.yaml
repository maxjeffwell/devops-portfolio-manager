# ExternalSecret for the shared AI gateway credentials.
# Regenerated from the live object 2026-09-26 (the previous version was stale:
# it lacked HUGGINGFACE_API_KEY and LUNARY_PUBLIC_KEY, which the gateway uses). LUNARY_PUBLIC_KEY had been added live with kubectl patch, so it was missing
# from last-applied too; added here. Verified with an empty kubectl diff.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-gateway-external-secret
  namespace: default
spec:
  data:
  - remoteRef:
      key: HUGGINGFACE_API_KEY
    secretKey: HUGGINGFACE_API_KEY
  - remoteRef:
      key: ANTHROPIC_API_KEY
    secretKey: ANTHROPIC_API_KEY
  - remoteRef:
      key: GROQ_API_KEY
    secretKey: GROQ_API_KEY
  - remoteRef:
      key: RUNPOD_API_KEY
    secretKey: RUNPOD_API_KEY
  - remoteRef:
      key: RUNPOD_ENDPOINT_ID
    secretKey: RUNPOD_ENDPOINT_ID
  - remoteRef:
      key: LUNARY_PUBLIC_KEY
    secretKey: LUNARY_PUBLIC_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ai-gateway-credentials
