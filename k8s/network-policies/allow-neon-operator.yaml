# NetworkPolicy default/allow-neon-operator. Exported from the live cluster 2026-09-26 (it was
# hand-applied, tracked by nothing); verified with an empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-neon-operator
  namespace: default
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kb-system
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: neon-cluster
  policyTypes:
  - Ingress
