---
# Seeds Stirling PDF's first admin account. These two variables are consumed
# via envsFrom (helm-charts/stirling-pdf/values-override.yaml) and are only
# read when the H2 database at /configs is EMPTY — on an existing database
# they are ignored, so rotating the password here does not change a live
# account. Change the password in the app's own account settings instead, and
# keep Doppler in sync for the next rebuild.
#
# ⚠ If this secret is absent at first boot, Stirling falls back to its
# documented default of admin/stirling without erroring.
#
# Doppler (portfolio/prd) must hold STIRLING_ADMIN_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stirling-pdf-admin
  namespace: stirling-pdf
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  data:
    - remoteRef:
        key: STIRLING_ADMIN_PASSWORD
      secretKey: password
  target:
    name: stirling-pdf-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        SECURITY_INITIALLOGIN_USERNAME: "maxjeffwell"
        SECURITY_INITIALLOGIN_PASSWORD: "{{ .password }}"
