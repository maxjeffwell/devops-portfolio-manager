apiVersion: v1
kind: Service
metadata:
  name: ovms-embeddings
  namespace: ovms
  labels:
    app: ovms-embeddings
spec:
  type: ClusterIP
  # Alias onto the KServe-managed pods (both copies) so callers
  # keep http://ovms-embeddings.ovms:8000.
  selector:
    model-group: retrieval
  ports:
    - { name: rest, port: 8000, targetPort: 8000, protocol: TCP }
    - { name: grpc, port: 9000, targetPort: 9000, protocol: TCP }
