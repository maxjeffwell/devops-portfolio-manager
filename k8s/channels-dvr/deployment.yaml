# Channels DVR WARM STANDBY for the primary on the ASUSTOR (192.168.50.142:8089).
# Pinned to m920s (2026-09-25; was debian-marmoset): TVE (Spectrum)
# authenticates against the home egress IP, so this can never run on the
# cloud nodes. hostPort 8089 now answers at 192.168.50.155 / 100.64.0.2.
#
# Pod network + container hostPort 8089: LAN clients still reach it at
# 192.168.50.155:8089 (tailnet: 100.64.0.2:8089) because portmap binds the
# node port and DNATs to the pod — but unlike hostNetwork, traffic traverses
# the pod veth so networkpolicy.yaml is actually enforced. Trade-off: no
# bonjour/mDNS discovery; Channels clients add the server by ip:port manually.
#
# Upstream docker docs use --net=host purely for Bonjour client discovery;
# we trade that for an enforceable NetworkPolicy (see networkpolicy.yaml) —
# clients add the server manually as 192.168.50.152:8089.
#
# Standby discipline: same sources configured, recording passes DISABLED.
# Both servers share the same Spectrum TVE ~3-stream cap (enforced at the
# provider by egress IP, not per server). On primary failure: restore the
# newest /channels-dvr/primary-db-backups snapshot via the UI, enable passes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channels-dvr
  namespace: channels-dvr
  labels:
    app: channels-dvr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: channels-dvr
  template:
    metadata:
      labels:
        app: channels-dvr
      annotations:
        # primary is a 125GB ROX NFS mount of the ASUSTOR's live DVR data —
        # not k8s state. A full kopia upload can't finish inside Velero's 4h
        # fs-backup-timeout, and the nightly failure wedged node-agent
        # data-path slots, starving every other backup on this node.
        # recordings is bulk DVR media with the same problem: its PVB crawled
        # at ~20KB/s past the timeout on 8/8, cascading ~80 errors into the
        # daily backup as every later item hit the exhausted context.
        backup.velero.io/backup-volumes-excludes: primary,recordings
    spec:
      # Soft preference for neonmarmoset (2026-09-30; was m920s from 2026-09-26,
      # and a hard hostname pin before that which left DVR down for the whole
      # 9/26 15:35–16:37 m920s power-off). The i915 request limits it to iGPU
      # nodes with a GpuDevicePlugin (m920s/elitedesk/m720q/dm/neonmarmoset)
      # and the Mayastor data PV limits it to csi-node=mayastor
      # (m920s/elitedesk/m720q/neonmarmoset) — together: any of the 4 home
      # servers. Moved to relieve m920s memory requests.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [neonmarmoset]
      containers:
        - name: channels-dvr
          # :tve, not :latest — the default image is Alpine WITHOUT Chrome;
          # TV Everywhere login drives a headless Chrome server-side, so the
          # Spectrum TVE source only works on the Debian-based tve variant.
          image: fancybits/channels-dvr:tve
          env:
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 8089
              hostPort: 8089
              name: http
          volumeMounts:
            - name: data
              mountPath: /channels-dvr
            - name: recordings
              # /shares/DVR is the path the image's setup UI offers by default
              mountPath: /shares/DVR
            - name: primary
              mountPath: /primary
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              gpu.intel.com/i915: "1"
            limits:
              memory: 4Gi
              gpu.intel.com/i915: "1"
          readinessProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: channels-dvr-data
        - name: recordings
          persistentVolumeClaim:
            claimName: channels-dvr-recordings-nfs
        - name: primary
          persistentVolumeClaim:
            claimName: channels-dvr-primary-data
            readOnly: true
