{{- if .Values.database.expose.enabled }}
# Public Postgres endpoint for firebook's Firebase Cloud Functions (they run in
# Google Cloud and cannot reach ClusterIPs). Traefik terminates TLS using
# Postgres STARTTLS + SNI, so only TLS clients that ask for this exact hostname
# are routed. Auth = md5 password of the "firebook" role, which is the only
# role allowed to CONNECT to the firebook database.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: firebook-db
  namespace: {{ .Release.Namespace }}
spec:
  secretName: firebook-db-tls
  dnsNames:
    - {{ .Values.database.expose.host }}
  # HTTP-01 through edge Traefik (port 80). DNS-01 stalled 2026-10-01: Cloudflare's
  # nameservers never served the _acme-challenge TXT for this name.
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: firebook-db
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`{{ .Values.database.expose.host }}`)
      services:
        - name: {{ .Values.database.expose.service }}
          port: {{ .Values.database.expose.port }}
  tls:
    secretName: firebook-db-tls
    options:
      name: firebook-db-postgres-alpn
---
# libpq >= 17 refuses TLS unless the server negotiates ALPN "postgresql"
# ("SSL error: no application protocol"). node-postgres doesn't care, psql does.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: firebook-db-postgres-alpn
  namespace: {{ .Release.Namespace }}
spec:
  minVersion: VersionTLS12
  alpnProtocols:
    - postgresql
{{- end }}
