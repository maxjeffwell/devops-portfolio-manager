# NetworkPolicy argocd/allow-devops-api-ingress. Exported from the LIVE spec
# 2026-09-26 (hand-applied; missed by earlier scans that skipped the argocd
# namespace). Empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-devops-api-ingress
  namespace: argocd
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
      podSelector:
        matchLabels:
          app: devops-portfolio-api
    ports:
    - port: 8080
      protocol: TCP
    - port: 80
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
  - Ingress
