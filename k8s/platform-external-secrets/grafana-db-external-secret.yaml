# Grafana's database password on the native Patroni HA cluster (VIP 192.168.50.60:5000, db/role `grafana`).
# Consumed by the monitoring chart via grafana.envValueFrom GF_DATABASE_PASSWORD (2026-10-23).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: GRAFANA_DB_PASSWORD
