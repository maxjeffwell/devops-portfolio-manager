apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-secrets
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 24h12m50s
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: vaultwarden-secrets
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: VAULTWARDEN_ADMIN_TOKEN
    # 2026-10-23: DB moved from CNPG (cnpg-vaultwarden) to the native Patroni HA cluster
    # (VIP 192.168.50.60:5000, PG 18, sslmode=require). CNPG cluster kept for a week as rollback.
    - secretKey: DATABASE_URL
      remoteRef:
        key: VAULTWARDEN_DATABASE_URL
