{{- if .Values.snmpExporter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: snmp-exporter
data:
  snmp.yml: |
    auths:
      {{ .Values.snmpExporter.auth.name }}:
        version: {{ .Values.snmpExporter.auth.version }}
        username: {{ .Values.snmpExporter.auth.username | quote }}
        security_level: {{ .Values.snmpExporter.auth.securityLevel }}
        auth_protocol: {{ .Values.snmpExporter.auth.authProtocol }}
        priv_protocol: {{ .Values.snmpExporter.auth.privProtocol }}
        # expanded at runtime via --config.expand-environment-variables;
        # DSM uses a single passphrase for both auth and privacy
        password: ${SNMP_AUTH_PASSWORD}
        priv_password: ${SNMP_AUTH_PASSWORD}
    modules:
      hrstorage:
        walk:
          - 1.3.6.1.2.1.25.1.1   # hrSystemUptime
          - 1.3.6.1.2.1.25.2.3   # hrStorageTable
          - 1.3.6.1.2.1.1.3      # sysUpTime
        get:
          - 1.3.6.1.2.1.1.3.0
        metrics:
          - name: sysUpTime
            oid: 1.3.6.1.2.1.1.3
            type: gauge
          - name: hrSystemUptime
            oid: 1.3.6.1.2.1.25.1.1
            type: gauge
          - name: hrStorageIndex
            oid: 1.3.6.1.2.1.25.2.3.1.1
            type: gauge
            indexes:
              - labelname: hrStorageIndex
                type: gauge
          - name: hrStorageType
            oid: 1.3.6.1.2.1.25.2.3.1.2
            type: OctetString
            indexes:
              - labelname: hrStorageIndex
                type: gauge
          - name: hrStorageDescr
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString
            indexes:
              - labelname: hrStorageIndex
                type: gauge
          - name: hrStorageAllocationUnits
            oid: 1.3.6.1.2.1.25.2.3.1.4
            type: gauge
            indexes:
              - labelname: hrStorageIndex
                type: gauge
            lookups:
              - labels: [hrStorageIndex]
                labelname: hrStorageDescr
                oid: 1.3.6.1.2.1.25.2.3.1.3
                type: DisplayString
          - name: hrStorageSize
            oid: 1.3.6.1.2.1.25.2.3.1.5
            type: gauge
            indexes:
              - labelname: hrStorageIndex
                type: gauge
            lookups:
              - labels: [hrStorageIndex]
                labelname: hrStorageDescr
                oid: 1.3.6.1.2.1.25.2.3.1.3
                type: DisplayString
          - name: hrStorageUsed
            oid: 1.3.6.1.2.1.25.2.3.1.6
            type: gauge
            indexes:
              - labelname: hrStorageIndex
                type: gauge
            lookups:
              - labels: [hrStorageIndex]
                labelname: hrStorageDescr
                oid: 1.3.6.1.2.1.25.2.3.1.3
                type: DisplayString
{{- end }}
