apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-vaultwarden
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Single Postgres instance pinned to debian-marmoset because:
  #  - vmi2951245 has NO outbound connectivity to Backblaze B2 (TCP connect
  #    times out), so WAL archiving must run from debian-marmoset, which reaches
  #    B2 fine; and the openebs-zfs pool only exists on vmi2951245 anyway.
  # Storage = mayastor-2 (NVMe-oF/TCP, replica=2 across debian-marmoset↔marmoset):
  # the single instance's data is replicated at the storage layer, so it survives
  # a debian-marmoset disk/node loss — storage-level redundancy under WAL PITR→B2.
  enablePDB: false
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: mayastor-2
    size: 5Gi
  # 2026-09-21 right-sizing. Without this block the namespace LimitRange
  # (default-requests) injected cpu 10m / memory 64Mi, but the postgres
  # container's 30-day peak working set is 132Mi (p50 83Mi), so the request
  # sat below steady-state usage and the pod was first in line for eviction
  # under node memory pressure. 14-day cpu peak is 9m. Limit matches the
  # other cnpg clusters.
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 20m
      memory: 192Mi
  affinity:
    # 2026-09-06: debian-marmoset is no longer a Mayastor node (laptop thermal);
    # the mayastor-2 volume is reachable from either remaining storage node.
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - elitedesk
            - m720q
  bootstrap:
    initdb:
      database: vaultwarden
      owner: vaultwarden
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: vaultwarden-b2
