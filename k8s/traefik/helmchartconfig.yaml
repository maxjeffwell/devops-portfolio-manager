apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      websecure:
        forwardedHeaders:
          trustedIPs:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32
          - 10.42.0.0/16
          - 10.43.0.0/16
      xray:
        port: 2083
        expose:
          default: true
        exposedPort: 2083
        protocol: TCP
    experimental:
      plugins:
        crowdsec-bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.3.5
    service:
      spec:
        externalTrafficPolicy: Local
    logs:
      access:
        enabled: true
        format: json
        filePath: "/var/log/traefik/access.log"
    deployment:
      # Single replica pinned to the public-origin VPS (see nodeSelector below).
      # Was 2 replicas + hostname anti-affinity for the two-VPS era; after the
      # 2nd VPS left (2026-09-06) the spare replica landed on m720q, which has
      # no wg0 route to headscale's Endpoints (10.0.0.9:8081 on dm) -> ~50% 504s.
      replicas: 1
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      additionalVolumes:
      - name: access-logs
        hostPath:
          path: /var/log/traefik
          type: DirectoryOrCreate
      - name: crowdsec-lapi-key
        secret:
          secretName: crowdsec-bouncer-lapi-key
      initContainers:
      - name: fix-log-permissions
        image: busybox:1.37
        command: ["sh", "-c", "chown 65532:65532 /var/log/traefik"]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - name: access-logs
          mountPath: /var/log/traefik
    additionalVolumeMounts:
    - name: access-logs
      mountPath: /var/log/traefik
    - name: crowdsec-lapi-key
      mountPath: /etc/crowdsec
      readOnly: true
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - traefik
          topologyKey: kubernetes.io/hostname
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # Public origin is vmi2951245 only (LAN DNS sends every el-jefe.me name to
    # Cloudflare/the VPS), and it is the only node with wg0 to dm for headscale.
    nodeSelector:
      kubernetes.io/hostname: vmi2951245
