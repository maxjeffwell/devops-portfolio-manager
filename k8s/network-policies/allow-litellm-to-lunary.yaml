# NetworkPolicy default/allow-litellm-to-lunary. Exported from the live cluster 2026-09-26 (it was
# hand-applied, tracked by nothing); verified with an empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app: litellm
    component: ai-proxy
    tier: ai
  name: allow-litellm-to-lunary
  namespace: default
spec:
  egress:
  - ports:
    - port: 3333
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lunary
  - ports:
    - port: 53
      protocol: UDP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - ports:
    - port: 443
      protocol: TCP
    to:
    - namespaceSelector: {}
  podSelector:
    matchLabels:
      app: litellm
  policyTypes:
  - Egress
