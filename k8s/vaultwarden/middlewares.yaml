# Edge middlewares for the Vaultwarden router (2026-11-22). Attached via the
# router.middlewares annotation in ingress.yaml.
#
# vaultwarden-cdn-only: accept requests only when the TCP peer is a Cloudflare
# edge (no ipStrategy → peer address, not a header). This closes the path that
# reaches the origin without the CDN, and it is what makes CF-Connecting-IP
# trustworthy as Vaultwarden's client address (IP_HEADER in deployment.yaml):
# through the CDN that header is always overwritten with the real client, and
# nobody else can reach the router to supply their own.
#
# The ranges are Cloudflare's published list (https://www.cloudflare.com/ips/)
# and must stay equal to Traefik's forwardedHeaders.trustedIPs. If Cloudflare
# adds a range and it is missing here, clients on that range get 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vaultwarden-cdn-only
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # must exist before the Ingress references it
spec:
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
---
# HSTS for this hostname only (no includeSubDomains, no preload): browsers that
# have visited once refuse plain HTTP and refuse to click through a bad cert.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vaultwarden-hsts
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # must exist before the Ingress references it
spec:
  headers:
    stsSeconds: 31536000
