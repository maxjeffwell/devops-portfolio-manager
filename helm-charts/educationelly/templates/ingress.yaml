{{- if .Values.ingress.enabled }}
{{- $hosts := list .Values.ingress.host }}
{{- range .Values.ingress.extraHosts }}{{ $hosts = append $hosts . }}{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-client-ingress
  labels:
    app: {{ .Release.Name }}
    component: client
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    {{- range $hosts }}
    - {{ . }}
    {{- end }}
    secretName: {{ .Release.Name }}-client-tls
  rules:
  {{- range $hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $.Release.Name }}-client
            port:
              number: {{ $.Values.service.client.port }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api-ingress
  labels:
    app: {{ .Release.Name }}
    component: api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "200"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    {{- range $hosts }}
    - {{ . }}
    {{- end }}
    secretName: {{ .Release.Name }}-client-tls
  rules:
  {{- range $hosts }}
  - host: {{ . }}
    http:
      paths:
      {{- range $.Values.ingress.apiPaths }}
      - path: {{ . }}
        pathType: Prefix
        backend:
          service:
            name: {{ $.Release.Name }}-server
            port:
              number: {{ $.Values.service.server.port }}
      {{- end }}
  {{- end }}
{{- end }}
