# NetworkPolicy default/allow-prometheus-scraping. Exported from the live cluster 2026-09-26 (it was
# hand-applied, tracked by nothing); verified with an empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: default
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 8000
      protocol: TCP
    - port: 8080
      protocol: TCP
    - port: 3000
      protocol: TCP
    - port: 3001
      protocol: TCP
  podSelector:
    matchLabels:
      portfolio: 'true'
  policyTypes:
  - Ingress
