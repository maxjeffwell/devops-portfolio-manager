apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-codetalk-b2-daily
  namespace: default
spec:
  schedule: "0 20 2 * * *"   # 6-field CNPG cron (UTC)
  # first base backup is taken on demand after the plugin restart (an
  # immediate one would run before the sidecar exists and fail)
  backupOwnerReference: self
  cluster:
    name: cnpg-codetalk
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
