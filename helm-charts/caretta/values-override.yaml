# Overrides for the upstream caretta chart (groundcover, v0.0.16).
#
# Caretta = eBPF service-dependency map: a privileged DaemonSet reads kernel
# socket data on every node and publishes `caretta_links_observed` on :7117.
# Installed 2026-10-06 for K8Studio; K8Studio was removed the same day. The
# agents are now scraped by Alloy into Mimir (helm-charts/monitoring
# alloy-config, prometheus.scrape "caretta") and the upstream dashboard lives
# in our Grafana (helm-charts/monitoring: grafana-dashboard-caretta). The
# bundled Grafana is disabled; the bundled Victoria Metrics is back on since
# 2026-10-07 for Radar's Live Traffic (see victoria-metrics-single below).
#
# All 7 nodes run kernel 6.12+/6.14 with BTF (/sys/kernel/btf/vmlinux) and
# debugfs mounted, verified 2026-10-06 -- CO-RE eBPF works everywhere.

image:
  # chart default is Always; no reason to re-pull on every pod restart
  pullPolicy: IfNotPresent

rbac:
  # PodSecurityPolicy was removed in k8s 1.25 (this cluster is 1.34); SCC is
  # OpenShift-only. Both would render objects the API server rejects.
  pspEnabled: false
  sccEnabled: false

# Chart default (150m / 300Mi limits) OOM-killed every agent on first start
# (2026-10-06, exit 137 on all 7 nodes before publishing a single metric): the
# agent caches every Pod/ReplicaSet/Deployment/Service in the cluster to resolve
# socket owners, and this cluster has ~600 pods. Sized with headroom; actual
# steady-state use recorded in memory once observed.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Chart default tolerates only control-plane/master taints. Added here so the
# map covers every node:
#   - marmoset: workload=laptop:NoSchedule (daily-driver laptop; runs only
#     tolerating DaemonSets; renamed from workload=gpu 2026-10-06)
#   - debian-marmoset / neonmarmoset: gpu-priority=true:PreferNoSchedule and
#     vmi3610371: role=edge:PreferNoSchedule do not block DaemonSets, listed
#     anyway so intent is explicit.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: workload
    operator: Equal
    value: laptop
    effect: NoSchedule
  - key: gpu-priority
    operator: Equal
    value: "true"
    effect: PreferNoSchedule
  - key: role
    operator: Equal
    value: edge
    effect: PreferNoSchedule

victoria-metrics-single:
  # Re-enabled 2026-10-07 for Radar's Live Traffic view: Radar's Caretta
  # integration reads the bundled caretta-vm (:8428, via kubectl port-forward)
  # and does not use a generic Prometheus/Mimir URL. Off 10/6-10/7 (K8Studio
  # removed). Alloy still scrapes the agents into Mimir for the Grafana map;
  # this VM is a second, live-only consumer. No PV on purpose -- the map is a
  # live view; history lives in Mimir.
  enabled: true
  rbac:
    # subchart (0.8.48) still templates a PodSecurityPolicy unless told not to
    pspEnabled: false

grafana:
  # We already run Grafana (monitoring ns); the upstream dashboard is loaded
  # there via the grafana_dashboard sidecar ConfigMap.
  enabled: false
