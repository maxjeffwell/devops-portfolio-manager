# Bootstrap TLS path for headscale: lets tailscaled on cluster machines reach
# control over wg0 even when k3s/traefik is completely down.
server {
    listen 10.0.0.12:8443 ssl;
    # split-horizon (2026-10-08): LAN DNS (.50.1 dnsmasq, .103 unbound, blocky) answers
    # headscale.el-jefe.me -> 192.168.50.155 so home nodes skip edge VPS/k3s/wg0
    listen 192.168.50.155:443 ssl;
    server_name headscale.el-jefe.me;

    ssl_certificate     /etc/headscale/tls/tls.crt;
    ssl_certificate_key /etc/headscale/tls/tls.key;

    # headplane UI lives in-cluster; relay to VPS ingress over wg0
    location /admin {
        proxy_pass https://10.0.0.1;
        proxy_ssl_server_name on;
        proxy_ssl_name headscale.el-jefe.me;
        proxy_set_header Host headscale.el-jefe.me;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}

# split-horizon (2026-10-08): tailscaled dials control on :80 FIRST (ts2021 Noise upgrade,
# encrypted end-to-end). If :80 is refused, its dialer falls back to bootstrap DNS (DERP ->
# public IP) and the control session lands on the edge VPS. Serve /ts2021 here; rest -> https.
server {
    listen 192.168.50.155:80;
    server_name headscale.el-jefe.me;

    location /ts2021 {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
