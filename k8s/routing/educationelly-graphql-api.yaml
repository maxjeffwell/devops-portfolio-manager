# educationelly-graphql API route + its strip-api-prefix Middleware. Moved
# 2026-09-26 from the POP repo; hand-applied before that.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: educationelly-graphql-api
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`educationelly-graphql-k8s.el-jefe.me`) && PathPrefix(`/api`)
    middlewares:
    - name: strip-api-prefix
    services:
    - name: educationelly-graphql-server
      port: 8000
  tls:
    secretName: educationelly-graphql-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: default
spec:
  stripPrefix:
    prefixes:
    - /api
