apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podrick-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # 2026-10-06 (user decision): the DevOps dashboard had no login. Shared admin
    # basic-auth (kube-system/admin-basic-auth) on EVERY podrick route: the UI, /api
    # and /devops-api (the dashboard's own same-origin calls; the browser reuses the
    # credential per host+realm). 7 days of access logs showed no caller of
    # /devops-api other than the dashboard itself -- the el-jefe.me CORS allowance
    # on devops-api-ingress is legacy and does not need an open route.
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd,kube-system-admin-basic-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: podrick.el-jefe.me
    http:
      paths:
      - backend:
          service:
            name: devops-portfolio-dashboard
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - podrick.el-jefe.me
    secretName: podrick-tls
---
# /logout: Basic auth has no session, so this route is guarded by
# kube-system/admin-basic-auth-logout (same realm, a user list that never
# matches) and always returns 401 -> the browser drops the cached admin
# credential. Higher priority than the catch-all dashboard route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: podrick-logout
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`podrick.el-jefe.me`) && Path(`/logout`)
      kind: Rule
      priority: 300
      middlewares:
        - name: crowdsec-bouncer
          namespace: kube-system
        - name: admin-basic-auth-logout
          namespace: kube-system
      services:
        - name: devops-portfolio-dashboard
          port: 80
  tls:
    secretName: podrick-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-devops-api-prefix
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /devops-api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: podrick-api-route
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`podrick.el-jefe.me`) && PathPrefix(`/devops-api`)
      kind: Rule
      middlewares:
        # 2026-10-06: CrowdSec bouncer + admin basic-auth on the API path too (the
        # HTML Ingress above has them). Cross-namespace ref needs allowCrossNamespace.
        - name: crowdsec-bouncer
          namespace: kube-system
        - name: admin-basic-auth
          namespace: kube-system
        - name: strip-devops-api-prefix
      services:
        - name: devops-portfolio-api
          port: 5001
  tls:
    secretName: podrick-tls
---
# podrick-api: /api -> devops-portfolio-api:5001 WITHOUT prefix strip (the API serves
# /api/*). Older sibling of podrick-api-route (/devops-api, stripped). Adopted from
# the live cluster 2026-09-26; possibly redundant -- remove only after confirming
# nothing calls https://podrick.el-jefe.me/api/.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: podrick-api
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`podrick.el-jefe.me`) && PathPrefix(`/api`)
    middlewares:
    - name: crowdsec-bouncer
      namespace: kube-system
    # same credential as the dashboard UI (same host + realm -> browser reuses it)
    - name: admin-basic-auth
      namespace: kube-system
    services:
    - name: devops-portfolio-api
      port: 5001
  tls:
    secretName: podrick-tls
---
# devops-api route (Ingress + its 2 Middlewares). Moved 2026-09-26 from the
# portfolio-orchestration-platform repo; was hand-applied before that.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-api-ingress
  namespace: default
  annotations:
    # websecure only (2026-10-06): a basic-auth challenge must never be issued over
    # plaintext. The web entrypoint already 301s to https before routing anyway.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd,kube-system-admin-basic-auth@kubernetescrd,default-devops-api-cors@kubernetescrd,default-devops-api-stripprefix@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: '200'
spec:
  ingressClassName: traefik
  rules:
  - host: podrick.el-jefe.me
    http:
      paths:
      - path: /devops-api
        pathType: Prefix
        backend:
          service:
            name: devops-portfolio-api
            port:
              number: 5001
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: devops-api-cors
  namespace: default
spec:
  headers:
    accessControlAllowOriginList:
    - https://el-jefe.me
    accessControlAllowMethods:
    - GET
    - POST
    - OPTIONS
    accessControlAllowHeaders:
    - Content-Type
    - Authorization
    accessControlMaxAge: 86400
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: devops-api-stripprefix
  namespace: default
spec:
  stripPrefix:
    prefixes:
    - /devops-api
