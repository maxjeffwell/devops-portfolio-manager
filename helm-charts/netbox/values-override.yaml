# NetBox (fleet inventory / source of truth), added 2026-10-23. Upstream chart netbox/netbox
# (https://charts.netbox.oss.netboxlabs.com/), version pinned in gitops/applications/netbox.yaml.
#
# State lives in Postgres on the native Patroni cluster (db/role `netbox`, VIP 192.168.50.60:5000,
# verify-full) and Redis HA (`redis.default.svc`, DB 2 tasks / DB 3 cache). No PVC (the worker
# would share a RWO volume with the web pods): media (image attachments) lives in Garage, see storages.
# Servers only: the VPS cannot reach the VIP and the GPU nodes are not for this.
# Secrets: Doppler NETBOX_* -> ExternalSecret netbox-secrets (below, extraDeploy).
# extraDeploy goes through Helm's tpl: ESO template fields are escaped as '{{ "{{ .x }}" }}'.

fullnameOverride: netbox

superuser:
  name: admin
  existingSecret: netbox-superuser

existingSecret: netbox-secrets

allowedHosts:
  - netbox.el-jefe.me
allowedHostsIncludesPodIP: true

csrf:
  trustedOrigins:
    - https://netbox.el-jefe.me

loginRequired: true
timeZone: America/New_York
# no outbound GitHub release polling
releaseCheck:
  url: ""

replicaCount: 2
pdb:
  enabled: true
  minAvailable: 1

persistence:
  enabled: false

# 2026-10-23: media (image attachments) in Garage bucket netbox-media (key netbox-media-key, RW on
# that bucket only). Endpoint = the PUBLIC s3.el-jefe.me so the pre-signed links NetBox puts in pages
# open in a browser (signature is bound to the host); that node's region is `garage`, path-style.
# This dict lands in a ConfigMap -> NO credentials here: boto3 reads AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY from the env (secret netbox-secrets), set on web AND worker below.
storages:
  default:
    BACKEND: storages.backends.s3.S3Storage
    OPTIONS:
      bucket_name: netbox-media
      endpoint_url: https://s3.el-jefe.me
      region_name: garage
      addressing_style: path
      signature_version: s3v4
      querystring_auth: true
      querystring_expire: 3600
      file_overwrite: false

# The image starts GRANIAN_WORKERS (default 4) full Django processes per pod; 4 OOMed a 1Gi limit
# on first start. 2 per pod x 2 pods is plenty for a single-user inventory.
extraEnvs:
  - name: GRANIAN_WORKERS
    value: "2"
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef: {name: netbox-secrets, key: s3_access_key_id}
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef: {name: netbox-secrets, key: s3_secret_access_key}
  # Garage rejects the newer default CRC checksum headers
  - name: AWS_REQUEST_CHECKSUM_CALCULATION
    value: when_required
  - name: AWS_RESPONSE_CHECKSUM_VALIDATION
    value: when_required
resourcesPreset: "none"
# 2026-11-16: memory request 768Mi -> 896Mi (7-day working set 815-828Mi, flat;
# the pod ran above its request permanently). Limit unchanged.
resources:
  requests:
    cpu: 100m
    memory: 896Mi
  limits:
    memory: 1536Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["elitedesk", "m720q", "m920s"]
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: netbox

extraVolumes:
  - name: pg-ha-ca
    secret:
      secretName: pg-ha-ca
      items:
        - key: ca.crt
          path: ca.crt
          mode: 0444
extraVolumeMounts:
  - name: pg-ha-ca
    mountPath: /etc/pg-ha
    readOnly: true

postgresql:
  enabled: false
externalDatabase:
  host: 192.168.50.60
  port: 5000
  database: netbox
  username: netbox
  existingSecretName: netbox-secrets
  existingSecretKey: db_password
  options:
    sslmode: verify-full
    sslrootcert: /etc/pg-ha/ca.crt
    target_session_attrs: "read-write"

valkey:
  enabled: false
tasksDatabase:
  host: redis.default.svc.cluster.local
  port: 6379
  database: 2
  existingSecretName: netbox-secrets
  existingSecretKey: redis_password
cachingDatabase:
  host: redis.default.svc.cluster.local
  port: 6379
  database: 3
  existingSecretName: netbox-secrets
  existingSecretKey: redis_password

worker:
  enabled: true
  replicaCount: 1
  extraEnvs:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: {name: netbox-secrets, key: s3_access_key_id}
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: {name: netbox-secrets, key: s3_secret_access_key}
    # Garage rejects the newer default CRC checksum headers
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
  resourcesPreset: "none"
  # 2026-11-16: memory request 256Mi -> 320Mi (7-day working set 275-280Mi, flat).
  resources:
    requests:
      cpu: 50m
      memory: 320Mi
    limits:
      memory: 768Mi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["elitedesk", "m720q", "m920s"]
  extraVolumes:
    - name: pg-ha-ca
      secret:
        secretName: pg-ha-ca
        items:
          - key: ca.crt
            path: ca.crt
            mode: 0444
  extraVolumeMounts:
    - name: pg-ha-ca
      mountPath: /etc/pg-ha
      readOnly: true

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd
  hosts:
    - host: netbox.el-jefe.me
      paths:
        - /
  tls:
    - secretName: netbox-tls
      hosts:
        - netbox.el-jefe.me

extraDeploy:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: netbox-secrets
      namespace: netbox
    spec:
      refreshInterval: 24h
      secretStoreRef:
        name: doppler-secret-store
        kind: ClusterSecretStore
      target:
        name: netbox-secrets
        creationPolicy: Owner
        template:
          data:
            secret_key: '{{ "{{ .secret_key }}" }}'
            # API_TOKEN_PEPPERS {id: pepper}; add a higher id to rotate, never remove one
            api_token_peppers: '{"1": "{{ "{{ .pepper }}" }}"}'
            db_password: '{{ "{{ .db_password }}" }}'
            redis_password: '{{ "{{ .redis_password }}" }}'
            s3_access_key_id: '{{ "{{ .s3_access_key_id }}" }}'
            s3_secret_access_key: '{{ "{{ .s3_secret_access_key }}" }}'
            # no SMTP; the chart projects this key unconditionally
            email_password: ""
      data:
        - secretKey: secret_key
          remoteRef: {key: NETBOX_SECRET_KEY}
        - secretKey: pepper
          remoteRef: {key: NETBOX_API_TOKEN_PEPPER}
        - secretKey: db_password
          remoteRef: {key: NETBOX_DB_PASSWORD}
        - secretKey: redis_password
          remoteRef: {key: REDIS_PASSWORD}
        - secretKey: s3_access_key_id
          remoteRef: {key: NETBOX_S3_ACCESS_KEY_ID}
        - secretKey: s3_secret_access_key
          remoteRef: {key: NETBOX_S3_SECRET_ACCESS_KEY}
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: netbox-superuser
      namespace: netbox
    spec:
      refreshInterval: 24h
      secretStoreRef:
        name: doppler-secret-store
        kind: ClusterSecretStore
      target:
        name: netbox-superuser
        creationPolicy: Owner
        template:
          data:
            username: admin
            email: maxjeffwell@gmail.com
            password: '{{ "{{ .password }}" }}'
            # empty: the image only creates a token when api_key is also set (chart doesn't wire it)
            api_token: ""
      data:
        - secretKey: password
          remoteRef: {key: NETBOX_ADMIN_PASSWORD}
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: pg-ha-ca
      namespace: netbox
    spec:
      refreshInterval: 24h
      secretStoreRef:
        name: doppler-secret-store
        kind: ClusterSecretStore
      target:
        name: pg-ha-ca
        creationPolicy: Owner
      data:
        - secretKey: ca.crt
          remoteRef: {key: PG_HA_TLS_CA_CRT}
  # Default-deny for every pod in the namespace (web, worker, any future job). Added 2026-11-21:
  # NetBox now holds the full fleet inventory. A NEW dependency (webhook target, SMTP, LDAP, a
  # plugin calling out, an in-cluster API client) needs a rule here. `kubectl port-forward`
  # still works: it enters the pod's own network namespace.
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: netbox
      namespace: netbox
    spec:
      podSelector: {}
      policyTypes:
        - Ingress
        - Egress
      ingress:
        # Traefik (ingress) -> web :8080
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
          ports:
            - port: 8080
              protocol: TCP
      egress:
        # DNS
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
          ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP
        # Postgres -> Patroni HA VIP (HAProxy primary port)
        - to:
            - ipBlock:
                cidr: 192.168.50.60/32
          ports:
            - port: 5000
              protocol: TCP
        # Redis HA (tasks DB 2, cache DB 3); the matching ingress rule is in
        # k8s/network-policies/redis-ha.yaml
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: default
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: redis-ha
          ports:
            - port: 6379
              protocol: TCP
        # Media storage: Garage through the public endpoint https://s3.el-jefe.me. That name is
        # the Traefik LoadBalancer IP, which kube-proxy rewrites in-cluster to the Traefik pods
        # on :8443 BEFORE the policy is evaluated, so the rule must name the pods, not the IP
        # (an ipBlock for the edge IP never matches; tested 2026-11-21). This also lets NetBox
        # reach the other sites Traefik serves, all of which are public anyway. No internet
        # egress: release checks are off and nothing else calls out.
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
          ports:
            - port: 8443
              protocol: TCP
