# Second descheduler release (ArgoCD app descheduler-gpu-nodes, chart 0.37.0).
#
# Why (2026-10-07): the m920s drain spilled argocd-application-controller-0,
# crowdsec-lapi and the neon-cluster broker/compute onto debian-marmoset.
# gpu-priority=true is only PreferNoSchedule on dm/neon, so the scheduler uses
# them when the servers are full, and nothing ever moves those pods back.
#
# What: RemovePodsViolatingNodeTaints for the soft taints gpu-priority=true
# (dm/neon) and role=edge (VPS vmi3610371). Pods that tolerate the taint (GPU
# workloads; static frontends via tolerations*Client) are never evicted.
# Edge pods that only use nodeSelector role=edge (traefik, blackbox-exporter)
# are safe too: nodeFit finds no other node for them, so they are not evicted.
# role=edge added 2026-10-08: the 10/7 m920s drain left 13 home workloads
# (backends, redis, argocd, cert-manager webhook, velero, mayastor-nats...) on
# the VPS for a day; edge = file servers only (every home call pays ~55 ms).
# NOT covered: system-critical pods (coredns) -- DefaultEvictor skips them.
# No policy nodeSelector on purpose: nodeFit has to see the
# servers to decide whether the pod fits elsewhere, otherwise it would evict
# into a full cluster and the pod would bounce straight back.
fullnameOverride: descheduler-gpu-nodes
kind: Deployment
deschedulingInterval: 10m
replicas: 1
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
deschedulerPolicyAPIVersion: "descheduler/v1alpha2"
deschedulerPolicy:
  maxNoOfPodsToEvictPerNode: 2
  maxNoOfPodsToEvictPerNamespace: 1
  profiles:
    - name: off-gpu-nodes
      pluginConfig:
        - name: DefaultEvictor
          args:
            # Same protections as the server profile: PVC pods (Mayastor detach
            # cost, local PVs) are moved by hand.
            podProtections:
              defaultDisabled:
                - "PodsWithLocalStorage"
              extraEnabled:
                - "PodsWithPVC"
            nodeFit: true
        - name: RemovePodsViolatingNodeTaints
          args:
            includePreferNoSchedule: true
            includedTaints:
              - gpu-priority=true
              - role=edge
      plugins:
        deschedule:
          enabled:
            - RemovePodsViolatingNodeTaints
