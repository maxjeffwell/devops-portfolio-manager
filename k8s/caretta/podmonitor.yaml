# Scrape the Caretta eBPF agents (DaemonSet, :7117/metrics) with the cluster
# Prometheus (kube-prometheus-stack picks up any PodMonitor:
# podMonitorSelectorNilUsesHelmValues=false). Replaces Caretta's bundled
# VictoriaMetrics, which existed only for K8Studio (removed 2026-10-06).
#
# caretta_links_observed is one series per client->server->port link. 15s is
# plenty for the dashboard's rate()/increase() panels (chart default was 5s).
# link_id/client_id/server_id are internal hashes the dashboard does not use;
# dropping them keeps cardinality to the human-readable labels.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: caretta
  namespace: caretta
  labels:
    app.kubernetes.io/name: caretta
spec:
  selector:
    matchLabels:
      app: caretta
  podMetricsEndpoints:
    - port: prometheus
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
      metricRelabelings:
        - action: labeldrop
          regex: (link_id|client_id|server_id)
