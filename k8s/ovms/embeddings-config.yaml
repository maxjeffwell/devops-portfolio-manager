apiVersion: v1
kind: ConfigMap
metadata:
  name: ovms-embeddings-config
  namespace: ovms
  labels:
    app: ovms-embeddings
    portfolio: "true"
data:
  # OVMS config: registers the e5-large embeddings MediaPipe graph AND the
  # interval_ai TensorFlow SavedModel (KServe v2 /v2/models/interval_ai, served
  # here instead of Triton since 2026-09-30; on the i915 via the OpenVINO GPU plugin).
  # e5-large: MediaPipe
  # graph. graph_path points at /config/graph.pbtxt (this ConfigMap mount). NOT base_path:
  # /config: OVMS then re-reads this config.json as e5-large's subconfig and logs
  # "Duplicated model names: interval_ai" + "Loading Mediapipe e5-large ... failed".
  # The model files stay on the read-only PVC, referenced by absolute
  # models_path in the graph.
  config.json: |
    {
      "mediapipe_config_list": [
        { "name": "e5-large", "graph_path": "/config/graph.pbtxt" },
        { "name": "qwen3-embedding-0.6b", "graph_path": "/config/qwen3-embedding-graph.pbtxt" }
      ],
      "model_config_list": [
        {
          "config": {
            "name": "interval_ai",
            "base_path": "/models/interval_ai",
            "target_device": "GPU",
            "plugin_config": { "INFERENCE_PRECISION_HINT": "f32" }
          }
        }
      ]
    }
  # OpenAI-compatible embeddings graph (OVMS 2025.4 EmbeddingsCalculatorOV).
  # e5 requires MEAN pooling; embeddings are L2-normalized server-side.
  graph.pbtxt: |
    input_stream: "REQUEST_PAYLOAD:input"
    output_stream: "RESPONSE_PAYLOAD:output"
    node {
      name: "EmbeddingsExecutor"
      input_side_packet: "EMBEDDINGS_NODE_RESOURCES:embeddings_servable"
      calculator: "EmbeddingsCalculatorOV"
      input_stream: "REQUEST_PAYLOAD:input"
      output_stream: "RESPONSE_PAYLOAD:output"
      node_options: {
        [type.googleapis.com / mediapipe.EmbeddingsCalculatorOVOptions]: {
          models_path: "/models/e5-large/1",
          plugin_config: '{"NUM_STREAMS": "1"}',
          normalize_embeddings: true,
          pooling: CLS,
          target_device: "GPU"   # explicit: bookmarked + intervalai embeddings run on the i915, not the CPU
        }
      }
    }
  # 2026-10-02: the qwen2.5-1.5b-instruct LLM moved to its own pod (llm.yaml, ovms-llm).
  # 2026-10-01: Qwen3-Embedding-0.6B (OpenVINO int8, Apache-2.0, 1024 d, LAST pooling).
  # Eval on bookmarked's 62 bookmarks / 20 labelled queries: hit@1 18/20, MRR 0.935,
  # relevance margin 0.277 vs e5-large CLS (no prefixes) 11/20, 0.636, 0.039.
  # Queries need the instruction prefix
  #   "Instruct: Given a web search query, retrieve relevant bookmarks that match the query\nQuery: "
  # documents get none. e5-large stays for firebook / intervalai / code-search until migrated.
  qwen3-embedding-graph.pbtxt: |
    input_stream: "REQUEST_PAYLOAD:input"
    output_stream: "RESPONSE_PAYLOAD:output"
    node {
      name: "EmbeddingsExecutor"
      input_side_packet: "EMBEDDINGS_NODE_RESOURCES:embeddings_servable"
      calculator: "EmbeddingsCalculatorOV"
      input_stream: "REQUEST_PAYLOAD:input"
      output_stream: "RESPONSE_PAYLOAD:output"
      node_options: {
        [type.googleapis.com / mediapipe.EmbeddingsCalculatorOVOptions]: {
          models_path: "/models/qwen3-embedding-0.6b",
          plugin_config: '{"NUM_STREAMS": "1"}',
          normalize_embeddings: true,
          pooling: LAST,
          truncate: true,
          target_device: "GPU"
        }
      }
    }
