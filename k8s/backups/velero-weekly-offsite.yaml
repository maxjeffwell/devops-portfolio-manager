# Velero weekly off-site backup → Backblaze B2 (direct).
#
# Reconciled from live drift (2026-05-30): this Schedule existed only in the
# cluster, not in git. Unlike the other three schedules (in the monitoring Helm
# chart), weekly-offsite ships kopia FSB data and CSI snapshots straight to B2 —
# the rclone garage-offsite-sync job deliberately skips kopia/restic for that
# reason. Until 2026-11-26 it used an includedNamespaces allowlist; it now takes
# every namespace except velero (see the note at includedNamespaces).
# Managed here by the `backups` ArgoCD app (adopts the existing resource via
# server-side apply; not added to the Helm chart, which would choke on a
# pre-existing resource it didn't create).
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly-offsite
  namespace: velero
spec:
  schedule: "0 4 * * 0"
  skipImmediately: false
  useOwnerReferencesInBackup: false
  template:
    storageLocation: backblaze
    defaultVolumesToFsBackup: true
    # Move CSI snapshots to the BSL via the node-agent data mover (2026-09-06).
    # PSMDB pods carry backup.velero.io/backup-volumes-excludes=mongod-data, so
    # fs-backup skips them and Velero falls back to a CSI snapshot. Without the
    # data mover that snapshot is a thin LV on the SAME node as the database
    # (35 of them were sitting on debian-marmoset), i.e. not off-site at all.
    # With it, the snapshot is uploaded to B2 and the local copy deleted.
    snapshotMoveData: true
    ttl: 720h
    # Skip raw NFS mounts (and the TSDB/Mimir volumes). Without this, opt-out fs-backup walks
    # any large NAS media share mounted into a pod (hundreds of GB on ASUSTOR .149),
    # which cannot finish in the 4h window and orphan InProgress PVBs that hold
    # node-agent data-path slots forever (2026-08-16; 3rd recurrence of the
    # zombie-PVB concurrency deadlock).
    resourcePolicy:
      kind: configmap
      name: nas-local-volume-policy
    # 2026-11-26: every namespace except velero's own, like the daily and weekly
    # schedules. This used to be an allowlist, which silently left out every
    # namespace created after it was written (immich, tdarr, netbox, openebs had
    # home backups but no off-site copy). What keeps the upload small is the
    # volume policy above (NFS media, Prometheus, Mimir, PVCs labelled
    # velero-volume-policy=skip), not the namespace list. Volumes that fs-backup
    # skips by pod annotation are still snapshot-uploaded (snapshotMoveData), so a
    # new large re-creatable volume needs that label, not just the annotation.
    includedNamespaces:
      - "*"
    excludedNamespaces:
      - velero
    # 2026-11-27 (owner): no Secrets off-site. Velero stores Kubernetes objects as
    # plain JSON (only volume data is encrypted), so every Secret would sit in the
    # Backblaze bucket readable by anyone holding its key. After an off-site-only
    # restore, External Secrets re-creates the Doppler-backed ones once the
    # doppler-token-auth bootstrap Secret is put back by hand; operator-generated,
    # cert-manager and Helm-record Secrets regenerate. The home schedules (daily,
    # weekly, weekly-local, daily-nas-local) still include Secrets.
    excludedResources:
      - secrets
