# Values for the `velero` Helm release in namespace `velero`.
#
# The release is deployed with the REAL helm CLI from the upstream chart — it is
# NOT ArgoCD-managed (the `backups` Argo app owns k8s/backups, not this release),
# so committing here does not apply anything. Apply with:
#
#   helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
#   helm upgrade velero vmware-tanzu/velero --version 12.0.0 -n velero \
#     -f helm-charts/velero/values.yaml
#
# ⚠️ Upgrading restarts the velero server, which FAILS any backup that is
# InProgress at that moment — never upgrade while a backup is running.
#
# History: before 2026-08-25 these values lived only in the cluster (helm release
# revision 15, 2026-06-04) plus unrecorded kubectl drift on top. This file is the
# union of both, verified byte-identical to the live deployment via helm template.

configMaps:
  node-agent-config:
    data:
      # loadConcurrency = concurrent data-path (kopia upload) slots per node.
      # debian-marmoset hosts ~19 of ~26 PVBs per weekly-local run; at the global
      # 3 slots the queue tail could not get a slot within --resource-timeout=45m
      # and failed with the misleading "exposed PVB is not ready: error to wait
      # for rediness of pod" (2026-08-24 diagnosis). 8 slots clears the queue.
      # The node-agent reads this ONLY at startup — restart the DaemonSet pod
      # after changing it.
      #
      # loadAffinity = where data-mover (DataUpload/DataDownload) expose pods may
      # run, per source StorageClass. They mount a clone of the snapshot, so they
      # MUST land on a node that runs that volume's CSI node plugin; otherwise the
      # upload fails with "timeout on preparing data upload" (weekly-offsite
      # PartiallyFailed 9/13 and 9/20). First fixed 9/15 from a side file on dm
      # that never reached this file, so a later upgrade dropped it — keep it HERE.
      # Label-based where possible so node changes don't break it:
      #  - democratic-csi node plugin: debian-marmoset + m720q only (hostnames)
      #  - Mayastor: nodes labelled openebs.io/csi-node=mayastor (same label the
      #    Mayastor PVs require)
      #  - everything else: worker-role nodes (excludes edge VPS + GPU marmoset)
      #
      # backupPVC = StorageClass for the temporary clone the data mover mounts.
      # Mayastor only clones snapshots into THIN classes (ClonedSnapshotVolumeThin)
      # and all live Mayastor classes are thick, so map each to its thin twin
      # (k8s/storage/mayastor/thin-backup-clone-storageclasses.yaml).
      node-agent-config.json: |
        {
          "loadConcurrency": {"globalConfig": 3, "perNodeConfig": [{"nodeSelector": {"matchLabels": {"kubernetes.io/hostname": "debian-marmoset"}}, "number": 8}]},
          "loadAffinity": [
            {"storageClass": "democratic-synology-iscsi-mp", "nodeSelector": {"matchExpressions": [{"key": "kubernetes.io/hostname", "operator": "In", "values": ["debian-marmoset", "m720q"]}]}},
            {"storageClass": "mayastor-1", "nodeSelector": {"matchLabels": {"openebs.io/csi-node": "mayastor"}}},
            {"storageClass": "mayastor-2", "nodeSelector": {"matchLabels": {"openebs.io/csi-node": "mayastor"}}},
            {"storageClass": "mayastor-sata", "nodeSelector": {"matchLabels": {"openebs.io/csi-node": "mayastor"}}},
            {"storageClass": "mayastor-single-replica", "nodeSelector": {"matchLabels": {"openebs.io/csi-node": "mayastor"}}},
            {"nodeSelector": {"matchExpressions": [{"key": "node-role.kubernetes.io/worker", "operator": "Exists"}]}}
          ],
          "backupPVC": {
            "mayastor-1": {"storageClass": "mayastor-1-thin"},
            "mayastor-2": {"storageClass": "mayastor-2-thin"},
            "mayastor-sata": {"storageClass": "mayastor-sata-thin"},
            "mayastor-single-replica": {"storageClass": "mayastor-single-replica-thin"}
          }
        }

configuration:
  backupStorageLocation:
    - bucket: velero
      config:
        region: garage
        s3ForcePathStyle: true
        s3Url: http://garage.monitoring.svc.cluster.local:3900
      credential:
        key: cloud
        name: velero-garage-credentials
      name: default
      provider: aws
  clientBurst: 200
  clientQPS: 100
  # 20 keeps each secrets/etc. List response small enough that the kube-apiserver
  # does not kill the HTTP/2 stream mid-list (the recurring 2-error
  # "stream error ... INTERNAL_ERROR" PartiallyFailed mode, fixed 2026-08-23).
  clientPageSize: 20
  defaultRepoMaintainFrequency: 24h
  defaultVolumesToFsBackup: true
  features: EnableCSI
  itemBlockWorkerCount: 8
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 1
  volumeSnapshotLocation:
    - config:
        region: garage
      name: default
      provider: aws
  extraArgs:
    # No dedicated chart key for this one. 45m bounds how long a PVB may wait
    # for a data-path slot before failing (see loadConcurrency above).
    - --resource-timeout=45m

credentials:
  existingSecret: cloud-credentials

deployNodeAgent: true

initContainers:
  - image: velero/velero-plugin-for-aws:v1.8.0
    name: velero-plugin-for-aws
    volumeMounts:
      - mountPath: /target
        name: plugins

metrics:
  enabled: true
  nodeAgentPodMonitor:
    additionalLabels:
      release: prometheus
    enabled: true
  serviceMonitor:
    additionalLabels:
      release: prometheus
    enabled: true

nodeAgent:
  extraArgs:
    - --node-agent-configmap=velero-node-agent-config
  podVolumePath: /var/lib/kubelet/pods
  # 2026-09-16: previously had no resources block, so it inherited the
  # namespace LimitRange default (10m/64Mi) -- 2.6x under its real peak.
  # Measured 14-day peaks WITH backups running (29 PVBs/day, 98 on 09-13):
  # memory 164Mi (elitedesk) / 144Mi (debian-marmoset) / 126Mi (m720q) /
  # 83Mi (vmi2951245); cpu 21.7m peak, mostly under 3m.
  # Limit is 3x peak so it only fires on genuinely anomalous behaviour. A
  # limit is acceptable here (unlike nodelocaldns, which has none on purpose)
  # because an OOMKilled PVB is recoverable via spec.cancel=true, whereas
  # losing node DNS is not.
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi

# Server pinned to elitedesk since 2026-08-18 (kubectl patch; ported to values
# 2026-09-01 — without this an upgrade would silently unpin it).
nodeSelector:
  kubernetes.io/hostname: elitedesk

# 2026-09-07 right-sizing, measured 2-day peaks: cpu 39m against a 200m request,
# memory 568Mi against a 512Mi request. Limit stays 1Gi (peak is ~55% of it).
resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 640Mi

snapshotsEnabled: true
upgradeCRDs: false

# 2026-09-22: Velero 1.18.3 (fixes orphan vsc-* 45-min readyToUse poll) on chart 12.0.0 (app 1.18.0).
image:
  tag: v1.18.3
