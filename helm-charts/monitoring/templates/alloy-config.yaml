{{- if .Values.alloy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: {{ .Release.Namespace }}
data:
  config.alloy: |
    // Discover pods on THIS node only. Alloy runs as a DaemonSet and tails
    // container log files from the host, so cluster-wide discovery would
    // only produce targets whose files don't exist here.
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + env("HOSTNAME")
      }
    }

    // Relabel to extract useful metadata
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      // Keep only running pods
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending|Succeeded|Failed|Unknown"
        action        = "drop"
      }

      // Set namespace label
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // Set pod label
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Set container label
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // Set app label from pod label app or app.kubernetes.io/name
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
        regex         = "(.+)"
      }

      // Set node label
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

      // Map each container to its kubelet log file on the host:
      //   /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
      rule {
        source_labels = [
          "__meta_kubernetes_namespace",
          "__meta_kubernetes_pod_name",
          "__meta_kubernetes_pod_uid",
          "__meta_kubernetes_pod_container_name",
        ]
        separator    = "/"
        regex        = "(.+)/(.+)/(.+)/(.+)"
        replacement  = "/var/log/pods/${1}_${2}_${3}/${4}/*.log"
        target_label = "__path__"
      }
    }

    // Collect container logs by tailing kubelet's files on the host.
    // This deliberately replaces loki.source.kubernetes, which streamed every
    // container's logs through the apiserver (pods/log proxy) and, without a
    // node filter, did so once per Alloy replica (5 replicas x 316 containers = 1560 streams
    // on the control plane).
    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
      // Parse the CRI log line format (timestamp stream flags content).
      stage.cri {}

      // Drop the per-file label: container restarts rotate 0.log -> 1.log and
      // would otherwise fork a new series each time.
      stage.label_drop {
        values = ["filename"]
      }

      // Percona's mongodb-healthcheck readiness probe (every 3s per mongod)
      // authenticates as clusterMonitor and mongod 7 logs id 5286202
      // "Different user name was supplied to saslSupportedMechs" at severity I
      // on every probe. ~12.7k lines/h across the 9 mongod pods, all tagged
      // detected_level=error by Loki because of the nested "error" key.
      // It is not suppressible from mongod (level-0 message), so drop it at
      // ingest. Scoped to the mongod container so nothing else is affected.
      stage.match {
        selector = "{namespace=\"percona-mongodb\", container=\"mongod\"}"
        stage.drop {
          expression          = "\"id\":5286202,"
          drop_counter_reason = "mongod_healthcheck_sasl_noise"
        }
      }

      forward_to = [loki.write.default.receiver]
    }

    // Push logs to Loki on ASUSTOR (centralized log aggregation over WireGuard)
    loki.write "default" {
      endpoint {
        url = "http://10.0.0.4:3100/loki/api/v1/push"
      }
    }

    // --- Mimir Remote Write (metrics sink for all scrapers) ---
    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir-monolithic.monitoring.svc.cluster.local:8080/api/v1/push"
        send_exemplars = true
      }
    }

    // --- kube-prometheus Remote Write (Beyla only) ---
    // Mimir holds ONLY what Alloy sends it -- no kube-state-metrics, and only a
    // thin slice of cAdvisor. Radar reads a single Prometheus for BOTH live
    // traffic and resource metrics, so repointing it at Mimir would light up
    // Traffic and blank out everything else. Instead the beyla scrape below
    // fans out to both sinks. Requires prometheusSpec.enableRemoteWriteReceiver.
    prometheus.remote_write "promstack" {
      endpoint {
        url = "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
      }
    }

    // --- Host Metrics (unix exporter) ---
    prometheus.exporter.unix "node" {
      set_collectors = ["cpu", "diskstats", "filesystem", "loadavg", "meminfo", "netdev", "uname"]
    }

    prometheus.scrape "node_metrics" {
      targets         = prometheus.exporter.unix.node.targets
      forward_to      = [prometheus.remote_write.mimir.receiver]
      scrape_interval = "30s"
    }

    // --- Systemd Journal Collection ---
    loki.source.journal "systemd" {
      forward_to = [loki.write.default.receiver]
      labels     = { job = "systemd-journal" }
    }

    // --- Blackbox Probes (VPS -> Home Network) ---
    prometheus.exporter.blackbox "home_network" {
      config = "{ modules: { icmp_probe: { prober: icmp, timeout: 5s }, http_2xx: { prober: http, timeout: 10s, http: { valid_http_versions: ['HTTP/1.1', 'HTTP/2.0'], valid_status_codes: [200, 301, 302] } }, tcp_connect: { prober: tcp, timeout: 5s } } }"

      target {
        name    = "home_icmp"
        address = "maxjeffwell@ddns.net"
        module  = "icmp_probe"
      }
      target {
        name    = "embeddings_http"
        address = "https://embeddings.el-jefe.me"
        module  = "http_2xx"
      }
      target {
        name    = "eljefe_http"
        address = "https://el-jefe.me"
        module  = "http_2xx"
      }
    }

    prometheus.scrape "blackbox" {
      targets         = prometheus.exporter.blackbox.home_network.targets
      forward_to      = [prometheus.remote_write.mimir.receiver]
      scrape_interval = "60s"
      clustering {
        enabled = true
      }
    }

    // --- Garage Metrics (S3-compatible object storage) ---
    prometheus.scrape "garage" {
      targets         = [{ "__address__" = "garage.monitoring.svc.cluster.local:3903" }]
      forward_to      = [prometheus.remote_write.mimir.receiver]
      scrape_interval = "30s"
      job_name        = "garage"
      metrics_path    = "/metrics"
    }

    // --- WireGuard Metrics (scraped from node's prometheus_wireguard_exporter) ---
    prometheus.scrape "wireguard" {
      targets         = [{ "__address__" = env("HOST_IP") + ":9586" }]
      forward_to      = [prometheus.remote_write.mimir.receiver]
      scrape_interval = "30s"
      job_name        = "wireguard"
    }

    // --- Traefik Access Log Collection ---
    local.file_match "traefik_access_log" {
      path_targets = [{ "__path__" = "/var/log/traefik/access.log" }]
      sync_period  = "5s"
    }

    loki.source.file "traefik_access_log" {
      targets    = local.file_match.traefik_access_log.targets
      forward_to = [loki.process.traefik.receiver]
    }

    loki.process "traefik" {
      // Parse Traefik common log format:
      // <ip> - - [<ts>] "<method> <path> <proto>" <status> <size> "<referer>" "<ua>" <count> "<router>" "<backend>" <duration>
      stage.regex {
        expression = "^(?P<client_ip>[\\d.]+) - - \\[(?P<timestamp>[^\\]]+)\\] \"(?P<method>\\S+) (?P<path>\\S+) [^\"]+\" (?P<status>\\d+) \\d+ \"(?P<referer>[^\"]*)\" \"(?P<user_agent>[^\"]*)\" \\d+ \"(?P<router>[^\"]*)\" \"[^\"]*\" (?P<duration>\\S+)"
      }

      // Promote only BOUNDED fields to stream labels. path/referer/user_agent
      // are unbounded and previously exhausted Loki's 10k global stream cap
      // (blocking stream creation for every other pipeline); they go to
      // structured metadata instead and stay queryable as `| path="..."`.
      stage.labels {
        values = {
          status = "",
          method = "",
          router = "",
        }
      }

      stage.structured_metadata {
        values = {
          path       = "",
          referer    = "",
          user_agent = "",
        }
      }

      // Static label to identify these as traefik access logs
      stage.static_labels {
        values = { job = "traefik-access-log", source = "traefik" }
      }

      forward_to = [loki.write.default.receiver]
    }

    // --- eBPF CPU Profiler (Pyroscope) ---
    discovery.kubernetes "local_pods" {
      selectors {
        field = "spec.nodeName=" + env("HOSTNAME")
        role  = "pod"
      }
      role = "pod"
    }

    pyroscope.ebpf "instance" {
      forward_to = [pyroscope.write.endpoint.receiver]
      targets    = discovery.kubernetes.local_pods.targets
    }

    pyroscope.write "endpoint" {
      endpoint {
        url = "http://pyroscope.monitoring.svc.cluster.local:4040"
      }
    }

    // --- Pyroscope SDK Receiver (for app-instrumented profiles) ---
    pyroscope.receive_http "default" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = 9999
      }
      forward_to = [pyroscope.write.endpoint.receiver]
    }

    // --- Pyroscope Self-Profiling (pprof scrape) ---
    pyroscope.scrape "pyroscope_self" {
      targets = [
        { "__address__" = "pyroscope.monitoring.svc.cluster.local:4040", "service_name" = "pyroscope" },
      ]
      forward_to = [pyroscope.write.endpoint.receiver]
      clustering {
        enabled = true
      }
      profiling_config {
        profile.process_cpu { enabled = false }
      }
    }

    // --- Faro Frontend Observability Receiver ---
    faro.receiver "default" {
      server {
        listen_address = "0.0.0.0"
        listen_port    = 12347
        cors_allowed_origins = [
          "https://bookmarked-k8s.el-jefe.me",
          "https://el-jefe.me",
          "https://www.el-jefe.me",
          "https://educationelly-k8s.el-jefe.me",
          "https://educationelly-graphql-k8s.el-jefe.me",
          "https://intervalai-k8s.el-jefe.me",
          "https://code-talk-k8s.el-jefe.me",
          "https://firebook-k8s.el-jefe.me",
          "https://showcase.el-jefe.me",
          "http://localhost:3000",
        ]
        max_allowed_payload_size = "5MiB"
      }
      output {
        logs   = [loki.write.default.receiver]
        traces = [otelcol.processor.batch.tempo.input]
      }
    }

    // --- Beyla eBPF Auto-Instrumentation ---
    beyla.ebpf "auto" {
      discovery {
        instrument {
          kubernetes {
            namespace = "default"
          }
        }
      }
      metrics {
        // "network" adds beyla_network_flow_bytes (L4 flows), which is what
        // Radar's Traffic view needs to draw per-port edges; "application"
        // alone only yields HTTP RED metrics.
        features = ["application", "network"]
      }
      // Hidden attributes on beyla_network_flow_bytes that must be opted into.
      // The list is dictated by Radar's L4 query (internal/traffic/beyla.go):
      //   sum by (k8s_src_owner_name, k8s_src_namespace, k8s_src_owner_type,
      //           k8s_dst_owner_name, k8s_dst_namespace, k8s_dst_owner_type,
      //           dst_port, transport)
      //     (rate(beyla_network_flow_bytes_total{job=~".*beyla.*|.*alloy.*",
      //           direction="request"}[5m]))
      // `direction` is REQUIRED: Radar filters direction="request" to drop the
      // response half of every conversation. Without the attribute that selector
      // matches nothing and the traffic graph is silently empty.
      //
      // dst.port is deliberately NOT selected. With it, Beyla labels each reply
      // series with the CLIENT's ephemeral port, so a new counter appears per
      // connection and is usually gone before a second scrape can observe it.
      // rate() then yields nothing and received-byte figures collapse: Radar
      // measured 74.7% of reply counters unrateable on this cluster. The cost of
      // omitting it is that L4 edges carry port 0 and Radar aggregates HTTP
      // latency/errors per destination instead of per port -- acceptable here
      // since these services each serve HTTP on one port.
      // Never include = ["*"]: that adds src.port, which is unbounded.
      attributes {
        // Required sub-block: without it Alloy rejects the attributes block
        // outright ("missing required block \"kubernetes\""). "true" (not
        // "autodetect") because the k8s.*.owner.name decorations below only
        // exist when kube metadata decoration is on.
        kubernetes {
          enable = "true"
        }
        select {
          attr    = "beyla_network_flow_bytes"
          include = [
            "k8s.src.owner.name",
            "k8s.src.owner.type",
            "k8s.src.namespace",
            "k8s.dst.owner.name",
            "k8s.dst.owner.type",
            "k8s.dst.namespace",
            "transport",
            "direction",
          ]
        }
      }
      output {
        traces = [otelcol.processor.batch.tempo.input]
      }
    }

    // --- Scrape Beyla RED + network metrics into Mimir AND Prometheus ---
    prometheus.scrape "beyla" {
      targets         = beyla.ebpf.auto.targets
      honor_labels    = true
      scrape_interval = "30s"
      forward_to      = [
        prometheus.remote_write.mimir.receiver,
        prometheus.remote_write.promstack.receiver,
      ]
    }

    // --- OTLP Receiver (for future SDK-instrumented apps) ---
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        traces = [otelcol.processor.batch.tempo.input]
      }
    }

    // --- Batch spans before export ---
    otelcol.processor.batch "tempo" {
      timeout             = "5s"
      send_batch_size     = 1024
      send_batch_max_size = 0
      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    // --- Export to Tempo ---
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo-monolithic.monitoring.svc.cluster.local:4317"
        tls {
          insecure = true
        }
        compression = "snappy"
      }
    }
{{- end }}
