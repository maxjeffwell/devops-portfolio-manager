# Radar OSS — in-cluster Kubernetes UI (https://radarhq.io)
# RBAC stays at chart defaults: cluster-wide READ-ONLY.
# secrets/podExec/portForward/helm-write all remain disabled until
# authentication is configured in front of the UI.

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Exposed on the tailnet at https://radar.tailnet.el-jefe.me via the
# radar-tailnet proxy Deployment (k8s/radar-tailnet/): tailscale userspace
# sidecar -> nginx (TLS + basic auth) -> radar service. nginx authenticates
# and asserts X-Forwarded-User; a NetworkPolicy blocks all other ingress to
# the radar pod since proxy mode trusts that header.
auth:
  mode: proxy
  proxy:
    userHeader: X-Forwarded-User
    groupsHeader: X-Forwarded-Groups

ingress:
  enabled: false

# Timeline is in-memory (lost on pod restart). Enable persistence +
# sqlite retention later if multi-day audit history proves useful.
persistence:
  enabled: false
