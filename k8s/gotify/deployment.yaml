apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotify
  namespace: monitoring
  labels:
    app: gotify
spec:
  replicas: 1
  # RWO iSCSI volume: old pod must release it before the new one mounts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gotify
  template:
    metadata:
      labels:
        app: gotify
    spec:
      # democratic-csi-mp node plugin only runs on these nodes (its DaemonSet
      # is hostname-pinned); anywhere else the PVC fails MountDevice.
      # 2026-10-06: the three servers (debian-marmoset is a GPU node now).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["elitedesk", "m720q", "m920s"]
      containers:
        - name: gotify
          # pinned 2026-10-07 (was untagged = latest); = running digest 44fc5bbd
          image: gotify/server:3.1.1
          env:
            - name: TZ
              value: "UTC"
            - name: GOTIFY_DEFAULTUSER_PASS
              value: "admin"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: gotify-data
              mountPath: "/app/data"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: gotify-data
          persistentVolumeClaim:
            claimName: gotify-democratic-mp
