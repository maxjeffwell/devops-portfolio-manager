# Overrides for the upstream kubescape-operator chart (1.42.0).
#
# Why (2026-11-20, user decisions): continuous image-vulnerability and
# configuration scanning, stored results for the `kubescape` MCP server, and
# (second decision, same day) the runtime NODE AGENT ON THE THREE SERVERS ONLY.
#
# Node agent = an eBPF DaemonSet (hostPID, SYS_ADMIN and friends, host / mounted
# read-only). It gives relevancy (which CVEs sit in code that is actually
# loaded), per-workload behaviour profiles, generated NetworkPolicies and
# seccomp profiles, and host-level node scans. It is pinned to m720q and m920s
# (elitedesk removed 2026-11-20, see nodeAgent below) via nodeAgent.affinity: NOT on dm/neon (GPU laptops whose idle
# heat is tuned), NOT on marmoset (daily driver), NOT on the VPS edge.
# NOTE: customScheduling does not apply to the DaemonSet; without
# nodeAgent.affinity it would land on every untainted Linux node.
#
# Still deliberately off:
#   - nodeSbomGeneration: the central scanner (kubevuln) keeps pulling and
#     scanning images itself, so pods on the nodes WITHOUT an agent are covered.
#   - runtimeDetection / malwareDetection / httpDetection / networkEventsStreaming:
#     no alerting pipeline or cloud backend is configured for them.
#   - the admission controller (a webhook in the API write path).
#   - any Kubescape cloud account: no `account`/`server`; nothing leaves the
#     cluster except image pulls and the vulnerability-DB download.
clusterName: homelab-k3s

capabilities:
  configurationScan: enable
  vulnerabilityScan: enable
  continuousScan: disable
  nodeScan: enable
  nodeSbomGeneration: disable
  relevancy: enable
  runtimeObservability: enable
  networkPolicyService: enable
  networkEventsStreaming: disable
  nodeProfileService: enable
  admissionController: disable
  httpDetection: disable
  seccompProfileService: enable
  runtimeDetection: disable
  malwareDetection: disable

# ArgoCD-safe certificates. The default ("template") generates a new random CA
# on every render, so ArgoCD saw the APIService caBundle as permanently
# OutOfSync and selfHeal could swap in a CA that no longer matches the storage
# pod's certificate. "initContainer" generates them at runtime instead.
certificates:
  strategy: initContainer

global:
  # Least privilege: with this false the chart grants no cluster-wide Secret
  # read (only a Role inside the kubescape namespace). Every image in the
  # cluster pulled anonymously in the 2026-11-19 CLI scan, so pull secrets are
  # not needed. Flip to true only if a private image must be scanned.
  enableClusterWideSecretAccess: false

persistence:
  # NVMe is scarce: scan results go on the SATA pools.
  storageClass: mayastor-sata-thin

# Servers only (dm/neon are GPU nodes, marmoset is the laptop, the VPS is the
# edge), preferring m920s for the bursty scanners (homelab/cpu-tier=high).
customScheduling:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [elitedesk, m720q, m920s]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
              - key: homelab/cpu-tier
                operator: In
                values: [high]

nodeAgent:
  # m720q + m920s only. See the header for why not the laptops/VPS.
  # elitedesk REMOVED 2026-11-20: measured over the agent's first hour it cost
  # +3.5-4 W (15 -> 19 W, ~25 %) and +3.5 C there, with the room cooling;
  # m920s took the same watts with no temperature rise, m720q +1.3 W.
  # elitedesk is the warmest server and its temperature tracks watts.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values: [linux]
              - key: kubernetes.io/hostname
                operator: In
                values: [m720q, m920s]
