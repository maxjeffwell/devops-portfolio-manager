# Caretta agents publish the service map on :7117; only Prometheus (monitoring
# namespace) may scrape it. 2026-10-06: the bundled caretta-vm (and the
# node-gateway allow-list K8Studio's port-forward needed) is gone; Prometheus
# scrapes the agents directly via k8s/caretta/podmonitor.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: caretta-agent-ingress
  namespace: caretta
spec:
  podSelector:
    matchLabels:
      app: caretta
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { port: 7117, protocol: TCP }
