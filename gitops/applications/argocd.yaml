# Argo CD managing its own install (k8s/argocd = vendored upstream + patches).
#
# No resources-finalizer on purpose: deleting THIS Application must never
# cascade-delete Argo CD itself. selfHeal is off (matches the parent policy) so
# an emergency `kubectl patch` on an Argo CD component stays in place and shows
# as OutOfSync instead of being reverted underneath you — but it is visible,
# not tribal, and a normal sync restores git. Server-side apply is required
# (CRDs > 256 KiB last-applied limit) and PruneLast keeps a bad render from
# pruning before the replacement objects exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    infrastructure: "true"
spec:
  project: default
  source:
    repoURL: https://github.com/maxjeffwell/devops-portfolio-manager.git
    targetRevision: main
    path: k8s/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - ServerSideDiff=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
