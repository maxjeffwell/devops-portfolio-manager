# NetworkPolicy lunary/allow-lunary-to-cnpg. Exported from the live cluster 2026-09-26 (it was
# hand-applied, tracked by nothing); verified with an empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lunary-to-cnpg
  namespace: lunary
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  # Patroni HA VIP (HAProxy primary port) — 2026-10-23. The rule for the old
  # cnpg-lunary cluster was removed 2026-11-21 when that cluster was retired; the
  # policy keeps its name so the object is not deleted and recreated.
  - ports:
    - port: 5000
      protocol: TCP
    to:
    - ipBlock:
        cidr: 192.168.50.60/32
  - ports:
    - port: 443
      protocol: TCP
  podSelector:
    matchLabels:
      app: lunary-backend
  policyTypes:
  - Egress
