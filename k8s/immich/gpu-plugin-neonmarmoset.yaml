# Fourth Intel GPU device plugin instance, for neonmarmoset's Iris Xe
# (Alder Lake-P, i7-1260P). Added 2026-09-30 with the Debian 13 rebuild so the
# node exposes gpu.intel.com/i915 like the other home nodes. Selects by
# hostname so it never overlaps the dm (gpu-node=true) instance. Whether
# jellyfin/ovms may schedule here is a separate decision (the gpu-node label).
# 4 shares of the one iGPU.
apiVersion: deviceplugin.intel.com/v1
kind: GpuDevicePlugin
metadata:
  name: gpudeviceplugin-neonmarmoset
spec:
  image: intel/intel-gpu-plugin:0.35.0
  sharedDevNum: 4
  nodeSelector:
    kubernetes.io/hostname: neonmarmoset
