# 2026-10-02: second, independent Jellyfin on debian-marmoset (user request),
# alongside the main one on neonmarmoset. HOSTNAME-PINNED to dm by user choice.
# Own /config (Mayastor clone of jellyfin-config-mayastor taken 10/2, so users,
# libraries and watch state start identical, then diverge), same read-only NFS
# media PVCs. Reached at https://jellyfin-k8s.el-jefe.me/dm (BaseUrl /dm). Label app=jellyfin-dm keeps it out of the main Service,
# ServiceMonitor and the gpu-failback CronJob (all select app=jellyfin).
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: jellyfin-config-2026-10-02
  namespace: jellyfin
spec:
  volumeSnapshotClassName: mayastor-snapclass
  source:
    persistentVolumeClaimName: jellyfin-config-mayastor
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-dm-config
  namespace: jellyfin
  labels:
    app: jellyfin-dm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: mayastor-2-thin
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: jellyfin-config-2026-10-02
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-dm
  namespace: jellyfin
  labels:
    app: jellyfin-dm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin-dm
  template:
    metadata:
      labels:
        app: jellyfin-dm
        portfolio: "true"
      annotations:
        backup.velero.io/backup-volumes-excludes: media-movies,media-tvshows,rec-channels,media-sabnzbd,cache,transcodes,tmp,run
    spec:
      priorityClassName: portfolio-critical
      nodeSelector:
        kubernetes.io/hostname: debian-marmoset
        intel-gpu-gen: xe
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [992]
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Cloned config carries the main server's ServerId (data/device.txt);
        # drop it once so this instance generates its own and clients don't
        # merge the two servers. Marker must NOT be named .jellyfin-* — Jellyfin's
        # startup sanity check treats those as its own path markers and aborts.
        - name: new-server-id
          image: busybox:1.36
          command: [sh, -c]
          args:
            - |
              [ -e /config/.jellyfin-dm ] && mv /config/.jellyfin-dm /config/.dm-serverid-reset
              if [ ! -e /config/.dm-serverid-reset ]; then
                rm -f /config/data/device.txt
                touch /config/.dm-serverid-reset
                echo "fresh ServerId"
              fi
              # Served at jellyfin-k8s.el-jefe.me/dm (no DNS record of its own).
              sed -i 's|<BaseUrl />|<BaseUrl>/dm</BaseUrl>|; s|<BaseUrl>[^<]*</BaseUrl>|<BaseUrl>/dm</BaseUrl>|' /config/config/network.xml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /config }
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.1.20260915-010956
          env:
            - { name: TZ, value: America/New_York }
            - { name: JELLYFIN_PublishedServerUrl, value: https://jellyfin-k8s.el-jefe.me/dm }
          ports:
            - { name: http, containerPort: 8096, protocol: TCP }
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
              gpu.intel.com/i915: "1"
            limits:
              cpu: "8"
              memory: 3Gi
              gpu.intel.com/i915: "1"
          startupProbe:
            httpGet: { path: /health, port: 8096 }
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health, port: 8096 }
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /health, port: 8096 }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: cache, mountPath: /cache }
            - { name: transcodes, mountPath: /transcodes }
            - { name: media-movies, mountPath: /sharefolder/Movies, readOnly: true }
            - { name: media-tvshows, mountPath: "/sharefolder/TV Shows", readOnly: true }
            - { name: rec-channels, mountPath: /media/dvr, readOnly: true }
            - { name: media-sabnzbd, mountPath: /sharefolder/Download/SABnzbd/complete, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: run, mountPath: /var/run }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: jellyfin-dm-config }
        - name: cache
          emptyDir: { sizeLimit: 10Gi }
        - name: transcodes
          emptyDir: { sizeLimit: 12Gi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: run
          emptyDir: { sizeLimit: 64Mi }
        - name: media-movies
          persistentVolumeClaim: { claimName: jellyfin-media-movies, readOnly: true }
        - name: media-tvshows
          persistentVolumeClaim: { claimName: jellyfin-media-tvshows, readOnly: true }
        - name: rec-channels
          persistentVolumeClaim: { claimName: jellyfin-rec-channels, readOnly: true }
        - name: media-sabnzbd
          persistentVolumeClaim: { claimName: jellyfin-media-sabnzbd, readOnly: true }
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-dm
  namespace: jellyfin
  labels:
    app: jellyfin-dm
spec:
  type: ClusterIP
  selector:
    app: jellyfin-dm
  ports:
    - { name: http, port: 8096, targetPort: 8096, protocol: TCP }
---
# /dm on the main hostname. No cert-manager annotation: reuses jellyfin-tls,
# which the main Ingress owns. Longer path beats the main catch-all /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-dm
  namespace: jellyfin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jellyfin-k8s.el-jefe.me]
      secretName: jellyfin-tls
  rules:
    - host: jellyfin-k8s.el-jefe.me
      http:
        paths:
          - path: /dm
            pathType: Prefix
            backend:
              service:
                name: jellyfin-dm
                port:
                  number: 8096
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-dm
  namespace: jellyfin
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`jellyfin-k8s.el-jefe.me`) && (PathPrefix(`/dm/Users/AuthenticateByName`) || PathPrefix(`/dm/Users/Public`))
      kind: Rule
      priority: 900
      middlewares:
        - name: jellyfin-ratelimit
      services:
        - { name: jellyfin-dm, port: 8096 }
    - match: Host(`jellyfin-k8s.el-jefe.me`) && PathPrefix(`/dm/metrics`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: jellyfin-metrics-deny
      services:
        - { name: jellyfin-dm, port: 8096 }
  tls:
    secretName: jellyfin-tls
