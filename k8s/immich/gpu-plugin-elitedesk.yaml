# Second Intel GPU device plugin instance, for elitedesk's UHD 630 (Coffee Lake).
# The debian-marmoset CR is gpu-plugin-debian-marmoset.yaml (in git since 2026-09-30)
# and selects dm by hostname. Node selectors must not overlap,
# so this one selects elitedesk by hostname. Cluster-scoped; lives here because
# Immich ML is its only consumer today. 4 shares of the one iGPU.
apiVersion: deviceplugin.intel.com/v1
kind: GpuDevicePlugin
metadata:
  name: gpudeviceplugin-elitedesk
spec:
  image: intel/intel-gpu-plugin:0.35.0
  sharedDevNum: 4
  nodeSelector:
    kubernetes.io/hostname: elitedesk
