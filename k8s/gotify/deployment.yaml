apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotify
  namespace: monitoring
  labels:
    app: gotify
spec:
  replicas: 1
  # RWO volume: old pod must release it before the new one mounts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gotify
  template:
    metadata:
      labels:
        app: gotify
    spec:
      # The data volume is replicated cluster storage (Mayastor) since 2026-11-26,
      # served from the three servers. Kept on those nodes.
      # 2026-10-06: the three servers (debian-marmoset is a GPU node now).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["elitedesk", "m720q", "m920s"]
      # Fail over quickly when its node dies (2026-11-26). The default is to wait
      # 300 s before evicting a pod from a not-ready/unreachable node; Gotify is
      # the main notification channel and cannot run as two copies (one SQLite
      # file, in-memory push connections), so a fast restart elsewhere is the
      # redundancy. The volume still has to detach from the dead node, which
      # Kubernetes forces after about 6 minutes if the node cannot confirm it.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: gotify
          # pinned 2026-10-07 (was untagged = latest); = running digest 44fc5bbd
          image: gotify/server:3.1.1
          env:
            - name: TZ
              value: "UTC"
            - name: GOTIFY_DEFAULTUSER_PASS
              value: "admin"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: gotify-data
              mountPath: "/app/data"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: gotify-data
          persistentVolumeClaim:
            claimName: gotify-data
