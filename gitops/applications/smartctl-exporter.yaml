---
# smartctl_exporter: per-disk SMART health for the storage nodes into the cluster
# Prometheus (ServiceMonitor) + PrometheusRules -> Alertmanager. Added 2026-10-07.
# Values (explicit per-node device lists, and why): helm-charts/smartctl-exporter.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartctl-exporter
  namespace: argocd
  labels:
    app: smartctl-exporter
    infrastructure: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-smartctl-exporter
      targetRevision: 0.17.1
      helm:
        valueFiles:
          - $values/helm-charts/smartctl-exporter/values-override.yaml
    - repoURL: https://github.com/maxjeffwell/devops-portfolio-manager.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
