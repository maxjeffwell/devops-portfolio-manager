# Radar OSS — in-cluster Kubernetes UI (https://radarhq.io)
# RBAC stays at chart defaults: cluster-wide READ-ONLY.
# secrets/podExec/portForward/helm-write all remain disabled until
# authentication is configured in front of the UI.

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Exposed at https://radar.el-jefe.me via the shared Traefik ingress
# (DNS A record -> 100.64.0.2, DNS-only, routable on the tailnet). Traefik
# middlewares (k8s/radar/middleware.yaml) strip client-supplied identity
# headers, enforce basic auth, and assert X-Forwarded-User; a NetworkPolicy
# blocks all other ingress to the radar pod since proxy mode trusts that
# header.
auth:
  mode: proxy
  proxy:
    userHeader: X-Forwarded-User
    groupsHeader: X-Forwarded-Groups

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: radar-strip-auth-headers@kubernetescrd,radar-basicauth@kubernetescrd
  hosts:
    - host: radar.el-jefe.me
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: radar-tls
      hosts:
        - radar.el-jefe.me

# Timeline is in-memory (lost on pod restart). Enable persistence +
# sqlite retention later if multi-day audit history proves useful.
persistence:
  enabled: false

# Keep off elitedesk: inbound cross-node pod traffic there does not match
# NetworkPolicy source selectors (multihoming SNAT suspected, found
# 2026-08-23), which breaks the traefik-only netpol with a 504.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - elitedesk
