# K8up daily backup of qdrant PVC data → Garage S3 bucket "k8up" (ASUSTOR).
# Second namespace in the velero→K8up rollout (pilot verified 2026-08-18:
# 200/200-file restore drill from snapshot 6bf4ccc2).
#
# Secrets k8up-repo-password + k8up-s3-credentials were copied into the qdrant
# namespace out-of-band (TODO: Doppler + ESO, shared with cluster-nfs).
#
# 01:30 = staggered after the cluster-nfs 01:15 run; check/prune staggered 15min
# after cluster-nfs's Sunday jobs — both namespaces share one restic repo, and
# concurrent prunes would contend on the repo lock.
# Owned by the `backups` ArgoCD app.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: k8up-qdrant
  namespace: qdrant
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo-password
      key: password
    s3:
      endpoint: http://100.64.0.12:3900
      bucket: k8up
      accessKeyIDSecretRef:
        name: k8up-s3-credentials
        key: username
      secretAccessKeySecretRef:
        name: k8up-s3-credentials
        key: password
  backup:
    schedule: '30 1 * * *'
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2
  check:
    schedule: '45 12 * * 0'
  prune:
    schedule: '45 13 * * 0'
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
