apiVersion: v1
kind: ConfigMap
metadata:
  name: ovms-embeddings-config
  namespace: ovms
  labels:
    app: ovms-embeddings
    portfolio: "true"
data:
  # OVMS config: registers the e5-large embeddings MediaPipe graph AND the
  # interval_ai TensorFlow SavedModel (KServe v2 /v2/models/interval_ai, served
  # here instead of Triton since 2026-09-30; on the i915 via the OpenVINO GPU plugin).
  # e5-large: MediaPipe
  # graph. graph_path points at /config/graph.pbtxt (this ConfigMap mount). NOT base_path:
  # /config: OVMS then re-reads this config.json as e5-large's subconfig and logs
  # "Duplicated model names: interval_ai" + "Loading Mediapipe e5-large ... failed".
  # KServe downloads each model from Garage into /mnt/models/<name> before the
  # server starts (storageUris in kserve-embeddings.yaml); the graphs reference
  # them by absolute models_path.
  # Idle unload groups (2026-11-26): the server keeps ONE non-permanent group
  # loaded at a time. The three retrieval models share a group so they load and
  # unload together (a search embeds, then reranks); without it each request to a
  # different model would swap the previous one out. interval_ai is tiny and stays
  # loaded ("permanent").
  config.json: |
    {
      "mediapipe_config_list": [
        { "name": "e5-large", "graph_path": "/config/graph.pbtxt", "group_name": "retrieval" },
        { "name": "qwen3-embedding-0.6b", "graph_path": "/config/qwen3-embedding-graph.pbtxt", "group_name": "retrieval" },
        { "name": "qwen3-reranker-0.6b", "graph_path": "/config/rerank-graph.pbtxt", "group_name": "retrieval" }
      ],
      "model_config_list": [
        {
          "config": {
            "name": "interval_ai",
            "group_name": "permanent",
            "base_path": "/mnt/models/interval_ai",
            "target_device": "GPU",
            "plugin_config": { "INFERENCE_PRECISION_HINT": "f32" }
          }
        }
      ]
    }
  # OpenAI-compatible embeddings graph (OVMS 2025.4 EmbeddingsCalculatorOV).
  # e5 requires MEAN pooling; embeddings are L2-normalized server-side.
  graph.pbtxt: |
    input_stream: "REQUEST_PAYLOAD:input"
    output_stream: "RESPONSE_PAYLOAD:output"
    node {
      name: "EmbeddingsExecutor"
      input_side_packet: "EMBEDDINGS_NODE_RESOURCES:embeddings_servable"
      calculator: "EmbeddingsCalculatorOV"
      input_stream: "REQUEST_PAYLOAD:input"
      output_stream: "RESPONSE_PAYLOAD:output"
      node_options: {
        [type.googleapis.com / mediapipe.EmbeddingsCalculatorOVOptions]: {
          models_path: "/mnt/models/e5-large/1",
          plugin_config: '{"NUM_STREAMS": "1", "CACHE_DIR": "/cache"}',
          normalize_embeddings: true,
          pooling: CLS,
          target_device: "GPU"   # explicit: bookmarked + intervalai embeddings run on the i915, not the CPU
        }
      }
    }
  # 2026-10-02: the qwen2.5-1.5b-instruct LLM moved to its own pod (llm.yaml, ovms-llm).
  # 2026-10-01: Qwen3-Embedding-0.6B (OpenVINO int8, Apache-2.0, 1024 d, LAST pooling).
  # Eval on bookmarked's 62 bookmarks / 20 labelled queries: hit@1 18/20, MRR 0.935,
  # relevance margin 0.277 vs e5-large CLS (no prefixes) 11/20, 0.636, 0.039.
  # Queries need the instruction prefix
  #   "Instruct: Given a web search query, retrieve relevant bookmarks that match the query\nQuery: "
  # documents get none. e5-large stays for firebook / intervalai / code-search until migrated.
  qwen3-embedding-graph.pbtxt: |
    input_stream: "REQUEST_PAYLOAD:input"
    output_stream: "RESPONSE_PAYLOAD:output"
    node {
      name: "EmbeddingsExecutor"
      input_side_packet: "EMBEDDINGS_NODE_RESOURCES:embeddings_servable"
      calculator: "EmbeddingsCalculatorOV"
      input_stream: "REQUEST_PAYLOAD:input"
      output_stream: "RESPONSE_PAYLOAD:output"
      node_options: {
        [type.googleapis.com / mediapipe.EmbeddingsCalculatorOVOptions]: {
          models_path: "/mnt/models/qwen3-embedding-0.6b",
          plugin_config: '{"NUM_STREAMS": "1", "CACHE_DIR": "/cache"}',
          normalize_embeddings: true,
          pooling: LAST,
          truncate: true,
          target_device: "GPU"
        }
      }
    }
  # 2026-10-07: cross-encoder reranker for Firebook "find similar" (via the
  # shared-ai-gateway /api/ai/rerank). OpenVINO/Qwen3-Reranker-0.6B-seq-cls-fp16-ov
  # (Apache-2.0). bge-reranker-base-int8-ov was tried first and REJECTED: it ranked
  # a cookie recipe above a Traefik doc for a Traefik query, identically on CPU and
  # GPU (broken pre-converted model, not precision). Qwen3 ranks correctly but needs
  # client-side templates (the gateway applies them):
  #   query    = <|im_start|>system ... <|im_start|>user\n<Instruct>: {instr}\n<Query>: {q}\n
  #   document = <Document>: {doc}<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n
  # Graph generated by `ovms --pull --task rerank` (2025.4), models_path made absolute.
  # POST /v3/rerank {model: "qwen3-reranker-0.6b", query, documents[], top_n}.
  # Runs on this pod's Iris Xe (neonmarmoset) -- no extra GPU slot.
  rerank-graph.pbtxt: |
    input_stream: "REQUEST_PAYLOAD:input"
    output_stream: "RESPONSE_PAYLOAD:output"
    node {
      name: "RerankExecutor"
      calculator: "RerankCalculatorOV"
      input_side_packet: "RERANK_NODE_RESOURCES:rerank_servable"
      input_stream: "REQUEST_PAYLOAD:input"
      output_stream: "RESPONSE_PAYLOAD:output"
      node_options: {
        [type.googleapis.com / mediapipe.RerankCalculatorOVOptions]: {
          models_path: "/mnt/models/qwen3-reranker-0.6b",
          max_allowed_chunks: 10000,
          target_device: "GPU",
          plugin_config: '{"NUM_STREAMS": "1", "CACHE_DIR": "/cache"}'
        }
      }
    }
