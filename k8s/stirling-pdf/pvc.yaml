---
# Stirling PDF's /configs volume — holds the embedded H2 database with every
# user account, plus settings.yml and the app's own DB dumps under backup/db.
#
# Declared HERE rather than left to the chart (persistence.existingClaim points
# at it) for one reason: the chart's pvc.yaml template supports labels but not
# annotations, and this volume needs `k8up.io/backup: "false"`.
#
# 🔑 Why that annotation: k8up's PVC backup method mounts the PV a SECOND time
# on the node. The original openebs LVM volume refused that (`verifyMount:
# device already mounted`), so the volume is backed up instead by the
# k8up.io/backupcommand annotation on the pod (see
# helm-charts/stirling-pdf/values-override.yaml), which streams a tar of
# /configs out of the running container and needs no mount at all. Kept on
# local-path too: exec backups work the same regardless of storage driver.
#
# 2026-09-26: moved from openebs-lvmpv on elitedesk to local-path on the edge
# node (vmi3610371), which has no LVM volume group. local-path pins the PV to
# whichever node first mounts it; the data was restored into it with a helper
# pod on the edge node before the app started. The old elitedesk LV
# (pvc-d1e0e989-f4e4-4b23-b853-c09cd3b12021, reclaim Retain) was left in place
# as a fallback.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  annotations:
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
