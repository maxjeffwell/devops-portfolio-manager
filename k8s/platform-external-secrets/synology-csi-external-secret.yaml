# ExternalSecret synology-csi/synology-csi-external-secret. Exported from the LIVE spec 2026-09-26 (was hand-applied;
# the old copies in k8s/external-secrets were stale). Verified with an empty kubectl diff.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synology-csi-external-secret
  namespace: synology-csi
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: SYNOLOGY_CSI_HOST
      metadataPolicy: None
    secretKey: SYNOLOGY_CSI_HOST
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: SYNOLOGY_CSI_PASSWORD
      metadataPolicy: None
    secretKey: SYNOLOGY_CSI_PASSWORD
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: SYNOLOGY_CSI_PORT
      metadataPolicy: None
    secretKey: SYNOLOGY_CSI_PORT
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: SYNOLOGY_CSI_USERNAME
      metadataPolicy: None
    secretKey: SYNOLOGY_CSI_USERNAME
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: client-info-secret
    template:
      data:
        client-info.yml: "clients:\n- host: {{ .SYNOLOGY_CSI_HOST }}\n  https: false\n\
          \  password: {{ .SYNOLOGY_CSI_PASSWORD }}\n  port: {{ .SYNOLOGY_CSI_PORT\
          \ }}\n  username: {{ .SYNOLOGY_CSI_USERNAME }}\n"
      engineVersion: v2
      mergePolicy: Replace
