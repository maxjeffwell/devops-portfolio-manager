{{- if .Values.database.expose.enabled }}
# Public Postgres endpoint for firebook's Firebase Cloud Functions (they run in
# Google Cloud and cannot reach ClusterIPs). Traefik terminates TLS using
# Postgres STARTTLS + SNI, so only TLS clients that ask for this exact hostname
# are routed. Auth = md5 password of the "firebook" role, which is the only
# role allowed to CONNECT to the firebook database.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: firebook-db
  namespace: {{ .Release.Namespace }}
spec:
  secretName: firebook-db-tls
  dnsNames:
    - {{ .Values.database.expose.host }}
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod-dns
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: firebook-db
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`{{ .Values.database.expose.host }}`)
      services:
        - name: {{ .Values.database.expose.service }}
          port: {{ .Values.database.expose.port }}
  tls:
    secretName: firebook-db-tls
{{- end }}
