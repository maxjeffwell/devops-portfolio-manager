apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

# Argo CD's OWN install, under GitOps (self-managed via gitops/applications/argocd.yaml).
#
# install.yaml is the pristine upstream non-HA manifest, vendored (not a remote
# URL) because the ArgoCD repo-server blocks remote kustomize resources — same
# reason as k8s/barman-cloud-plugin. Do NOT edit install.yaml; every local
# change is a patch below so it survives re-vendoring.
#   source: https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.8/manifests/install.yaml
#   version: v3.5.8
#   sha256: 948e7e3a70b03130f70e4c02ee2357c1cc97fb766674b6bddaed0f537cd5a00f
# Upgrade: ./upgrade.sh v3.x.y  →  kubectl diff --server-side -k k8s/argocd  →  commit.
#
# History: until 2026-09-30 this install was `kubectl apply`d by hand and its
# placement pins were live `kubectl patch`es with no git record (hostname pins
# to debian-marmoset 9/6, application-controller → m720q 9/24, all replaced by
# the control-plane affinity 9/26). This overlay captured the live state
# verbatim on 2026-09-30 — first sync was a no-op.
resources:
  - install.yaml
  - pdb.yaml

patches:
  # ── Placement ───────────────────────────────────────────────────────────
  # NO node affinity (2026-09-30). The 9/26 "control-plane Exists" rule was a
  # stand-in for "always-on home box"; the scheduler already balances by
  # requests across every schedulable node, and the nodes that must NOT host
  # infrastructure are excluded by taints (marmoset workload=laptop, VPS
  # role=edge), not by lists here. Only the nfs=broken toleration remains so a
  # node tainted during an NFS incident keeps its Argo CD pods.
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=argocd
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: selected-by-target
      spec:
        template:
          spec:
            tolerations:
              - key: nfs
                operator: Equal
                value: broken
                effect: NoSchedule
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            tolerations:
              - key: nfs
                operator: Equal
                value: broken
                effect: NoSchedule

  # ── application-controller: prefer the CPU node (2026-10-09) ────────────
  # Exception to "no node affinity" above, by user decision: CPU-heavy workloads
  # get PRIORITY on m920s (label homelab/cpu-tier=high), as a weighted PREFERENCE
  # only -- it still runs anywhere else when m920s is down or full. 7d p95 213m.
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 80
                    preference:
                      matchExpressions:
                        - key: homelab/cpu-tier
                          operator: In
                          values: ["high"]

  # ── repo-server ─────────────────────────────────────────────────────────
  # Memory limit only: kustomize/helm renders are the one thing in Argo CD
  # that can balloon. (2026-09-30: the m920s soft preference and the no-op
  # PreferNoSchedule toleration were dropped; it now gets the common nfs
  # toleration like every other component.)
  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-repo-server
                resources:
                  requests:
                    # 2026-10-15: 100m -> 50m (7-day p95 < 10m per replica; N-1 trim)
                    cpu: 50m
                    memory: 256Mi
                  limits:
                    memory: 512Mi

  # ── application-controller resources ────────────────────────────────────
  # 50 Applications; the controller's cache is the largest Argo CD consumer.
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-application-controller
                resources:
                  requests:
                    # 2026-09-30: cpu 100m -> 200m. 30-day peak 180m, 7d p95 69m:
                    # reconcile bursts ran above the old request.
                    cpu: 200m
                    # 2026-11-16: memory 1Gi -> 1280Mi. 7d avg 941Mi, p95 1084Mi,
                    # 7d/30d max 1241/1256Mi: it ran above the old request 12% of
                    # the time. Limit and GOMEMLIMIT unchanged.
                    memory: 1280Mi
                  limits:
                    # 2026-10-21: 2Gi -> 3Gi. Working set sits at 0.85-1.25 GiB but the
                    # 12-hourly cluster-cache rebuild and refresh bursts spike past 2 GiB
                    # in under 30 s (4 OOMKills 10/16 + 10/22). m920s has the headroom.
                    memory: 3Gi
                env:
                  # Go GC soft limit just under the cgroup limit, so the collector works
                  # harder before the kernel kills the container (default GOGC lets the
                  # heap roughly double between cycles).
                  - name: GOMEMLIMIT
                    value: 2560MiB

  # ── server resources ────────────────────────────────────────────────────
  # 2026-09-30: was running on the namespace LimitRange default (64Mi) while
  # using 109Mi (15d peak 112Mi).
  # 2026-11-21: memory limit added (user decision after the Kubescape triage;
  # until then this namespace was request-only). 15d peak 137Mi -> 512Mi.
  # Limits here are a runaway guard at ~3x the observed peak, not a tight fit.
  - target:
      kind: Deployment
      name: argocd-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-server
                resources:
                  requests:
                    cpu: 50m
                    memory: 192Mi
                  limits:
                    memory: 512Mi

  # ── dex + notifications resources (2026-11-16) ──────────────────────────
  # Both were on the namespace LimitRange default (64Mi) while using more:
  #   dex            7d avg 56Mi, p95 97Mi, 30d max 105Mi  -> 128Mi
  #   notifications  7d avg 61Mi, p95 64Mi, 30d max 73Mi   -> 96Mi
  # CPU stays at the default 10m (both use ~1m or less).
  # 2026-11-21: memory limits added, ~3x the 15d peak (dex 105Mi -> 384Mi,
  # notifications 69Mi -> 256Mi). applicationset-controller and redis get their
  # own patch below.
  - target:
      kind: Deployment
      name: argocd-dex-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
      spec:
        template:
          spec:
            containers:
              - name: dex
                resources:
                  requests:
                    cpu: 10m
                    memory: 128Mi
                  limits:
                    memory: 384Mi
  - target:
      kind: Deployment
      name: argocd-notifications-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-notifications-controller
                resources:
                  requests:
                    cpu: 10m
                    memory: 96Mi
                  limits:
                    memory: 256Mi

  # ── applicationset-controller + redis memory limits (2026-11-21) ────────
  # Requests are written out at the LimitRange default they already ran on
  # (10m / 64Mi): a container with a limit and NO request gets request = limit,
  # which would have raised both requests. 15d peaks: applicationset 48Mi,
  # redis 30Mi (it was 14Mi on 11/16, so it gets extra room).
  - target:
      kind: Deployment
      name: argocd-applicationset-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-applicationset-controller
                resources:
                  requests:
                    cpu: 10m
                    memory: 64Mi
                  limits:
                    memory: 192Mi
  - target:
      kind: Deployment
      name: argocd-redis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests:
                    cpu: 10m
                    memory: 64Mi
                  limits:
                    memory: 256Mi

  # ── Two copies of the stateless parts (2026-10-07) ─────────────────────
  # Until now every component was one pod and all seven sat on m920s: a drain
  # or crash of that node took the UI, CLI and manifest rendering down with it.
  # argocd-server and argocd-repo-server are stateless, so 2 replicas each, with
  # a SOFT hostname spread (ScheduleAnyway: prefers different nodes, never pins
  # one; the scheduler still decides). ARGOCD_API_SERVER_REPLICAS mirrors
  # upstream's HA manifest (per-replica share of the login rate limit).
  # Deliberately still 1: application-controller (2 needs sharding, pointless at
  # ~45 apps), redis (a cache; HA = 3 redis + 3 haproxy), dex, notifications,
  # applicationset. PDBs below keep >= 1 copy through drains.
  - target:
      kind: Deployment
      name: argocd-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        replicas: 2
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: argocd-server
            containers:
              - name: argocd-server
                env:
                  - name: ARGOCD_API_SERVER_REPLICAS
                    value: "2"
  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        replicas: 2
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: argocd-repo-server

  # ── Config ──────────────────────────────────────────────────────────────
  # argocd-cm: local API accounts (radar, claude-mcp), kustomize load
  # restrictor, and health checks for Deployment/CronJob. Merged over the
  # upstream defaults (which are left untouched).
  - path: argocd-cm-patch.yaml
  # argocd-rbac-cm: role bindings for those accounts.
  - path: argocd-rbac-cm-patch.yaml

# NOT managed here, on purpose:
#   - argocd-secret / argocd-notifications-secret contents: runtime-populated
#     (admin password, server.secretkey, account tokens, TLS). The upstream
#     Secret objects are applied with NO data; server-side apply leaves the
#     runtime-owned keys alone.
#   - argocd-server-ingress: owned by the portfolio-orchestration-platform app.
#   - argocd-tls Certificate + argocd-initial-admin-secret: hand-created, unmanaged.
