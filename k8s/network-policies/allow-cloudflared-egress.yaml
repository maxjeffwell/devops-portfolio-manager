# NetworkPolicy default/allow-cloudflared-egress. Exported from the live cluster 2026-09-26 (it was
# hand-applied, tracked by nothing); verified with an empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared-egress
  namespace: default
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector: {}
  - ports:
    - port: 443
      protocol: TCP
    - port: 7844
      protocol: TCP
    - port: 7844
      protocol: UDP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
  - ports:
    - protocol: TCP
    to:
    - podSelector: {}
  ingress:
  - from:
    - podSelector: {}
  podSelector:
    matchLabels:
      app: cloudflared-ai-gateway
  policyTypes:
  - Egress
  - Ingress
