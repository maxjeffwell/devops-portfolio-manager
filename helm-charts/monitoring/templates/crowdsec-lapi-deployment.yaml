{{- if .Values.crowdsec.lapi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-lapi
  namespace: {{ .Release.Namespace }}
  labels:
    app: crowdsec-lapi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crowdsec-lapi
  template:
    metadata:
      labels:
        app: crowdsec-lapi
    spec:
      # 2026-10-07: servers only. The marmoset (workload=laptop) toleration is
      # gone -- marmoset is the daily-driver laptop and only runs DaemonSets --
      # and an m920s drain had left the LAPI on debian-marmoset (GPU node).
      # mayastor is nvmf/network-attached, so the volume follows the pod.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: In
                    values: ["true"]
      containers:
        - name: crowdsec
          image: "{{ .Values.crowdsec.lapi.image.repository }}:{{ .Values.crowdsec.lapi.image.tag }}"
          ports:
            - name: api
              containerPort: 8080
            - name: metrics
              containerPort: 6060
          env:
            - name: DISABLE_AGENT
              value: "true"
            - name: AGENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-log-processor-credentials
                  key: username
            - name: AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crowdsec-log-processor-credentials
                  key: password
            - name: BOUNCER_KEY_traefik
              valueFrom:
                secretKeyRef:
                  name: crowdsec-bouncer-lapi-key
                  key: lapi-key
            - name: COLLECTIONS
              value: "{{ .Values.crowdsec.lapi.collections }}"
            - name: CROWDSEC_BYPASS_DB_VOLUME_CHECK
              value: "true"
            # 2026-10-07: with /etc/crowdsec ephemeral every restart did a fresh
            # `cscli capi register`; after a day of drains api.crowdsec.net
            # answered 403 and the entrypoint exited (crash loop). Toggle while
            # CAPI refuses registration; the bouncers stay fail-open meanwhile.
            - name: DISABLE_ONLINE_API
              value: {{ .Values.crowdsec.lapi.disableOnlineApi | default false | quote }}
          volumeMounts:
            # Volume ROOT = the existing crowdsec.db; do not add a subPath here.
            - name: lapi-data
              mountPath: /var/lib/crowdsec/data
            # Persist the config dir (incl. online_api_credentials.yaml) so the
            # CAPI machine registers ONCE. The image seeds an empty /etc/crowdsec
            # from /staging on first start. (Also visible as
            # /var/lib/crowdsec/data/etc-crowdsec; crowdsec ignores it.)
            - name: lapi-data
              mountPath: /etc/crowdsec
              subPath: etc-crowdsec
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.crowdsec.lapi.resources | nindent 12 }}
      volumes:
        - name: lapi-data
          persistentVolumeClaim:
            claimName: crowdsec-lapi-data
{{- end }}
