# ServiceAccount + ClusterRole used by the home nodes' UPS power-fail handling
# (NUT SHUTDOWNCMD cordon+drain, uncordon on boot). See k8s/node-powerfail/.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-powerfail
  namespace: argocd
  labels:
    app: node-powerfail
    infrastructure: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/maxjeffwell/devops-portfolio-manager.git
    targetRevision: main
    path: k8s/node-powerfail
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
