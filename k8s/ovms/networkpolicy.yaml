apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ovms-allow-cluster
  namespace: ovms
spec:
  podSelector:
    matchExpressions:
      # ovms-embed-m720q (2026-10-02) = embeddings-only replica on m720q's UHD 630.
      - { key: app, operator: In, values: [ovms-embeddings, ovms-embed-m720q] }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - { port: 8000, protocol: TCP }
        - { port: 9000, protocol: TCP }
