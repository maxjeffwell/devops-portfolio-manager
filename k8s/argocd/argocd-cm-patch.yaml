# Local additions merged over the upstream argocd-cm defaults.
# 2026-09-30: dropped `kustomize.buildOptions: --load-restrictor LoadRestrictionsNone`
# (cluster-wide, let any kustomization read files outside its directory).
# All 13 kustomize apps are k8s/<dir> in this repo with no parent-path refs,
# so the default LoadRestrictionsRootOnly is sufficient. Re-add per-app via
# spec.source.kustomize if one ever needs it — not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  accounts.claude-mcp: apiKey
  accounts.radar: apiKey
  resource.customizations.health.apps_Deployment: |-
    hs = {}
    if obj.status ~= nil then
      if obj.status.conditions ~= nil then
        for i, condition in ipairs(obj.status.conditions) do
          if condition.type == "Available" and condition.status == "True" then
            hs.status = "Healthy"
            hs.message = condition.message
            return hs
          end
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for rollout"
    return hs
  resource.customizations.health.batch_CronJob: |
    hs = {}
    if obj.spec.suspend ~= nil and obj.spec.suspend then
      hs.status = "Healthy"
      hs.message = "CronJob is suspended"
    else
      hs.status = "Healthy"
      hs.message = "CronJob is active"
    end
    return hs
  # 2026-10-21: resource.exclusions. A ConfigMap key is replaced whole by this
  # patch, so the upstream defaults are repeated here, then local additions.
  # Everything in the cluster is listed by the controller's cache on every
  # 12-hourly resync; these kinds are never managed by an Application and were
  # the bulk of it (985 PodVolumeBackups, 177 CNPG Backups, 256 PodMetrics).
  resource.exclusions: |
    ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
    - apiGroups:
      - ''
      - discovery.k8s.io
      kinds:
      - Endpoints
      - EndpointSlice
    ### Internal Kubernetes resources excluded reduce the number of watched events
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    ### Intermediate Certificate Request excluded reduce the number of watched events
    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
    ### Local (2026-10-21): per-run backup records and live metrics, never in git
    - apiGroups:
      - velero.io
      kinds:
      - PodVolumeBackup
      - PodVolumeRestore
      - DataUpload
      - DataDownload
      - BackupRepository
    - apiGroups:
      - postgresql.cnpg.io
      kinds:
      - Backup
    - apiGroups:
      - metrics.k8s.io
      kinds:
      - PodMetrics
      - NodeMetrics
