# ExternalSecret default/devops-portfolio-external-secret. Exported from the LIVE spec 2026-09-26 (was hand-applied;
# the old copies in k8s/external-secrets were stale). Verified with an empty kubectl diff.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devops-portfolio-external-secret
  namespace: default
  annotations:
    force-sync: '1775694571'
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: NEON_DATABASE_URL
      metadataPolicy: None
    secretKey: auth-database-url
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: GITHUB_TOKEN
      metadataPolicy: None
