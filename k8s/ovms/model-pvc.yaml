# OVMS model cache on Mayastor, m920s NVMe (mayastor-ovms-models = m920s-nvme-pool
# only). Network-attached, so the pod isn't tied to a node by storage. Hydrated from
# Garage by model-loader. The old dm-local lvmpv `ovms-models` PVC was removed 2026-10-02.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ovms-models-m920s
  namespace: ovms
  labels:
    app: ovms-embeddings
    portfolio: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: mayastor-ovms-models
  resources:
    requests:
      storage: 8Gi
