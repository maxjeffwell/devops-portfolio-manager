# ExternalSecret default/postgresql-codetalk-external-secret. Exported from the LIVE spec 2026-09-26 (was hand-applied;
# the old copies in k8s/external-secrets were stale). Verified with an empty kubectl diff.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-codetalk-external-secret
  namespace: default
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: POSTGRESQL_CODETALK_PASSWORD
      metadataPolicy: None
    secretKey: postgres-password
  refreshInterval: 24h29m30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: postgresql-codetalk-secrets
