priorityClassName: portfolio-app
# 2026-10-15: 2 client replicas (hostname spread + PDB) so a server loss or a
# deploy never drops the frontend; the server side is HPA-managed (min 2).
replicaCount: 2

strategy:
  # 2026-10-15: Recreate -> RollingUpdate for the 2-replica client
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  client:
    repository: maxjeffwell/k8s-ui-library-storybook
    tag: 20260516-232953-c5d8117
    pullPolicy: Always

service:
  client:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30011

resources:
  client:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3

autoscaling:
  enabled: false

env:
  client: []

serviceAccount:
  create: false

podSecurityContext: {}

securityContext: {}

ingress:
  enabled: true
  host: showcase.el-jefe.me

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# Static client runs on the edge node next to Traefik
nodeSelectorClient:
  role: edge
tolerationsClient:
  - key: role
    operator: Equal
    value: edge
    effect: PreferNoSchedule
# Both client replicas are pinned to the single edge node, so a node-affinity
# preference and a hostname spread have nothing to choose between; switch the
# chart-wide ones off for this component (the server keeps them).
affinityClient: {}
topologySpreadConstraintsClient:
  enabled: false

nodeSelector: {}

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - "true"

pdb:
  enabled: true
  minAvailable: 1
