# LAN entry for the Tdarr web UI (2026-11-22), used ONLY by the NAS reverse
# proxy that serves tdarr.home.arpa.
#
# Tdarr runs with auth=false and can modify the rw media library, so the UI
# must not be open to every LAN device:
#  - the Service answers on the Tdarr node's LAN address only (externalIPs),
#    with externalTrafficPolicy: Local so the client address is preserved
#    (the pod is pinned to that node, see server.yaml);
#  - the NetworkPolicy below then admits exactly the NAS addresses on :8265.
# Any other LAN client connecting to <node>:8265 is dropped by the policy.
# If the server pod is ever moved to another node, change externalIPs with it.
apiVersion: v1
kind: Service
metadata:
  name: tdarr-lan
  namespace: tdarr
spec:
  type: ClusterIP
  selector: {app: tdarr}
  externalTrafficPolicy: Local
  externalIPs:
    - 192.168.50.110
  ports:
    - {name: webui, port: 8265, targetPort: webui}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tdarr-webui-from-nas-proxy
  namespace: tdarr
spec:
  podSelector:
    matchLabels: {app: tdarr}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 192.168.50.142/32}
        - ipBlock: {cidr: 192.168.50.149/32}
      ports:
        - {port: 8265, protocol: TCP}
