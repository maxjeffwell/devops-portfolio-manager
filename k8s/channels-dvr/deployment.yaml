# Channels DVR WARM STANDBY for the primary on the ASUSTOR (192.168.50.142:8089).
# TVE (Spectrum) authenticates against the home egress IP, so this can never
# run on the cloud nodes.
#
# PINNED to elitedesk by hostname (2026-09-30). This is an ADDRESS pin, not
# steering: the service is reached through hostPort 8089 on whichever node runs
# the pod, so the node IS the client-facing address. Clients add the server
# manually as 192.168.50.115:8089 (elitedesk bond0; eno1 192.168.50.116 and
# tailnet 100.64.0.8 also answer). When the pin was dropped on 2026-09-30 the
# pod moved m920s -> elitedesk on an unrelated restart and the documented
# address 192.168.50.155:8089 went dead; moving a hostPort service means
# re-pointing every client. Changing the node = change the pin AND the clients.
#
# Pod network + container hostPort 8089: portmap binds the node port and DNATs
# to the pod — unlike hostNetwork, traffic traverses the pod veth so
# networkpolicy.yaml is actually enforced. Trade-off: no bonjour/mDNS
# discovery (upstream docker docs use --net=host purely for that).
#
# Standby discipline: same sources configured, recording passes DISABLED.
# Both servers share the same Spectrum TVE ~3-stream cap (enforced at the
# provider by egress IP, not per server). On primary failure: restore the
# newest /channels-dvr/primary-db-backups snapshot via the UI, enable passes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channels-dvr
  namespace: channels-dvr
  labels:
    app: channels-dvr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: channels-dvr
  template:
    metadata:
      labels:
        app: channels-dvr
      annotations:
        # primary is a 125GB ROX NFS mount of the ASUSTOR's live DVR data —
        # not k8s state. A full kopia upload can't finish inside Velero's 4h
        # fs-backup-timeout, and the nightly failure wedged node-agent
        # data-path slots, starving every other backup on this node.
        # recordings is bulk DVR media with the same problem: its PVB crawled
        # at ~20KB/s past the timeout on 8/8, cascading ~80 errors into the
        # daily backup as every later item hit the exhausted context.
        backup.velero.io/backup-volumes-excludes: primary,recordings
    spec:
      # Hostname pin = the hostPort address clients use (see header). elitedesk
      # has the i915 + GpuDevicePlugin and is a Mayastor csi node, so the other
      # two placement facts are satisfied. (History: hard m920s pin 9/25 -> soft
      # m920s 9/26 -> soft neonmarmoset 9/30 -> none 9/30 -> elitedesk 9/30.)
      nodeSelector:
        kubernetes.io/hostname: elitedesk
      containers:
        - name: channels-dvr
          # :tve, not :latest — the default image is Alpine WITHOUT Chrome;
          # TV Everywhere login drives a headless Chrome server-side, so the
          # Spectrum TVE source only works on the Debian-based tve variant.
          image: fancybits/channels-dvr:tve
          env:
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 8089
              hostPort: 8089
              name: http
          volumeMounts:
            - name: data
              mountPath: /channels-dvr
            - name: recordings
              # /shares/DVR is the path the image's setup UI offers by default
              mountPath: /shares/DVR
            - name: primary
              mountPath: /primary
              readOnly: true
          resources:
            requests:
              # 2026-09-30: cpu 250m -> 400m. Recording/transcode bursts peaked at
              # 382m and exceeded the old request in 22 five-minute windows over 30
              # days; no cpu limit, so this only corrects the scheduler's view.
              cpu: 400m
              memory: 512Mi
              gpu.intel.com/i915: "1"
            limits:
              memory: 4Gi
              gpu.intel.com/i915: "1"
          readinessProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: channels-dvr-data
        - name: recordings
          persistentVolumeClaim:
            claimName: channels-dvr-recordings-nfs
        - name: primary
          persistentVolumeClaim:
            claimName: channels-dvr-primary-data
            readOnly: true
