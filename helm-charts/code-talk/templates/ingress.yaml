{{- if .Values.ingress.enabled }}
{{- $hosts := list .Values.ingress.host }}
{{- range .Values.ingress.extraHosts }}{{ $hosts = append $hosts . }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    # WebSocket sticky sessions for horizontal scaling
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "code-talk-affinity"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "strict"
spec:
  ingressClassName: traefik
  rules:
  {{- range $hosts }}
  - host: {{ . }}
    http:
      paths:
      {{- range $.Values.ingress.serverPaths }}
      - path: {{ . }}
        pathType: Prefix
        backend:
          service:
            name: {{ $.Release.Name }}-server
            port:
              number: {{ $.Values.service.server.port }}
      {{- end }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $.Release.Name }}-client
            port:
              number: {{ $.Values.service.client.port }}
  {{- end }}
  tls:
  - hosts:
    {{- range $hosts }}
    - {{ . }}
    {{- end }}
    secretName: {{ .Release.Name }}-tls
{{- end }}
