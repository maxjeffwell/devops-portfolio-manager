# kubenav (iPhone app) ServiceAccount, cluster-admin by user choice 2026-10-02.
# The phone reaches the API over the tailnet (https://100.64.0.2:6443). The token
# lives in the Secret below (filled in by the token controller, never in git).
# Lost phone: delete the Secret, and the controller issues a new token while the old one stops working.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubenav
  namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: kubenav-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: kubenav
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubenav-cluster-admin
subjects:
- kind: ServiceAccount
  name: kubenav
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
