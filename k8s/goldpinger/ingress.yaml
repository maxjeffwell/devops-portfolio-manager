# Standard Ingress catches all traffic to goldpinger.el-jefe.me with the
# CrowdSec bouncer middleware (cluster-wide IP reputation filtering) and the
# shared admin basic-auth (same chain as prometheus.el-jefe.me).
# cert-manager provisions goldpinger-tls automatically via the annotation.
# 2026-11-21: basic-auth added. Until then the UI, /check_all and /metrics were
# readable by anyone and listed every node's tailnet IP, pod IPs and pod names;
# the bouncer only filters known-bad IPs, it does not authenticate.
# Prometheus scrapes the pods directly (ServiceMonitor), not this hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goldpinger
  namespace: goldpinger
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd,kube-system-admin-basic-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - goldpinger.el-jefe.me
      secretName: goldpinger-tls
  rules:
    - host: goldpinger.el-jefe.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goldpinger
                port:
                  number: 80
