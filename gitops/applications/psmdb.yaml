apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: psmdb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/maxjeffwell/devops-portfolio-manager.git
    targetRevision: main
    path: k8s/psmdb
  destination:
    server: https://kubernetes.default.svc
    namespace: percona-mongodb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      # SSA so ArgoCD only owns the fields in git; the PSMDB operator keeps its own.
      - ServerSideApply=true
      - ServerSideDiff=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
