apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
    portfolio: "true"
spec:
  # 2026-09-15 — Redeployed on debian-marmoset as the PRIMARY Jellyfin (the
  # ASUSTOR Docker instance at 192.168.50.142:28096 becomes the standby).
  # dm's Iris Xe (Alder Lake-P) does QSV via the Intel GPU device plugin.
  # /config and /cache are openebs-lvmpv on dm's openebs-vg (Mayastor cannot
  # mount on dm: no csi-node there). Media is read-only NFS from ASUSTOR .149,
  # mounted at the SAME container paths the ASUSTOR instance uses
  # (/sharefolder/Movies, "/sharefolder/TV Shows", /media/dvr) so a copied
  # /config keeps its library paths.
  replicas: 1
  strategy:
    # Recreate avoids RWO PVC dual-attach during rollouts.
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        portfolio: "true"
      annotations:
        # Opt OUT of kopia FS-backup for replaceable volumes (cluster default is
        # defaultVolumesToFsBackup=true). KEEP `config` — irreplaceable
        # library/watch-state metadata.
        backup.velero.io/backup-volumes-excludes: media-movies,media-tvshows,rec-channels,media-sabnzbd,cache,transcodes,tmp,run
    spec:
      # DNS served by the cluster-wide NodeLocal DNSCache (k8s/nodelocaldns).
      dnsPolicy: ClusterFirst
      # 2026-10-01: intel-gpu-gen=xe is a HARDWARE fact label (Alder Lake Xe iGPU on
      # debian-marmoset + neonmarmoset; the three UHD 630 nodes are gen9). The
      # encoding ConfigMap enables AV1 hardware decode and the HEVC low-power
      # encoder, which UHD 630 lacks (vainfo-verified), so jellyfin stays on Xe.
      # 2026-10-02 GPU split (user decision): neonmarmoset Xe = jellyfin + ovms-embeddings;
      # debian-marmoset Xe = immich-ml + ovms-llm. jellyfin has no hostname pin, so either
      # Xe node qualifies and jellyfin fails over to debian-marmoset if neon is down
      # (sharedDevNum 4 lets it share dm's iGPU with OVMS). It only fits there when dm
      # has ~1Gi of free requests; no preemption on purpose -- dm's mongodb secondaries
      # are on node-local openebs-lvmpv and could not reschedule if evicted.
      # After a failover, restart the deployment once neon is back to move it home.
      # 2026-10-02 later (user decision): HOME moved back to debian-marmoset -- neon
      # lacked the room. Preferred (not required) so it can still fail over.
      # 2026-10-05 (user decision): dm + neon carry a gpu-priority=true:PreferNoSchedule
      # taint so the scheduler steers non-GPU work elsewhere; GPU workloads tolerate it.
      # 2026-10-06 (user decision): HOME = neonmarmoset again, restoring the 10/2
      # split (neon: jellyfin + ovms-embeddings; dm: immich-ml + ovms-llm). The
      # gpu-priority sweep freed ~1.7Gi of requests on neon, so it fits. dm stays
      # the failover. gpu-failback.yaml HOME_NODE must match this preference.
      tolerations:
        - key: gpu-priority
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      nodeSelector:
        gpu-node: "true"
        intel-gpu-gen: xe
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [neonmarmoset] }
      priorityClassName: portfolio-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Only re-chown when the volume root is wrong. Default (Always) walks every
        # file in the metadata-heavy config volume on each start -- minutes over NVMe-oF.
        fsGroupChangePolicy: OnRootMismatch
        # 992 = `render` group on debian-marmoset AND neonmarmoset (owner of /dev/dri/renderD128).
        supplementalGroups: [992]
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Recover encoding.xml if it's missing or corrupt (Jellyfin silently
        # falls back to HardwareAccelerationType=none on a bad file), and keep
        # TranscodingTempPath on the dedicated /transcodes emptyDir.
        - name: ensure-encoding-config
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              TARGET=/config/config/encoding.xml
              mkdir -p /config/config
              if [ ! -s "$TARGET" ] || ! grep -q '</EncodingOptions>' "$TARGET" 2>/dev/null; then
                echo "Restoring encoding.xml from ConfigMap (missing or corrupt)"
                cp /default/encoding.xml "$TARGET"
              else
                echo "encoding.xml is present and well-formed; leaving alone"
              fi
              if grep -q '<TranscodingTempPath>/cache/transcodes</TranscodingTempPath>' "$TARGET" 2>/dev/null; then
                echo "Migrating TranscodingTempPath: /cache/transcodes -> /transcodes"
                sed -i 's|<TranscodingTempPath>/cache/transcodes</TranscodingTempPath>|<TranscodingTempPath>/transcodes</TranscodingTempPath>|' "$TARGET"
              fi
              # A config copied from the ASUSTOR Docker instance has an empty
              # TranscodingTempPath (= Jellyfin default /cache/transcodes). Pin it.
              if grep -q '<TranscodingTempPath />' "$TARGET" 2>/dev/null; then
                echo "Setting empty TranscodingTempPath -> /transcodes"
                sed -i 's|<TranscodingTempPath />|<TranscodingTempPath>/transcodes</TranscodingTempPath>|' "$TARGET"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: encoding-defaults, mountPath: /default, readOnly: true }
      containers:
        - name: jellyfin
          # Pinned to the exact dated build the ASUSTOR runs (12.1, 12.1.20260915-010956, digest 78d3ea12…)
          # so a copied /config needs no downgrade. Jellyfin 12 tags are MAJOR.MINOR or dated builds — no x.y.z. Bump deliberately.
          image: jellyfin/jellyfin:12.1.20260915-010956
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          env:
            - { name: TZ, value: America/New_York }
            - { name: JELLYFIN_PublishedServerUrl, value: https://jellyfin-k8s.el-jefe.me }
            # NOTE: do not add JELLYFIN_FFmpeg__transcoding_temp_path — Jellyfin
            # reads EncodingOptions from encoding.xml and ignores env overrides
            # for that section. The initContainer pins TranscodingTempPath.
          resources:
            requests:
              # A full-QSV transcode still draws ~0.9 core (demux, HLS muxing,
              # the .NET server), so reserve a whole core for CFS weight.
              cpu: "1"
              memory: 1Gi
              gpu.intel.com/i915: "1"
            limits:
              # dm is a 16 GiB laptop already ~62 % committed; 3Gi keeps ~4Gi
              # of real headroom while Jellyfin transcodes. QSV does the codec
              # work, so the CPU limit only bounds a software-fallback transcode
              # (tone mapping, subtitle burn-in); 8 of dm's 16 cores for that.
              cpu: "8"
              memory: 3Gi
              gpu.intel.com/i915: "1"
          volumeMounts:
            - { name: config,        mountPath: /config }
            - { name: cache,         mountPath: /cache }
            - { name: transcodes,    mountPath: /transcodes }
            # Library paths identical to the ASUSTOR Docker instance.
            - { name: media-movies,  mountPath: /sharefolder/Movies,   readOnly: true }
            - { name: media-tvshows, mountPath: /sharefolder/TV Shows, readOnly: true }
            - { name: rec-channels,  mountPath: /media/dvr,            readOnly: true }
            - { name: media-sabnzbd, mountPath: /sharefolder/Download/SABnzbd/complete, readOnly: true }
            - { name: tmp,           mountPath: /tmp }
            - { name: run,           mountPath: /var/run }
          livenessProbe:
            httpGet: { path: /health, port: 8096 }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /health, port: 8096 }
            periodSeconds: 10
          startupProbe:
            # 10 min budget: first start on a copied 3.6 GB /config runs DB migrations.
            httpGet: { path: /health, port: 8096 }
            periodSeconds: 10
            failureThreshold: 60
      volumes:
        # 2026-10-01: /config on Mayastor (see storage.yaml); jellyfin-config (lvmpv, dm) kept for rollback.
        - { name: config,        persistentVolumeClaim: { claimName: jellyfin-config-mayastor } }
        # 2026-10-01: /cache (image cache, trickplay, fonts; regenerable, Velero-excluded)
        # was the last dm-local volume (lvmpv). emptyDir lets jellyfin run on any
        # gpu-node; the 10Gi jellyfin-cache claim stays in git for rollback for now.
        - { name: cache,         emptyDir: { sizeLimit: 10Gi } }
        - { name: media-movies,  persistentVolumeClaim: { claimName: jellyfin-media-movies,  readOnly: true } }
        - { name: media-tvshows, persistentVolumeClaim: { claimName: jellyfin-media-tvshows, readOnly: true } }
        - { name: rec-channels,  persistentVolumeClaim: { claimName: jellyfin-rec-channels,  readOnly: true } }
        - { name: media-sabnzbd, persistentVolumeClaim: { claimName: jellyfin-media-sabnzbd, readOnly: true } }
        - name: transcodes
          # Disk-backed emptyDir (root NVMe). NEVER medium: Memory — tmpfs counts
          # against the 3Gi memory limit and squeezes the heap toward OOM.
          emptyDir:
            sizeLimit: 12Gi
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        - { name: run, emptyDir: { sizeLimit: 64Mi } }
        - name: encoding-defaults
          configMap:
            name: jellyfin-encoding-defaults
