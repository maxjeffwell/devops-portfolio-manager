priorityClassName: portfolio-critical
replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  client:
    repository: maxjeffwell/portfolio-gatsby
    tag: 20260306-130036-222aeb9
    pullPolicy: IfNotPresent

service:
  client:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30012

resources:
  client:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  tcpSocket:
    port: 80
  initialDelaySeconds: 2
  periodSeconds: 5

autoscaling:
  enabled: false

# 2026-10-07: NO PDB. The client is pinned to the single edge node (VPS), so
# during a VPS drain neither copy can restart anywhere and a PDB can only make
# the drain hang (the 8/23 zero-budget trap). The site is down during a VPS
# drain regardless (edge Traefik goes too). Re-enable only with a 2nd edge node
# plus required anti-affinity across edge nodes (then minAvailable: 1).
pdb:
  enabled: false
  maxUnavailable: 1

env:
  client: []

serviceAccount:
  create: false

podSecurityContext: {}

securityContext: {}

ingress:
  enabled: true
  host: el-jefe.me
  wwwRedirect: true

topologySpreadConstraints:
  enabled: true
  maxSkew: 1

nodeSelector: {}

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - "true"

# 2026-10-15: one client replica on the edge VPS (assets served from the public IP)
# and one at home on a server, so neither a VPS outage nor a server loss drops the
# site. The required affinity limits the pods to the four `site`-labelled nodes
# (vmi3610371=edge; elitedesk/m720q/m920s=home); the spread over `site` with
# DoNotSchedule forces one replica per site with replicaCount 2.
nodeSelectorClient: {}
affinityClient:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: site
              operator: In
              values: [edge, home]
tolerationsClient:
  - key: role
    operator: Equal
    value: edge
    effect: PreferNoSchedule
topologySpreadConstraintsClient:
  enabled: true
  maxSkew: 1
  topologyKey: site
  whenUnsatisfiable: DoNotSchedule
