# NetworkPolicy default/allow-gateway-k8s. Exported from the live cluster 2026-09-26 (it was
# hand-applied, tracked by nothing); verified with an empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-k8s
  namespace: default
spec:
  egress:
  - ports:
    - port: 6443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 10.0.0.0/24
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 10.43.0.0/16
  - ports:
    - port: 6443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 86.48.29.183/32
  - ports:
    - port: 9092
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: microservices
  - ports:
    - port: 9090
      protocol: TCP
    - port: 80
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  - ports:
    - port: 8080
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
  - ports:
    - port: 8080
      protocol: TCP
    - port: 9090
      protocol: TCP
    to:
    - ipBlock:
        cidr: 10.42.0.0/16
  podSelector:
    matchLabels:
      app: gateway-server
  policyTypes:
  - Egress
