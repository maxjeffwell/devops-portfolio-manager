# NFS Subdir External Provisioner — ASUSTOR backups
# Chart: nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
# LV: /dev/vg-ssd/backups (1T, ext4) — 380G used
# Export: 10.0.0.0/24 + 192.168.50.0/24

replicaCount: 1
strategyType: Recreate

nfs:
  server: 192.168.50.149
  path: /mnt/backups
  mountOptions:
    - nfsvers=4.1
    - noatime
    - hard
    - nconnect=4
  reclaimPolicy: Retain

storageClass:
  create: true
  provisionerName: cluster.local/asustor-backups
  name: asustor-backups
  defaultClass: false
  allowVolumeExpansion: true
  reclaimPolicy: Retain
  archiveOnDelete: true
  onDelete: retain
  pathPattern: "${.PVC.namespace}-${.PVC.name}"
  accessModes: ReadWriteOnce
  volumeBindingMode: Immediate

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

# Pinned to vmi2951245 (control-plane) for reliable API access. vmi3115606
# has chronic Tailscale-to-control-plane micro-blips causing ~hourly pod
# restarts; this Deployment does leader-election (frequent API writes) so it
# was an unlucky-victim of that issue. Moved 2026-05-25.
nodeSelector:
  kubernetes.io/hostname: vmi2951245

# 2026-08-11: keep the provisioner's root mount out of Velero. This pod mounts
# the ROOT of the export (192.168.50.149:/mnt/backups) — Velero measured it at
# 408.56 GB and was copying the whole ASUSTOR *backups* share into garage, from
# a pod in New York, at ~0.4 MB/s. Recursive (backing up a backup target) and
# duplicative (the parent dir of every PVC this provisioner hands out, all of
# which are already backed up individually). The PV declares 10Mi because NFS
# PVs ignore spec.capacity, which is why this hid for so long.
podAnnotations:
  backup.velero.io/backup-volumes-excludes: nfs-subdir-external-provisioner-root

rbac:
  create: true

serviceAccount:
  create: true

leaderElection:
  enabled: true

labels: {}
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: PreferNoSchedule
