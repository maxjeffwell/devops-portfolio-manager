# Default resource *requests* for namespaces whose workloads ship without any.
# defaultRequest only — no 'default' (limits) so nothing is OOM-killed by a guessed cap.
# Applies at pod admission; existing pods pick it up on their next restart.
# Explicit requests in a chart/manifest always override these.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: argocd
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 10m
        memory: 64Mi
---
