# WD My Passport 1TB (ex-HDHomeRun FLEX drive) plugged into debian-marmoset,
# ext4 label CHANNELS_DVR, fstab-mounted (nofail) at /mnt/channels-recordings.
# Static local PV so the recordings volume lives off the root NVMe. The drive
# is old (72k+ power-on hours) — acceptable for warm-standby recordings, do
# not move the primary or anything precious onto it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: channels-dvr-recordings-usb
  labels:
    app: channels-dvr
spec:
  capacity:
    storage: 900Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: channels-usb
  local:
    path: /mnt/channels-recordings
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - debian-marmoset
