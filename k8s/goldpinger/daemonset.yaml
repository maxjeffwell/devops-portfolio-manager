apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: goldpinger
  namespace: goldpinger
  labels:
    app: goldpinger
    app.kubernetes.io/name: goldpinger
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: goldpinger
  template:
    metadata:
      labels:
        app: goldpinger
        app.kubernetes.io/name: goldpinger
    spec:
      serviceAccountName: goldpinger
      hostNetwork: false
      dnsPolicy: ClusterFirst
      priorityClassName: system-cluster-critical
      tolerations:
        # marmoset (taint workload=laptop:NoSchedule; was workload=gpu until
        # 2026-10-06) is deliberately EXCLUDED from the mesh: it is the
        # daily-driver laptop with no storage or data-path role, so its
        # suspend/flap cycles would only fire GoldpingerPeerUnreachable noise.
        # Re-add a workload=laptop toleration only if something there ever
        # needs connectivity monitoring.
        # Forward-compat: if vmi2951245's PreferNoSchedule is ever upgraded
        # to NoSchedule, the DaemonSet still lands. Harmless no-op today.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        # Keep the pod alive briefly when its own node goes unhealthy
        # so it can observe the degradation before being evicted.
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: goldpinger
          image: docker.io/bloomberg/goldpinger:3.11.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Every goldpinger flag has an env twin ($PING_TIMEOUT etc., see
          # `goldpinger --help`). Only HOST/PORT/HOSTNAME/POD_IP are needed for
          # discovery; the timeouts below are tuned, everything else is default.
          #
          # 2026-10-21: PING_TIMEOUT 300ms (default) -> 2s. Peers are probed over
          # the tailnet, and the edge VPS sits ~80 ms RTT from home with WAN
          # jitter: over 3 h, 20% of probes from the VPS and ~3.5% from each home
          # node (mostly the ones aimed AT the VPS) took >250 ms, p99 0.91 s from
          # the VPS. Every slow probe flipped a peer to "unhealthy" for one 30 s
          # cycle, so GoldpingerPeerUnreachable flapped all day with no real
          # connectivity loss. A 2 s ping timeout still catches a dead peer
          # (the alert waits 2 m anyway) without reacting to jitter.
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: PING_TIMEOUT
              value: "2s"
            - name: CHECK_TIMEOUT
              value: "3s"
            - name: CHECK_ALL_TIMEOUT
              value: "8s"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              # 2026-10-21: 40Mi -> 64Mi (7-day p95 58Mi)
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
