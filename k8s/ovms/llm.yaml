# 2026-10-02 GPU split (user decision): neonmarmoset Xe = jellyfin + embeddings;
# debian-marmoset Xe = immich-ml + the LLM.
# 2026-11-26: the qwen2.5-1.5b-instruct LLM is served by KServe (InferenceService
# qwen-llm in kserve-llm.yaml, model downloaded from Garage). This file keeps the
# stable ovms-llm Service name that callers use
# (shared-ai-gateway's auto tier, litellm's local-llama / ollama-llama3.2-3b):
# http://ovms-llm.ovms:8000/v3, model "qwen2.5-1.5b-instruct".
# Weights: OpenVINO/Qwen2.5-1.5B-Instruct-int4-ov (Apache-2.0) in s3://ovms-models.
apiVersion: v1
kind: Service
metadata:
  name: ovms-llm
  namespace: ovms
  labels:
    app: ovms-llm
spec:
  type: ClusterIP
  # Alias onto the KServe-managed pods (both copies) so callers keep http://ovms-llm.ovms:8000.
  selector:
    model-group: llm
  ports:
    - { name: rest, port: 8000, targetPort: 8000, protocol: TCP }
    - { name: grpc, port: 9000, targetPort: 9000, protocol: TCP }
