# Velero weekly off-site backup → Backblaze B2 (direct).
#
# Reconciled from live drift (2026-05-30): this Schedule existed only in the
# cluster, not in git. Unlike the other three schedules (in the monitoring Helm
# chart, using an excludedNamespaces denylist), weekly-offsite uses an
# includedNamespaces ALLOWLIST and ships kopia FSB data straight to B2 — the
# rclone garage-offsite-sync job deliberately skips kopia/restic for that reason.
# Managed here by the `backups` ArgoCD app (adopts the existing resource via
# server-side apply; not added to the Helm chart, which would choke on a
# pre-existing resource it didn't create).
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly-offsite
  namespace: velero
spec:
  schedule: "0 4 * * 0"
  skipImmediately: false
  useOwnerReferencesInBackup: false
  template:
    storageLocation: backblaze
    defaultVolumesToFsBackup: true
    # Move CSI snapshots to the BSL via the node-agent data mover (2026-09-06).
    # PSMDB pods carry backup.velero.io/backup-volumes-excludes=mongod-data, so
    # fs-backup skips them and Velero falls back to a CSI snapshot. Without the
    # data mover that snapshot is a thin LV on the SAME node as the database
    # (35 of them were sitting on debian-marmoset), i.e. not off-site at all.
    # With it, the snapshot is uploaded to B2 and the local copy deleted.
    snapshotMoveData: true
    ttl: 720h
    # Skip raw NFS mounts + csi-s3 volumes. Without this, opt-out fs-backup walks
    # any large NAS media share mounted into a pod (hundreds of GB on ASUSTOR .149),
    # which cannot finish in the 4h window and orphan InProgress PVBs that hold
    # node-agent data-path slots forever (2026-08-16; 3rd recurrence of the
    # zombie-PVB concurrency deadlock).
    resourcePolicy:
      kind: configmap
      name: nas-local-volume-policy
    includedNamespaces:
      - default
      - lunary
      - percona-mongodb
      - monitoring
      - kube-system
      - argocd
      - microservices
      - vertex-platform
      - vaultwarden
      # tenantflow-neon + tenantflow-neon-tenant-map ConfigMap (maps app tenants
      # to the Neon tenant IDs stored in neon-storage, synced by
      # garage-offsite-sync). Neon PVCs hold ~150 MB total (2026-09-27).
      - neon
      # qdrant: 5 Gi iSCSI PVC, ~174 MB of vectors. Its only off-site copy since
      # k8up was removed 2026-10-06 (k8up kept 6 monthly points in garage, on-site).
      - qdrant
