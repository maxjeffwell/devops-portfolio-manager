# Patroni HA Postgres cluster CA (Doppler PG_HA_TLS_CA_CRT, "pg-ha CA", expires 2036-10-06) for namespace vertex-platform.
# Mounted at /etc/pg-ha/ca.crt by the apps that reach the VIP 192.168.50.60:5000 so they can use sslmode=verify-full.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-ha-ca
  namespace: vertex-platform
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: pg-ha-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: PG_HA_TLS_CA_CRT
