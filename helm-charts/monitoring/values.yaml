# Velero Backup Schedules
veleroSchedules:
  enabled: true
  namespace: velero
  # Velero default is 10m; storage layer (Mayastor/synology/democratic-csi) needs longer.
  csiSnapshotTimeout: "20m"
  # Volume-level opt-out policy (ConfigMap in the velero namespace, owned by the
  # `backups` ArgoCD app). Skips raw NFS mounts + csi-s3 volumes. Required: with
  # opt-out fs-backup on, Velero otherwise walks the stremio-nas-addon media
  # shares (movies 302GB + tv 392GB on ASUSTOR .149). Those cannot finish in the
  # 4h window and orphan InProgress PVBs that permanently hold node-agent
  # data-path slots (loadConcurrency=3), starving every later backup on that node.
  resourcePolicyConfigMap: nas-local-volume-policy
  excludedNamespaces:
    - gpu-operator
    # 2026-06-11 — jellyfin decommissioned to ASUSTOR (scaled to 0); its config PVC
    # has no running pod for fs-backup, so it PartiallyFails every run. Exclude it.
    - jellyfin
  daily:
    schedule: "0 2 * * *"
    ttl: 168h0m0s
  weekly:
    schedule: "0 3 * * 0"
    ttl: 720h0m0s
  weeklyLocal:
    schedule: "0 3 * * 0"
    ttl: 720h0m0s
    storageLocation: local

# Velero Backup Alerts
veleroAlerts:
  enabled: true
  namespace: velero

# Velero Backup Verification (weekly restore test)
veleroBackupVerify:
  enabled: true
  # Run weekly on Sundays at 4 AM UTC
  schedule: "0 4 * * 0"

# Gotify Bridge (AlertManager → Gotify notification relay)
gotifyBridge:
  enabled: true
  image:
    repository: ghcr.io/druggeri/alertmanager_gotify_bridge
    tag: "2.3.2"
  gotifyEndpoint: "http://gotify.monitoring.svc.cluster.local"
  tokenSecret:
    name: gotify-alertmanager-token
    key: gotify-token
  defaultPriority: "5"
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  serviceMonitor:
    enabled: true

# Tempo Monolithic - Distributed tracing (single binary, OTLP receiver + S3 storage)
# Design: docs/plans/2026-03-10-grafana-tempo-design.md
tempoMonolithic:
  enabled: true
  image:
    repository: grafana/tempo
    tag: "2.7.2"
  priorityClassName: monitoring
  nodeSelector:
    kubernetes.io/hostname: elitedesk
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  persistence:
    storageClass: local-path
    size: 20Gi
  storage:
    credentialsSecret: garage-tempo-credentials
    s3:
      endpoint: garage-home.monitoring.svc.cluster.local:3900
      bucket: tempo-traces
      insecure: true
      region: us-east-1   # home Garage nodes use us-east-1 (in-cluster gateways use "garage")
  config:
    retention: 720h
    ingester:
      flushCheckPeriod: 30s
      maxBlockDuration: 30m
    compactor:
      compactionWindow: 4h
    metricsGenerator:
      remoteWriteUrl: http://mimir-monolithic.monitoring.svc.cluster.local:8080/api/v1/push
  redis:
    address: tempo-redis.monitoring.svc.cluster.local:6379
    timeout: 2s
    cacheMinCompactionLevel: 1
    cacheMaxBlockAge: 48h
  serviceMonitor:
    enabled: true

# Tempo cache - Dragonfly (Redis-compatible, multi-threaded, lower memory)
tempoRedis:
  enabled: true
  image:
    repository: docker.dragonflydb.io/dragonflydb/dragonfly
    tag: "latest"
  nodeSelector:
    kubernetes.io/hostname: elitedesk
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  maxmemory: 800mb
  proactorThreads: 2

# Pyroscope - Continuous profiling (monolithic mode, Garage S3 backend)
pyroscope:
  enabled: true
  image:
    repository: grafana/pyroscope
    tag: "1.18.1"
  priorityClassName: monitoring
  nodeSelector:
    kubernetes.io/hostname: elitedesk
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  persistence:
    storageClass: local-path
    size: 20Gi
  storage:
    credentialsSecret: garage-pyroscope-credentials
    s3:
      endpoint: garage-home.monitoring.svc.cluster.local:3900
      bucket: pyroscope-profiles
      insecure: true
      region: us-east-1   # home Garage nodes use us-east-1 (in-cluster gateways use "garage")
  serviceMonitor:
    enabled: true

# Custom Ingress Configuration (separate from kube-prometheus-stack ingress)
ingress:
  enabled: true
  grafanaHost: grafana.el-jefe.me
  grafanaService: prometheus-grafana
  grafanaPort: 80
  prometheusHost: prometheus.el-jefe.me
  prometheusService: prometheus-kube-prometheus-prometheus
  prometheusPort: 9090

# Kube-Prometheus-Stack Configuration
kube-prometheus-stack:
  # Prometheus Configuration
  prometheus:
    prometheusSpec:
      # 2026-08-10: keep the TSDB out of Velero. Velero reads 48.14 GB of LOGICAL
      # bytes off this volume (df shows 22.5G of 50G — openebs-zfs compresses ~2.1x;
      # the disk is fine, the read volume is not). It lives on vmi2951245 (New York,
      # see nodeSelector below), so fs-backup dragged those reads across the WAN at
      # ~2.75 MB/s => ~4.4h for this ONE volume, blowing the 4h
      # itemBlock window and dropping every item queued behind it. Velero honours this
      # annotation for EVERY backup (daily/weekly/local/nas-local/manual) — a velero
      # Schedule cannot exclude a single volume, only whole namespaces or resources.
      # Value must be the POD volume name, not the PVC name.
      podMetadata:
        annotations:
          backup.velero.io/backup-volumes-excludes: prometheus-prometheus-kube-prometheus-prometheus-db
      # Number of replicas
      replicas: 1
      # Retention period for metrics
      retention: 15d
      # Global scrape timeout: Prometheus runs at home now; the apiserver
      # /metrics (~19 MB) and the VPS kubelets arrive over the tailnet.
      scrapeTimeout: 30s
      # Node selector - elitedesk (moved off the control-plane VPS 2026-08-23)
      nodeSelector:
        kubernetes.io/hostname: elitedesk
      # Storage configuration
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      # Resource limits
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 4Gi
      # Config-reloader sidecar and init container resources (required by monitoring-quota)
      containers:
        - name: config-reloader
          resources:
            requests:
              cpu: 10m
              memory: 25Mi
            limits:
              memory: 50Mi
      initContainers:
        - name: init-config-reloader
          resources:
            requests:
              cpu: 10m
              memory: 25Mi
            limits:
              memory: 50Mi
      # No remote_write: Mimir is fed by Alloy. Prometheus keeps its own 15d
      # TSDB. (A previous remote_write to a dead prometheus-mimir-gateway
      # Service retried 422M samples forever — removed 2026-08-23.)
      remoteWrite: []
      # Service monitors for scraping application metrics
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false

    # Disable kube-prometheus-stack's built-in ingress (we use a custom Traefik ingress in templates/ingress.yaml)
    ingress:
      enabled: false

  # Grafana Configuration
  # ⚠️  SECURITY: Override adminPassword at deploy time!
  # helm install monitoring . --set kube-prometheus-stack.grafana.adminPassword="$(openssl rand -base64 24)"
  grafana:
    enabled: true
    adminPassword: "REPLACE_AT_DEPLOY_TIME"

    persistence:
      enabled: true
      existingClaim: grafana-data

    # init-chown-data is added by the chart when persistence is enabled.
    # monitoring-quota requires resource specs on all containers.
    initChownData:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Disable kube-prometheus-stack's built-in ingress (we use a custom Traefik ingress in templates/ingress.yaml)
    ingress:
      enabled: false

    # Configure Grafana for subdomain routing (grafana.el-jefe.me)
    grafana.ini:
      server:
        domain: grafana.el-jefe.me
        root_url: "https://grafana.el-jefe.me/"
        serve_from_sub_path: false
      plugins:
        allow_loading_unsigned_plugins: k8s-app


    # Plugins
    plugins:
      - grafana-polystat-panel
      - yesoreyeram-infinity-datasource 3.7.1
      - marcusolsson-treemap-panel

    # Init container to install URL-based plugins not in the Grafana catalog
    extraInitContainers:
      - name: install-k8s-plugin
        image: busybox:1.36
        command:
          - /bin/sh
          - -c
          - |
            if [ -d /var/lib/grafana/plugins/tiithansen-grafana-k8s-app/dist ]; then
              echo "k8s-app plugin already installed, skipping"
              exit 0
            fi
            wget -O /tmp/k8s-app.zip https://github.com/tiithansen/grafana-k8s-app/releases/download/v0.11.2/grafana-k8s-app-v0.11.2.zip &&
            mkdir -p /var/lib/grafana/plugins/tiithansen-grafana-k8s-app &&
            unzip -o /tmp/k8s-app.zip -d /var/lib/grafana/plugins/tiithansen-grafana-k8s-app &&
            rm /tmp/k8s-app.zip
        volumeMounts:
          - name: storage
            mountPath: /var/lib/grafana
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    # Additional data sources for Loki and Mimir
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://10.0.0.4:3100
        editable: true
      - name: Mimir
        type: prometheus
        uid: mimir
        access: proxy
        url: http://mimir-monolithic.monitoring.svc.cluster.local:8080/prometheus
        editable: true
        isDefault: true
        jsonData:
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: trace_id
            - datasourceUid: pyroscope
              name: profile_id
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo-monolithic.monitoring.svc.cluster.local:3200
        editable: true
        isDefault: false
        jsonData:
          streamingEnabled:
            search: false
          tracesToLogs:
            datasourceUid: loki
            filterByTraceID: true
            filterBySpanID: true
          tracesToMetrics:
            datasourceUid: mimir
          nodeGraph:
            enabled: true
          serviceMap:
            datasourceUid: mimir
          tracesToProfiles:
            datasourceUid: pyroscope
            tags:
              - service.name
              - job
      - name: Pyroscope
        type: grafana-pyroscope-datasource
        uid: pyroscope
        access: proxy
        url: http://pyroscope.monitoring.svc.cluster.local:4040
        editable: true
        isDefault: false

    # Liveness probe tuning — Grafana startup may take several minutes on first
    # init (SQLite migrations). Subsequent starts with persistent storage are faster.
    livenessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 300
      timeoutSeconds: 30
      failureThreshold: 15
      periodSeconds: 10

    readinessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      periodSeconds: 10

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Grafana sidecar resources (required by monitoring-quota)
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      datasources:
        enabled: true
        defaultDatasourceEnabled: false

    # Priority class
    priorityClassName: monitoring

    # Default dashboards
    defaultDashboardsEnabled: true
    defaultDashboardsTimezone: UTC

  # AlertManager Configuration
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - equal: ['namespace', 'alertname']
          source_matchers:
            - severity = critical
          target_matchers:
            - severity =~ warning|info
        - equal: ['namespace', 'alertname']
          source_matchers:
            - severity = warning
          target_matchers:
            - severity = info
        - equal: ['namespace']
          source_matchers:
            - alertname = InfoInhibitor
          target_matchers:
            - severity = info
        - target_matchers:
            - alertname = InfoInhibitor
      receivers:
        - name: 'null'
        - name: 'gotify'
          webhook_configs:
            - url: 'http://alertmanager-gotify-bridge.monitoring.svc.cluster.local:8080/gotify_webhook'
              send_resolved: true
      route:
        group_by: ['namespace']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'null'
        routes:
          # Silence Watchdog (always-firing health check)
          - matchers:
              - alertname = "Watchdog"
            receiver: 'null'
          # Silence GPU operator DaemonSet false-positives only
          - matchers:
              - namespace = "gpu-operator"
              - alertname =~ "KubeDaemonSetMisScheduled|KubeDaemonSetRolloutStuck"
            receiver: 'null'
          # Silence k3s control plane alerts (bundled into k3s binary)
          - matchers:
              - alertname =~ "KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown"
            receiver: 'null'
          # Route critical alerts to Gotify
          - matchers:
              - severity = "critical"
            receiver: 'gotify'
          # Route warning alerts to Gotify
          - matchers:
              - severity = "warning"
            receiver: 'gotify'
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      # Config-reloader sidecar and init container resources (required by monitoring-quota)
      containers:
        - name: config-reloader
          resources:
            requests:
              cpu: 10m
              memory: 25Mi
            limits:
              memory: 50Mi
      initContainers:
        - name: init-config-reloader
          resources:
            requests:
              cpu: 10m
              memory: 25Mi
            limits:
              memory: 50Mi

    # Disable kube-prometheus-stack's built-in ingress (we use a custom Traefik ingress in templates/ingress.yaml)
    ingress:
      enabled: false

  # Node Exporter - collect node-level metrics
  nodeExporter:
    enabled: true
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

  # Kube State Metrics - collect Kubernetes object metrics
  kubeStateMetrics:
    enabled: true

  # kube-state-metrics sub-chart overrides
  # The /livez endpoint returns 503 when informer cache falls behind under API server load
  # Prometheus now runs at home; the VPS kubelets answer /metrics/cadvisor
  # slowly over the tailnet (busy control plane), so give scrapes room.
  kubelet:
    serviceMonitor:
      interval: 60s
      scrapeTimeout: 30s
  kubeApiServer:
    serviceMonitor:
      interval: 60s
      scrapeTimeout: 45s   # /metrics is ~19 MB / 127k series from a busy apiserver

  kube-state-metrics:
    nodeSelector:
      kubernetes.io/hostname: elitedesk
    livenessProbe:
      failureThreshold: 10
      periodSeconds: 15
    readinessProbe:
      failureThreshold: 10
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Prometheus Operator
  prometheusOperator:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    admissionWebhooks:
      patch:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

# MinIO - DISABLED (replaced by Garage March 2026)
minio:
  enabled: false
  mode: standalone
  replicas: 1
  existingSecret: minio-credentials
  persistence:
    enabled: true
    # Migrated local-path → openebs-zfs 2026-06-11 (checksums + snapshots for the
    # log object store). PVC pre-seeded + statically bound to the ZFS PV; this value
    # keeps a future `helm upgrade` from reverting the class. Pinned to vmi2951245
    # where the 99.5G openebs-zfs pool lives.
    storageClass: local-path
    size: 20Gi
  nodeSelector:
    kubernetes.io/hostname: elitedesk
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # Resources for MinIO post-install/post-upgrade hook jobs (bucket creation)
  # Required by monitoring-quota ResourceQuota
  makeBucketJob:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  makeUserJob:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  # Auto-create buckets for Loki and Mimir
  buckets:
    - name: loki-chunks
      policy: none
      purge: false
    - name: loki-ruler
      policy: none
      purge: false
    - name: mimir-blocks
      policy: none
      purge: false
    - name: mimir-ruler
      policy: none
      purge: false
    - name: mimir-alertmanager
      policy: none
      purge: false
  metrics:
    serviceMonitor:
      enabled: true

# Garage - Lightweight S3-compatible object storage (replaces MinIO)
# Home-side Garage S3 endpoint for the observability stores (see
# templates/garage-home-service.yaml). elitedesk's native garage node
# (zone `elitedesk`, tailnet 100.64.0.8) — same node the stores run on.
garageHome:
  enabled: true
  ip: 100.64.0.8

garage:
  enabled: true
  replicas: 2
  antiAffinity: true
  # These two pods are the GATEWAY members (zero blocks) of the federated
  # Garage cluster. hostNetwork + rpc on :3901, so they can only live on nodes
  # without a native garage (elitedesk/debian-marmoset run one on the host).
  nodeHostnames:
    - vmi2951245
    - vmi3115606
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: PreferNoSchedule
  image:
    repository: dxflrs/garage
    tag: "v2.2.0"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 2Gi
  persistence:
    # 2026-08-23: local-path so replicas can run off the control-plane VPS
    # (its PreferNoSchedule taint + antiAffinity spread them elsewhere).
    storageClass: local-path
    size: 10Gi
  ingress:
    enabled: true
    host: s3.el-jefe.me
    # Adds *.s3.el-jefe.me Ingress rule + wildcard SAN to garage-s3-tls so S3
    # SDKs that default to virtual-hosted-style addressing (OVMS, boto3, etc)
    # work without per-client path-style flags. Requires Cloudflare CNAME
    # *.s3.el-jefe.me -> s3.el-jefe.me (grey cloud).
    virtualHostedStyle: true
  buckets:
    - mimir-blocks
    - mimir-ruler
    - mimir-alertmanager
    - tempo-traces
    - pyroscope-profiles
    - velero

# Loki - DISABLED (replaced by ASUSTOR Loki with Garage S3 backend)
loki:
  enabled: false
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: s3
      s3:
        endpoint: http://prometheus-minio.monitoring.svc.cluster.local:9000
        bucketnames: loki-chunks
        region: us-east-1
        access_key_id: ${rootUser}
        secret_access_key: ${rootPassword}
        insecure: true
        s3forcepathstyle: true
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
    limits_config:
      retention_period: 360h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
      working_directory: /var/loki/compactor
    rulerConfig:
      storage:
        type: s3
        s3:
          endpoint: http://prometheus-minio.monitoring.svc.cluster.local:9000
          bucketnames: loki-ruler
          region: us-east-1
          # Must match the keys in the minio-credentials secret (envFrom +
          # -config.expand-env=true). The secret exposes rootUser/rootPassword —
          # NOT MINIO_ROOT_USER/PASSWORD. Wrong names expanded to empty strings,
          # so the AWS SDK fell back to EC2 IMDS (169.254.169.254) and timed out
          # ("no EC2 IMDS role found"). The chunk store above already uses these.
          access_key_id: ${rootUser}
          secret_access_key: ${rootPassword}
          insecure: true
          s3forcepathstyle: true
  singleBinary:
    replicas: 1
    nodeSelector:
      kubernetes.io/hostname: elitedesk
    persistence:
      storageClass: local-path
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    extraEnvFrom:
      - secretRef:
          name: minio-credentials
    extraArgs:
      - -config.expand-env=true
  # Right-sized cache resources (chart defaults are 500m/9.8Gi and 500m/1.2Gi)
  chunksCache:
    allocatedMemory: 256
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        cpu: 200m
        memory: 512Mi
  resultsCache:
    allocatedMemory: 128
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # Disable components not needed in single-binary mode
  gateway:
    enabled: false
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  # Loki sidecar (rules watcher) resources
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  # Loki canary resources (required by monitoring-quota)
  lokiCanary:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
  # Memcached exporter sidecar resources
  memcachedExporter:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false

# Alloy - Log collector (DaemonSet on all nodes)
alloy:
  enabled: true
  alloy:
    clustering:
      enabled: true
    securityContext:
      privileged: true
    configMap:
      create: false
      name: alloy-config
      key: config.alloy
    mounts:
      varlog: true
      dockercontainers: true
      extra:
        - name: journal
          mountPath: /var/log/journal
          readOnly: true
        - name: debugfs
          mountPath: /sys/kernel/debug
          readOnly: true
        # Persist loki.source.file read positions (and WAL) across pod
        # restarts; otherwise every restart re-ingests all of /var/log/pods.
        - name: alloy-storage
          mountPath: /tmp/alloy
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
      - name: pyroscope-http
        port: 9999
        targetPort: 9999
        protocol: TCP
      - name: faro
        port: 12347
        targetPort: 12347
        protocol: TCP
    extraEnv:
      - name: GOMEMLIMIT
        value: "1800MiB"
      - name: HOST_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 2Gi
  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 50Mi
  controller:
    type: daemonset
    hostPID: true
    priorityClassName: monitoring
    tolerations:
      - key: workload
        value: gpu
        effect: NoSchedule
    volumes:
      extra:
        - name: journal
          hostPath:
            path: /var/log/journal
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: alloy-storage
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
      - name: pyroscope-http
        port: 9999
        targetPort: 9999
        protocol: TCP

# Perimeter Audit - nmap scan of home network from VPS
# Disabled 2026-08-23: maxjeffwell.ddns.net no longer resolves (no DDNS for
# the home WAN) — jobs "succeeded" while scanning nothing. CronJobs deleted
# from the cluster the same day.
perimeterAudit:
  enabled: false
  schedule: "0 */6 * * *"
  ddnsHostname: "maxjeffwell.ddns.net"

# Network Quality - speedtest + traceroute to home network
# Disabled 2026-08-23: same dead-DDNS reason as perimeterAudit.
networkQuality:
  enabled: false
  schedule: "*/30 * * * *"
  ddnsHostname: "maxjeffwell.ddns.net"

# CrowdSec Log Processor - parses Traefik access logs and sends alerts to LAPI
crowdsec:
  logProcessor:
    enabled: true
    localApiUrl: "http://crowdsec-lapi.monitoring.svc.cluster.local:8080"
    image:
      repository: crowdsecurity/crowdsec
      tag: "v1.7.6"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    serviceMonitor:
      enabled: true
  # In-cluster LAPI (replaces ASUSTOR 10.0.0.4:8080). See
  # docs/superpowers/specs/2026-06-03-crowdsec-lapi-in-cluster-migration-design.md
  lapi:
    enabled: true
    image:
      repository: crowdsecurity/crowdsec
      tag: "v1.7.6"
    collections: "crowdsecurity/traefik crowdsecurity/linux"
    # Expose the LAPI for the OFF-CLUSTER ASUSTOR agent (agent-only; it pushes
    # router-syslog decisions IN). TLS via cert-manager; deliberately NO crowdsec
    # bouncer middleware (a LAPI must not gate itself) — access control is the
    # LAPI's machine-JWT auth. Keep DNS-only (grey cloud) at Cloudflare so the
    # /v1/decisions long-poll stream isn't buffered.
    ingress:
      enabled: true
      host: crowdsec-lapi.el-jefe.me
      clusterIssuer: letsencrypt-prod
      tlsSecretName: crowdsec-lapi-tls
    storage:
      storageClassName: mayastor-single-replica
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

# Mimir Distributed - DISABLED (replaced by monolithic deployment below)
mimir-distributed:
  enabled: false

# Mimir Monolithic - Long-term metric storage (single binary, all components in one pod)
# S3 backend: Garage (replaced MinIO March 2026)
mimirMonolithic:
  enabled: true
  image:
    repository: grafana/mimir
    tag: "3.0.1"
  priorityClassName: monitoring
  nodeSelector:
    kubernetes.io/hostname: elitedesk
  # Combined resources for all Mimir components in a single process
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 4Gi
  persistence:
    storageClass: local-path
    size: 20Gi
  storage:
    credentialsSecret: garage-mimir-credentials
    s3:
      endpoint: garage-home.monitoring.svc.cluster.local:3900
      insecure: true
    buckets:
      blocks: mimir-blocks
      ruler: mimir-ruler
      alertmanager: mimir-alertmanager
  config:
    compactor:
      compactionInterval: 30m
    limits:
      maxGlobalSeriesPerUser: 500000
      ingestionRate: 100000
      ingestionBurstSize: 2000000
      compactorBlocksRetentionPeriod: 2160h
      maxGlobalExemplarsPerUser: 100000
      outOfOrderTimeWindow: 5m
      # Bumped from default 30 → 50: cAdvisor metrics from ASUSTOR docker-compose
      # containers carry container_label_com_docker_compose_* labels that push
      # series past the 30-label default. Was rejecting 31-label series.
      maxLabelNamesPerSeries: 50
  serviceMonitor:
    enabled: true

# SNMP Exporter - Scrapes SNMP targets (Synology NAS) via WireGuard mesh
# Sidesteps Garage v2.2.0 /metrics deadlock on Synology; provides richer filesystem visibility
snmpExporter:
  enabled: true
  image:
    repository: prom/snmp-exporter
    tag: v0.28.0
  priorityClassName: monitoring
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
  # Community string used in all scrape targets; must match Synology /etc/snmp/snmpd.conf
  auth:
    name: k8smesh_v2
    community: k8smesh

# SNMP Synology - Scrape target + alerts for the Synology DS423 (boom_boom)
snmpSynology:
  enabled: true
  target: "10.0.0.5"
  host: boom_boom
  module: hrstorage
  scrapeInterval: 60s
  scrapeTimeout: 30s
  alerts:
    enabled: true
    mountpoint: /volume1
    warningThreshold: 0.15
    warningFor: 15m
    criticalThreshold: 0.05
    criticalFor: 5m
    scrapeDownFor: 5m
