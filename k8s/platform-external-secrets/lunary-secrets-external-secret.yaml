# ExternalSecret lunary/lunary-secrets. Exported from the LIVE spec 2026-09-26 (was hand-applied;
# the old copies in k8s/external-secrets were stale). Verified with an empty kubectl diff.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lunary-secrets
  namespace: lunary
  annotations:
    force-sync: '1775694652'
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: LUNARY_JWT_SECRET
      metadataPolicy: None
    secretKey: jwt-secret
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: LUNARY_DATABASE_URL
      metadataPolicy: None
    secretKey: database-url
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: lunary-secrets
