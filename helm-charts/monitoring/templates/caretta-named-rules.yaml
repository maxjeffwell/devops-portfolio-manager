{{- if and .Values.alloy.enabled .Values.caretta.naming.enabled }}
# Caretta service map with host names (2026-10-16). See the `caretta.naming`
# comment in values.yaml. Evaluated by the MIMIR ruler, not kube-prometheus:
# Alloy's mimir.rules.kubernetes (alloy-config.yaml) pushes every PrometheusRule
# labelled alloy_mimir_rules="true" to Mimir, which is the only store holding the
# Alloy-scraped caretta series. Deliberately NOT labelled release=prometheus.
# The Grafana dashboard (dashboards/caretta.json) reads the recorded metric.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: caretta-named
  namespace: {{ .Release.Namespace }}
  labels:
    alloy_mimir_rules: "true"
spec:
  groups:
    - name: caretta-named
      interval: 30s
      rules:
        - record: caretta:links_observed:named
          # The rename chains run ONLY on rows Caretta itself filed as
          # namespace external|node (bare addresses, rDNS names, k3s node
          # names). Pod/service rows are passed through untouched, so a
          # workload that shares a host's name can never be regrouped. The four
          # selector partitions are disjoint, so `or` is a plain union.
          expr: >-
            {{- $naming := .Values.caretta.naming }}
            {{- $hostNs := "external|node" }}
            {{- $raw := "caretta_links_observed" }}
            {{- $both := printf "%s{client_namespace=~\"%s\",server_namespace=~\"%s\"}" $raw $hostNs $hostNs }}
            {{- $cOnly := printf "%s{client_namespace=~\"%s\",server_namespace!~\"%s\"}" $raw $hostNs $hostNs }}
            {{- $sOnly := printf "%s{client_namespace!~\"%s\",server_namespace=~\"%s\"}" $raw $hostNs $hostNs }}
            {{- $none := printf "%s{client_namespace!~\"%s\",server_namespace!~\"%s\"}" $raw $hostNs $hostNs }}
            {{- $p1 := include "monitoring.carettaSide" (dict "side" "server" "expr" (include "monitoring.carettaSide" (dict "side" "client" "expr" $both "naming" $naming)) "naming" $naming) }}
            {{- $p2 := include "monitoring.carettaSide" (dict "side" "client" "expr" $cOnly "naming" $naming) }}
            {{- $p3 := include "monitoring.carettaSide" (dict "side" "server" "expr" $sOnly "naming" $naming) }}
            {{- $u := printf "((%s) or (%s) or (%s) or %s)" $p1 $p2 $p3 $none }}
            {{ include "monitoring.carettaPorts" (dict "expr" $u "naming" $naming) }}
{{- end }}
