apiVersion: v1
kind: Service
metadata:
  name: ovms-embeddings
  namespace: ovms
  labels:
    app: ovms-embeddings
spec:
  type: ClusterIP
  # Alias onto the KServe-managed pod (InferenceService embeddings) so callers
  # keep http://ovms-embeddings.ovms:8000.
  selector:
    serving.kserve.io/inferenceservice: embeddings
  ports:
    - { name: rest, port: 8000, targetPort: 8000, protocol: TCP }
    - { name: grpc, port: 9000, targetPort: 9000, protocol: TCP }
