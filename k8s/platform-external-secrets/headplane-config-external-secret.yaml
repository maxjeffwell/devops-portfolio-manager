# headplane (Headscale web UI, ns headscale) reads a single config file,
# /etc/headplane/config.yaml, mounted from Secret headplane-config. Only
# server.cookie_secret is sensitive, so the file is TEMPLATED here from one
# Doppler key (HEADPLANE_COOKIE_SECRET, added 2026-10-06) and everything else is
# plain config in git. Brought under GitOps 2026-10-06 (user decision); before
# that the Secret was hand-created and never stored anywhere.
#
# headscale.url points at the selectorless `headscale` Service in this
# namespace, which fronts the NATIVE headscale on dm (see k8s/headscale/).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headplane-config-external-secret
  namespace: headscale
spec:
  refreshInterval: 24h7m13s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    name: headplane-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        config.yaml: |
          server:
            host: 0.0.0.0
            port: 3000
            base_url: https://headscale.el-jefe.me
            cookie_secret: "{{ .cookie_secret }}"
            cookie_secure: true
            data_path: /var/lib/headplane
          headscale:
            url: http://headscale.headscale.svc.cluster.local:8080
            public_url: https://headscale.el-jefe.me
            config_strict: false
  data:
    - secretKey: cookie_secret
      remoteRef:
        key: HEADPLANE_COOKIE_SECRET
