# 2026-10-07: Intel GPU DRA (app intel-gpu-dra) replaces the device plugin's
# gpu.intel.com/i915 on the Iris Xe nodes. adminAccess lets OVMS share each
# iGPU with jellyfin/tdarr/immich-ml (Intel's driver has no consumable capacity).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: igpu
  annotations:
    # ArgoCD's kind ordering does not know ResourceClaimTemplate and applies it
    # AFTER workloads -> pods fail FailedResourceClaimCreation until it exists.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # metadata/allocationMode/count are the API server defaults, spelled out so
  # ArgoCD's diff matches the stored object (otherwise permanently OutOfSync).
  metadata: {}
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            allocationMode: ExactCount
            count: 1
            adminAccess: true
