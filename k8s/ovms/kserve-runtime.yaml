# KServe ServingRuntime for OpenVINO Model Server on the Intel iGPUs (2026-11-26).
# Based on upstream extras/kserve/kserve-openvino.yaml, with three differences:
#   - image pinned to the GPU build this cluster already runs (not `weekly`)
#   - --config_path instead of --model_name/--model_path: the models here are
#     MediaPipe graphs listed in a config.json, which each InferenceService
#     mounts at /config from its own ConfigMap
#   - REST stays on 8000, the port every caller already uses
# GPU access (resource claim, render group, node pinning) is set on the
# InferenceService, not here.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: ovms-gpu-graph
  namespace: ovms
  labels:
    portfolio: "true"
spec:
  annotations:
    prometheus.kserve.io/path: /metrics
    prometheus.kserve.io/port: "8000"
  supportedModelFormats:
    - name: openvino-graph
      version: "1"
      autoSelect: false
  protocolVersions:
    - v2
    - grpc-v2
  containers:
    - name: kserve-container
      # 2026-11-26: 2025.4-gpu -> 2026.4.1-gpu after side-by-side trials (identical
      # embeddings and rerank scores; LLM same speed, wording differs slightly).
      image: openvino/model_server:2026.4.1-gpu
      imagePullPolicy: IfNotPresent
      args:
        - "--config_path=/config/config.json"
        - "--port=9000"
        - "--rest_port=8000"
        - "--log_level=INFO"
        - "--metrics_enable"
        # Idle unload (preview feature, needs 2026.4+): after 15 minutes without an
        # inference request the models are dropped from GPU and system memory and
        # reloaded on the next request. Probes and metrics scrapes do not count as
        # requests. Measured wake-up with the cache below: LLM 0.9 s, the three
        # retrieval models together about 4 s (2026-11-26).
        - "--idle_unload_timeout_seconds=900"
        # Compiled-model cache, so a wake-up imports instead of recompiling.
        - "--cache_dir=/cache"
      ports:
        - { name: rest, containerPort: 8000, protocol: TCP }
      volumeMounts:
        - { name: cache, mountPath: /cache }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 5000
      livenessProbe:
        httpGet: { path: /v2/health/live, port: 8000 }
        initialDelaySeconds: 30
        periodSeconds: 30
        failureThreshold: 5
      readinessProbe:
        httpGet: { path: /v2/health/ready, port: 8000 }
        periodSeconds: 10
      startupProbe:
        httpGet: { path: /v2/health/ready, port: 8000 }
        periodSeconds: 10
        # GPU compile on first load can take minutes.
        failureThreshold: 60
  # Lives as long as the pod: enough for idle wake-ups; a new pod recompiles once.
  volumes:
    - name: cache
      emptyDir:
        sizeLimit: 6Gi
