apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-portfolio-dashboard
  namespace: default
  labels:
    app: devops-portfolio-dashboard
    component: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devops-portfolio-dashboard
  template:
    metadata:
      labels:
        app: devops-portfolio-dashboard
        component: frontend
      annotations:
        kubectl.kubernetes.io/restartedAt: "2024-12-09T00:35:00Z"
    spec:
      nodeSelector:
        # 2026-09-26: static frontend runs on the edge node next to Traefik,
        # freeing memory on the home etcd servers.
        role: edge
      tolerations:
      - key: role
        operator: Equal
        value: edge
        effect: PreferNoSchedule
      containers:
      - name: dashboard
        # Use versioned tags for reproducible deployments
        # Update this tag when deploying new versions
        image: maxjeffwell/devops-portfolio-dashboard:20260211-040925-c0492c7
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devops-portfolio-dashboard
  namespace: default
  labels:
    app: devops-portfolio-dashboard
spec:
  type: ClusterIP
  selector:
    app: devops-portfolio-dashboard
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
# nginx config for the devops-portfolio dashboard. Exported from the live cluster
# 2026-09-26 (was hand-applied); verified with an empty kubectl diff.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-nginx-config
  namespace: default
data:
  default.conf: "server {\n  listen 80;\n  root /usr/share/nginx/html;\n  \n  location /devops-api/ {\n    proxy_pass http://devops-portfolio-api:5001/;\n    proxy_http_version 1.1;\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $scheme;\n    \n    # Force no caching\n    proxy_hide_header Cache-Control;\n    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;\n    add_header Pragma 'no-cache' always;\n    add_header Expires '0' always;\n    add_header X-Accel-Expires '0' always;\n  }\n  \n  location / {\n    index index.html;\n    try_files $uri $uri/ /index.html;\n  }\n}\n"
