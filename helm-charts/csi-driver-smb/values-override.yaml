# Overrides for the upstream csi-driver-smb chart (v1.20.3).
#
# Deliberately minimal. Verified-correct chart defaults that must NOT be
# overridden are documented in
# docs/superpowers/specs/2026-08-01-csi-driver-smb-design.md:
#   linux.tolerations  [{operator: Exists}]  -> required for marmoset's
#                                               workload=gpu:NoSchedule taint
#   linux.kubelet      /var/lib/kubelet      -> k3s here uses the standard path
#   linux.dnsPolicy    ClusterFirstWithHostNet -> required so the node plugin can
#                                               resolve asustor-smb.home.arpa
#   feature.enableGetVolumeStats: true       -> already the default

# Chart defaults this to true, which registers the CSIDriver with
# volumeLifecycleModes ["Persistent","Ephemeral"]. Ephemeral inline volumes
# would let any pod in any namespace mount an arbitrary SMB source with its
# own secret, bypassing the StorageClass entirely. Only PVC-based use is
# intended here.
feature:
  enableInlineVolume: false

# This is a Linux-only cluster. The chart ships windows.enabled=true by
# default, which creates a DaemonSet that can never schedule here.
windows:
  enabled: false

# Chart default is logLevel 5, which is extremely verbose and ships straight
# into Loki on every mount operation. 2 keeps errors and warnings.
controller:
  logLevel: 2
  # The controller mounts the SMB share for every CreateVolume (mount, mkdir
  # subDir, unmount). From the Contabo VPSs that mount takes 40-70s — the
  # multichannel option tries the ASUSTOR's advertised LAN interfaces, which
  # are unreachable through the Tailscale tunnel and must time out first —
  # while csi-provisioner's default RPC deadline is 15s, so provisioning
  # loops DeadlineExceeded forever. Keep the controller on LAN nodes, where
  # the mount is sub-second. (Node-side data mounts are unaffected; VPS pods
  # can still consume SMB PVs, just slowly.)
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [vmi2951245, vmi3115606]

node:
  logLevel: 2
