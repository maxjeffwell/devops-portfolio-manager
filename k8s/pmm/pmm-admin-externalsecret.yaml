# PMM Server admin password. Doppler: portfolio/prd, PMM_ADMIN_PASSWORD.
# Read it with:
#   doppler secrets get PMM_ADMIN_PASSWORD --project portfolio --config prd --plain
# The chart reads Secret pmm-secret, key PMM_ADMIN_PASSWORD (values: secret.create false).
# Sync-wave -1 so the Secret exists before the PMM StatefulSet starts.
#
# File name ends -externalsecret.yaml: this repo's .gitignore drops every
# other *secret*.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pmm-secret
  namespace: pmm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: pmm-secret
    creationPolicy: Owner
  data:
    - secretKey: PMM_ADMIN_PASSWORD
      remoteRef:
        key: PMM_ADMIN_PASSWORD
