{{- if and .Values.gotifyBridge.enabled (gt (int .Values.gotifyBridge.replicas) 1) }}
# 2026-10-07: keep >= 1 alert relay through drains (the 2 replicas already
# prefer separate nodes via podAntiAffinity). Rendered only with > 1 replica:
# with a single replica, minAvailable 1 would block every drain of its node.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager-gotify-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    app: alertmanager-gotify-bridge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: alertmanager-gotify-bridge
{{- end }}
