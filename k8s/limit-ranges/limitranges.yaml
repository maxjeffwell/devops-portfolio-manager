# kube-system: svclb-traefik alone is 9 tiny proxy containers; keep the floor low.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: kube-system
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 10m
        memory: 32Mi
---
# qdrant: no long-running pods lack requests, but every k8up
# backup/check/prune Job pod does — they land BestEffort and are first out
# under node memory pressure, mid-backup. Covered for the Job pods only.
# (cluster-nfs entry removed 2026-09-01 with the stack's retirement.)
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: qdrant
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 10m
        memory: 64Mi
