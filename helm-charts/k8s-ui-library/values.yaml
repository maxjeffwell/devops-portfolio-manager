priorityClassName: portfolio-app
# 2026-10-15: 2 client replicas (hostname spread + PDB) so a server loss or a
# deploy never drops the frontend; the server side is HPA-managed (min 2).
replicaCount: 2

strategy:
  # 2026-10-15: Recreate -> RollingUpdate for the 2-replica client
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  client:
    repository: maxjeffwell/k8s-ui-library-storybook
    tag: 20260516-232953-c5d8117
    pullPolicy: Always

service:
  client:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30011

resources:
  client:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3

autoscaling:
  enabled: false

env:
  client: []

serviceAccount:
  create: false

podSecurityContext: {}

securityContext: {}

ingress:
  enabled: true
  host: showcase.el-jefe.me

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# 2026-10-15: one client replica on the edge VPS (assets served from the public IP)
# and one at home on a server, so neither a VPS outage nor a server loss drops the
# site. The required affinity limits the pods to the four `site`-labelled nodes
# (vmi3610371=edge; elitedesk/m720q/m920s=home); the spread over `site` with
# DoNotSchedule forces one replica per site with replicaCount 2.
nodeSelectorClient: {}
affinityClient:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: site
              operator: In
              values: [edge, home]
tolerationsClient:
  - key: role
    operator: Equal
    value: edge
    effect: PreferNoSchedule
topologySpreadConstraintsClient:
  enabled: true
  maxSkew: 1
  topologyKey: site
  whenUnsatisfiable: DoNotSchedule

nodeSelector: {}

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - "true"

pdb:
  enabled: true
  minAvailable: 1
