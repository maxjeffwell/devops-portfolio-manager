# Recordings (and the Channels DVR dir incl. its Database/) on the dedicated
# 1TB USB drive — static local PV channels-dvr-recordings-usb, mounted in the
# pod at /shares/DVR. Previously local-path on the root NVMe; contents were
# rsynced across during the 2026-07-25 swap.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: channels-dvr-recordings
  namespace: channels-dvr
  labels:
    app: channels-dvr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: channels-usb
  volumeName: channels-dvr-recordings-usb
  resources:
    requests:
      storage: 900Gi
