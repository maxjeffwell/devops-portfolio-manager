apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-portfolio-api
  namespace: default
  labels:
    app: devops-portfolio-api
    component: backend
spec:
  # 2026-10-01: 2 replicas + zero-downtime rollout. The only in-process state is
  # the config-loader's memo of applications.yaml (identical in every pod), so
  # instances are interchangeable. PDB is the third document in this file: the podrick
  # Application has an explicit directory.include list, so new files are NOT picked up.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: devops-portfolio-api
  template:
    metadata:
      labels:
        app: devops-portfolio-api
        component: backend
    spec:
      serviceAccountName: devops-portfolio-api
      containers:
      - name: api
        # Use versioned tags for reproducible deployments
        # Update this tag when deploying new versions
        image: maxjeffwell/devops-portfolio-api:20260211-040925-c0492c7
        imagePullPolicy: Always
        ports:
        - containerPort: 5001
          protocol: TCP
        env:
        - name: PORT
          value: "5001"
        - name: ALLOWED_ORIGINS
          value: "https://podrick.el-jefe.me,https://el-jefe.me"
        - name: NODE_ENV
          value: "production"
        - name: PROMETHEUS_URL
          value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
        - name: ARGOCD_SERVER
          value: "argocd-server.argocd.svc.cluster.local"
        - name: ARGOCD_USERNAME
          valueFrom:
            secretKeyRef:
              name: argocd-credentials
              key: username
        - name: ARGOCD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: argocd-credentials
              key: password
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: devops-portfolio-secrets
              key: github-token
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devops-portfolio-api
  namespace: default
  labels:
    app: devops-portfolio-api
spec:
  type: ClusterIP
  selector:
    app: devops-portfolio-api
  ports:
  - protocol: TCP
    port: 5001
    targetPort: 5001

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devops-portfolio-api
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: devops-portfolio-api
