# 2026-10-01: edge Traefik -> cnpg-bookmarked:5432 for IngressRouteTCP
# code-search-db (k8s/cnpg-clusters/cnpg-bookmarked-edge.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-cnpg-bookmarked
  namespace: default
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: cnpg-bookmarked
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 5432
      protocol: TCP
