# Channels DVR WARM STANDBY for the primary on the ASUSTOR (192.168.50.142:8089).
# TVE (Spectrum) authenticates against the home egress IP, so this can never
# run on the cloud nodes.
#
# 2026-10-07: RUNS ON debian-marmoset for its Iris Xe (Intel GPU DRA,
# gpu-claim.yaml) but is still REACHED AT ELITEDESK: service.yaml has
# externalIPs 192.168.50.115 / .116 / 100.64.0.8 port 8089, so kube-proxy on
# elitedesk forwards the address clients already use (192.168.50.115:8089) to
# the pod wherever it runs. The hostPort is gone; the address no longer follows
# the node. Clients see elitedesk's pod-network IP as the source (SNAT), which
# networkpolicy.yaml already allows (10.42.0.0/16). Same home egress IP as
# elitedesk (97.103.12.66, checked) so Spectrum TVE is unaffected.
# History: hostPort + hostname pin m920s 9/25 -> elitedesk 9/30 (moving it
# meant re-pointing every client); elitedesk UHD 630 VAAPI until 2026-10-07.
#
# Pod network, no hostNetwork: networkpolicy.yaml is enforced. Trade-off: no
# bonjour/mDNS discovery (upstream docker docs use --net=host purely for that).
#
# Standby discipline: same sources configured, recording passes DISABLED.
# Both servers share the same Spectrum TVE ~3-stream cap (enforced at the
# provider by egress IP, not per server). On primary failure: restore the
# newest /channels-dvr/primary-db-backups snapshot via the UI, enable passes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channels-dvr
  namespace: channels-dvr
  labels:
    app: channels-dvr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: channels-dvr
  template:
    metadata:
      labels:
        app: channels-dvr
      annotations:
        # primary is a 125GB ROX NFS mount of the ASUSTOR's live DVR data —
        # not k8s state. A full kopia upload can't finish inside Velero's 4h
        # fs-backup-timeout, and the nightly failure wedged node-agent
        # data-path slots, starving every other backup on this node.
        # recordings is bulk DVR media with the same problem: its PVB crawled
        # at ~20KB/s past the timeout on 8/8, cascading ~80 errors into the
        # daily backup as every later item hit the exhausted context.
        backup.velero.io/backup-volumes-excludes: primary,recordings
    spec:
      # debian-marmoset: Iris Xe via DRA (shared with immich-ml/ovms-llm/
      # tdarr-node through adminAccess claims), Mayastor csi node, ASUSTOR NFS
      # exports cover 192.168.50.0/24. The client address stays on elitedesk
      # (service.yaml), so this pin is placement only, not an address.
      nodeSelector:
        kubernetes.io/hostname: debian-marmoset
      tolerations:
        - key: gpu-priority
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      resourceClaims:
        - name: igpu
          resourceClaimTemplateName: igpu
      containers:
        - name: channels-dvr
          # :tve, not :latest — the default image is Alpine WITHOUT Chrome;
          # TV Everywhere login drives a headless Chrome server-side, so the
          # Spectrum TVE source only works on the Debian-based tve variant.
          image: fancybits/channels-dvr:tve
          env:
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 8089
              name: http
          volumeMounts:
            - name: data
              mountPath: /channels-dvr
            - name: recordings
              # /shares/DVR is the path the image's setup UI offers by default
              mountPath: /shares/DVR
            - name: primary
              mountPath: /primary
              readOnly: true
          resources:
            requests:
              # 2026-09-30: cpu 250m -> 400m. Recording/transcode bursts peaked at
              # 382m and exceeded the old request in 22 five-minute windows over 30
              # days; no cpu limit, so this only corrects the scheduler's view.
              cpu: 400m
              memory: 512Mi
            limits:
              memory: 4Gi
            claims:
              - name: igpu
          readinessProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: channels-dvr-data
        - name: recordings
          persistentVolumeClaim:
            claimName: channels-dvr-recordings-nfs
        - name: primary
          persistentVolumeClaim:
            claimName: channels-dvr-primary-data
            readOnly: true
