# cnpg-lunary: captured from the live cluster 2026-09-05 (was live-patched, untracked).
# Same field set as cnpg-bookmarked. Migrated off Synology iSCSI to mayastor-2 2026-09-05 (repl=2, primary on m720q).
# bootstrap: was the pg_basebackup migration source (gone); now initdb with the real db identity (2026-10-02), see the comment on bootstrap
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-lunary
  namespace: default
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  # 2026-09-26: 1 -> 2, same pattern as cnpg-auth / cnpg-vaultwarden.
  # lunary-backend is the one consumer that historically fell over on DB blips,
  # so a standby to fail over to is worth more here than on the other
  # portfolio DBs. enablePDB stays false: with a PDB, draining the primary's
  # node blocks until a manual `kubectl cnpg promote`.
  instances: 2
  # 2026-09-26: switchover instead of the default in-place restart. Any
  # pod-spec change (affinity, resources, image) otherwise restarts the primary
  # in place -- up to ~3 min here, waiting out smartShutdownTimeout on pooled
  # clients. With a standby, CNPG promotes it first: seconds of disruption.
  # The primary then STAYS on the promoted instance (the SATA-backed standby)
  # until the next switchover.
  primaryUpdateMethod: switchover
  enablePDB: false
  priorityClassName: portfolio-critical
  inheritedMetadata:
    labels:
      portfolio: 'true'
  affinity:
    enablePodAntiAffinity: true
    # m920s added 2026-09-26 and preferred: it has the CPU-request headroom
    # and keeps the standby off the primary's node without crowding m720q.
    nodeAffinity:
      # 2026-09-30: the only real constraint is a node that can attach Mayastor
      # volumes (csi-node runs where openebs.io/engine=mayastor). No hostname
      # list, no preference: the scheduler places instances by free requests
      # and CNPG's pod anti-affinity keeps primary and replica on different
      # nodes.
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: openebs.io/engine
            operator: In
            values:
            - mayastor
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  # Created by pg_basebackup from cnpg-lunary-src, a migration source that no
  # longer exists (cluster and its TLS Secrets gone; the instance manager logged
  # 'secrets "cnpg-lunary-src-replication" not found'). Replaced with initdb
  # carrying the real database identity, read from pg_database. bootstrap is
  # only read at creation (plus the db/owner names for monitoring and app-role
  # reconciliation, which are unchanged), so this is inert today.
  bootstrap:
    initdb:
      database: lunary
      owner: neondb_owner
      encoding: UTF8
      localeCType: C
      localeCollate: C
  probes:
    liveness:
      isolationCheck:
        connectionTimeout: 5000
        enabled: true
        requestTimeout: 5000
  # storageClass only applies to PVCs created after the change: the existing
  # primary PVC stays on mayastor-2 (NVMe), the 2026-09-26 standby -- and any
  # instance recreated later -- lands on mayastor-2-sata (m920s BX300 +
  # elitedesk USB BX500). NVMe is scarce; CNPG replication is the second copy.
  storage:
    resizeInUseVolumes: true
    size: 5Gi
    storageClass: mayastor-2-sata
  # 2026-09-07 right-sizing. Measured 2-day peaks across the cnpg clusters:
  # cpu 23m against a 250m request, memory 319Mi against a 256Mi request. So the
  # cpu reservation was ~10x too big while memory was slightly too small.
  resources:
    limits:
      memory: 512Mi
    requests:
      # 2026-09-16: cpu 100m -> 60m. 14-day peak is 27m, so 100m reserved ~3.7x
      # the real peak. elitedesk sat at 95.9% of allocatable CPU in *requests*
      # while only ~26% busy, which is what preempted kube-state-metrics on the
      # 09-07 reboot. 60m is still >2x peak. Memory untouched.
      cpu: 60m
      memory: 384Mi
  monitoring:
    customQueriesConfigMap:
    - key: queries
      name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: true
  enableSuperuserAccess: false
  # Continuous WAL archiving to B2 via the Barman Cloud plugin
  # (ObjectStore cnpg-lunary-b2, see barman-cloud-b2.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-lunary-b2
  backup:
    target: prefer-standby
    volumeSnapshot:
      className: mayastor-snapclass-cnpg
      online: true
      onlineConfiguration:
        immediateCheckpoint: false
        waitForArchive: true
      snapshotOwnerReference: none
