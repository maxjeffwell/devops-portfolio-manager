apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  accounts.claude-mcp: apiKey
  accounts.radar: apiKey
  kustomize.buildOptions: --load-restrictor LoadRestrictionsNone
  resource.customizations.health.apps_Deployment: |-
    hs = {}
    if obj.status ~= nil then
      if obj.status.conditions ~= nil then
        for i, condition in ipairs(obj.status.conditions) do
          if condition.type == "Available" and condition.status == "True" then
            hs.status = "Healthy"
            hs.message = condition.message
            return hs
          end
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for rollout"
    return hs
  resource.customizations.health.batch_CronJob: |
    hs = {}
    if obj.spec.suspend ~= nil and obj.spec.suspend then
      hs.status = "Healthy"
      hs.message = "CronJob is suspended"
    else
      hs.status = "Healthy"
      hs.message = "CronJob is active"
    end
    return hs
