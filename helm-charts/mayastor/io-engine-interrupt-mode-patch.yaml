# Per-node SPDK interrupt mode + hyperthread-aware core lists for io-engine
# (interrupt mode is experimental in mayastor 2.12).
#
# Both chart knobs are DaemonSet-wide: io_engine.interruptMode.enabled and
# io_engine.coreList (renders as a single "-l1" for every node). The nodes are
# not uniform, so the container command is wrapped: the shell exports the two
# env vars the chart would set, rewrites the "-l" core list for nodes where
# cpu1 shares a physical core with another thread, then execs io-engine with
# the chart's args otherwise unchanged.
#
#   m920s        i7-8700   cpu1's HT sibling is cpu7      -> -l1,7 (owns core 1)
#   neonmarmoset i7-1260P  siblings are adjacent (0-1)    -> -l2,3 (whole P-core,
#                           cpu1 would share a core with cpu0's housekeeping)
#   elitedesk    i5-9500T  no HT                          -> -l1 (chart value)
#   m720q        i5-8400T  no HT                          -> -l1 (chart value)
#
# "-l" has no env override in io-engine, hence the arg rewrite. Check
# /sys/devices/system/cpu/cpuN/topology/thread_siblings_list before adding a node.
#
# NOT part of the Helm release. `helm upgrade` resets the command to
# ["io-engine"]; that fails safe (plain polling, -l1) once pods restart.
# Re-apply after every upgrade:
#   kubectl -n openebs patch ds mayastor-io-engine --type strategic \
#     --patch-file helm-charts/mayastor/io-engine-interrupt-mode-patch.yaml
# DaemonSet is OnDelete: delete one io-engine pod at a time and wait for all
# nexus children Online before the next (see restart trap notes).
spec:
  template:
    spec:
      containers:
        - name: io-engine
          command:
            - sh
            - -c
            - |
              case "$MY_NODE_NAME" in
                elitedesk|m720q|m920s|neonmarmoset)
                  export ENABLE_INTERRUPT_MODE=true NVME_IOQ_POLL_PERIOD=100us
                  echo "interrupt mode ON for $MY_NODE_NAME" ;;
              esac
              case "$MY_NODE_NAME" in
                m920s)        CORES=1,7 ;;
                neonmarmoset) CORES=2,3 ;;
                *)            CORES= ;;
              esac
              if [ -n "$CORES" ]; then
                set -- $(for a in "$@"; do case "$a" in -l[0-9]*) echo "-l$CORES" ;; *) echo "$a" ;; esac; done)
                echo "core list -l$CORES for $MY_NODE_NAME"
              fi
              exec io-engine "$@"
            - io-engine
