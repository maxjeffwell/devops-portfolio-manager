apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-api-external-secret
  namespace: default
spec:
  data:
  - remoteRef:
      key: PORTFOLIO_ADMIN_USERNAME
    secretKey: admin-username
  - remoteRef:
      key: PORTFOLIO_ADMIN_PASSWORD
    secretKey: admin-password
  - remoteRef:
      key: PORTFOLIO_JWT_SECRET
    secretKey: jwt-secret
  - remoteRef:
      key: GOTIFY_APP_TOKEN
    secretKey: gotify-app-token
  - remoteRef:
      key: GOTIFY_CLIENT_TOKEN
    secretKey: gotify-client-token
  - remoteRef:
      key: AUTH_DATABASE_URL   # 2026-10-23: auth DB on the native Patroni HA cluster (was NEON_DATABASE_URL -> cnpg-auth)
    secretKey: auth-database-url
  # 2026-10-15: cross-replica login rate-limit counter in default/redis
  # (same Doppler key the redis-external-secret syncs).
  - remoteRef:
      key: REDIS_PASSWORD
    secretKey: redis-password
  refreshInterval: 23h44m10s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: portfolio-api-secrets

