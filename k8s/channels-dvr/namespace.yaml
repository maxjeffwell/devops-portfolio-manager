apiVersion: v1
kind: Namespace
metadata:
  name: channels-dvr
  annotations:
    # Before the ResourceClaimTemplate (wave -1): its adminAccess request is
    # only admitted in a namespace carrying the admin-access label.
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: channels-dvr
    # 2026-10-07: allows adminAccess ResourceClaims (gpu-claim.yaml).
    resource.kubernetes.io/admin-access: "true"
