# NetworkPolicy default/allow-portfolio-api-prometheus. Exported from the live cluster 2026-09-26 (it was
# hand-applied, tracked by nothing); verified with an empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portfolio-api-prometheus
  namespace: default
spec:
  egress:
  - ports:
    - port: 9090
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: prometheus
  podSelector:
    matchLabels:
      app: portfolio-api
  policyTypes:
  - Egress
