# Intel XPUM daemon v2.2.0 on the Iris Xe nodes (neon, dm): GPU telemetry
# (engine utilization, frequency, hw_status) for Prometheus. Rendered from the
# upstream chart (header of rendered-2.2.0.yaml; inputs in
# helm-charts/xpumd/values-override.yaml), same pattern as k8s/intel-gpu-dra.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: intel-xpumd
resources:
  - namespace.yaml
  - rendered-2.2.0.yaml
  - prometheusrule.yaml
  - grafana-dashboard.yaml
patches:
  # Chart scrapes every 5 s; 30 s matches the rest of the cluster and is plenty
  # for utilization graphs and a 2 m reset alert.
  - target:
      kind: ServiceMonitor
      name: xpumd
    patch: |-
      - op: replace
        path: /spec/endpoints/0/interval
        value: 30s
  # Spell out the API server defaults (spec.metadata, toleration operator) so
  # ArgoCD's diff matches the stored object; otherwise permanently OutOfSync
  # (same as k8s/jellyfin/gpu-claim.yaml).
  - target:
      kind: ResourceClaimTemplate
      name: xpumd
    patch: |-
      - op: add
        path: /spec/metadata
        value: {}
      - op: add
        path: /spec/spec/devices/requests/0/exactly/tolerations/0/operator
        value: Equal
      - op: add
        path: /spec/spec/devices/requests/0/exactly/tolerations/1/operator
        value: Equal
