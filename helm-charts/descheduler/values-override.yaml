# Overrides for the upstream descheduler chart (kubernetes-sigs, 0.37.0).
#
# Why (2026-10-06, user decision): every m920s outage empties it (taint-based
# eviction after ~5 min NotReady) and the scheduler never moves pods back —
# three manual rebalances in one day. LowNodeUtilization does that pass
# automatically.
#
# Scope: ONLY the three servers (control-plane label). dm/neon are GPU nodes
# (keep non-GPU work off them), marmoset is the NoSchedule laptop, the VPS is
# the edge; none of them should be "underutilized" targets or eviction sources.
# Evicted pods are re-placed by kube-scheduler as usual.
kind: Deployment
deschedulingInterval: 10m
replicas: 1
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

deschedulerPolicyAPIVersion: "descheduler/v1alpha2"
deschedulerPolicy:
  nodeSelector: "node-role.kubernetes.io/control-plane=true"
  # gentle: a few pods per pass, every 10 min, instead of a storm after an outage
  maxNoOfPodsToEvictPerNode: 4
  maxNoOfPodsToEvictPerNamespace: 2
  profiles:
    - name: rebalance-servers
      pluginConfig:
        - name: DefaultEvictor
          args:
            # Never evict pods with PVCs: local-PV pods (CNPG/PSMDB members,
            # Prometheus/Tempo/Kafka stores) can only come back to the same node,
            # and Mayastor-volume pods carry a detach/attach cost; both are moved
            # by hand when wanted. emptyDir pods ARE evictable (ephemeral by nature).
            podProtections:
              defaultDisabled:
                - "PodsWithLocalStorage"
              extraEnabled:
                - "PodsWithPVC"
            nodeFit: true
        - name: RemoveDuplicates
        - name: LowNodeUtilization
          args:
            # % of allocatable REQUESTS, as DEVIATION from the mean of the three
            # servers (2026-10-24): a server more than 15 points below the mean
            # on BOTH cpu and memory is "underutilized"; servers more than 15
            # points above it give up pods until the gap closes.
            # Why: the old fixed 35/35/35 needed a server under ALL three, and
            # after the 10/24 m920s outage it sat at cpu 31 / mem 40 / pods 31
            # (memory now floored by pinned Patroni/local-PV/io-engine pods)
            # while elitedesk 96% and m720q 93% cpu -> "No node is
            # underutilized, nothing to do". Pods dropped from the criteria:
            # pod count says little about load here (DaemonSets, tiny sidecars).
            useDeviationThresholds: true
            thresholds:
              cpu: 15
              memory: 15
            targetThresholds:
              cpu: 15
              memory: 15
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - LowNodeUtilization
