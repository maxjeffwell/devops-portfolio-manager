apiVersion: v1
kind: Namespace
metadata:
  name: intel-xpumd
  annotations:
    # Before the ResourceClaimTemplate (wave -1): its adminAccess request is
    # only admitted in a namespace carrying the admin-access label.
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    # xpumd reads the GPUs through a DRA adminAccess ResourceClaim (shared
    # with the GPU apps); the API server only allows that in labelled namespaces.
    resource.kubernetes.io/admin-access: "true"
