apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ovms-external-secret
  namespace: ovms
spec:
  refreshInterval: 23h56m46s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    name: ovms-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    # Tells KServe's storage initializer how to reach Garage with these keys
    # (in-cluster HTTP endpoint, path-style buckets).
    template:
      metadata:
        annotations:
          serving.kserve.io/s3-endpoint: garage.monitoring.svc.cluster.local:3900
          serving.kserve.io/s3-usehttps: "0"
          serving.kserve.io/s3-region: garage
          serving.kserve.io/s3-usevirtualbucket: "false"
          serving.kserve.io/s3-verifyssl: "0"
  data:
    - remoteRef: { key: OVMS_S3_ACCESS_KEY }
      secretKey: AWS_ACCESS_KEY_ID
    - remoteRef: { key: OVMS_S3_SECRET_KEY }
      secretKey: AWS_SECRET_ACCESS_KEY
---
# KServe reads the S3 credentials of an InferenceService from the secrets listed
# on its ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ovms-models
  namespace: ovms
  labels:
    portfolio: "true"
secrets:
  - name: ovms-s3-credentials
