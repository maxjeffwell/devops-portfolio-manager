---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-snapshot-pruner
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-snapshot-pruner
  namespace: default
rules:
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-snapshot-pruner
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-snapshot-pruner
subjects:
- kind: ServiceAccount
  name: cnpg-snapshot-pruner
  namespace: default
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-snapshot-pruner
  namespace: default
spec:
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # retry on transient API failures instead of skipping a whole day
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: cnpg-snapshot-pruner
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - marmoset
          containers:
          - name: prune
            image: alpine/k8s:1.31.0
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 128Mi
            command:
            - /bin/sh
            - -c
            # exits 1 if any list/delete failed so the Job (and CronJob status)
            # surfaces the failure instead of silently reporting success
            args:
            - |
              set -u
              RETENTION_DAYS="${RETENTION_DAYS:-7}"
              NOW=$(date -u +%s)
              CUTOFF=$((NOW - RETENTION_DAYS * 86400))
              echo "Pruning CNPG VolumeSnapshots older than ${RETENTION_DAYS} days"
              echo "Cutoff epoch: ${CUTOFF}"
              TMP=$(mktemp)
              TOTAL=0
              FAILED=0
              for cluster in cnpg-auth cnpg-codetalk cnpg-lunary cnpg-bookmarked; do
                echo "--- ${cluster} ---"
                if ! kubectl get volumesnapshot -n default -l "cnpg.io/cluster=${cluster}" \
                     -o jsonpath='{range .items[*]}{.metadata.name}|{.metadata.creationTimestamp}{"\n"}{end}' > "$TMP"; then
                  echo "  ERROR: list failed for ${cluster}"
                  FAILED=$((FAILED + 1))
                  continue
                fi
                while IFS='|' read -r name created; do
                  [ -z "$name" ] && continue
                  created_epoch=$(date -u -D "%Y-%m-%dT%H:%M:%SZ" -d "$created" +%s 2>/dev/null) || continue
                  if [ "$created_epoch" -lt "$CUTOFF" ]; then
                    if kubectl delete volumesnapshot -n default "$name" --wait=false >/dev/null; then
                      echo "  deleted: $name"
                      TOTAL=$((TOTAL + 1))
                    else
                      echo "  FAIL: $name"
                      FAILED=$((FAILED + 1))
                    fi
                  fi
                done < "$TMP"
              done
              rm -f "$TMP"
              echo "Total deleted: ${TOTAL}, failures: ${FAILED}"
              [ "$FAILED" -eq 0 ] || exit 1
