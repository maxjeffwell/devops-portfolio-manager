apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  # 2026-09-25: moved off the debian-marmoset laptop (local-path) to the m920s
  # SATA Mayastor pool. Single replica; the DB is on mayastor-2, this is
  # attachments/icons and is covered by the Velero + export tracks.
  storageClassName: mayastor-sata
  resources:
    requests:
      storage: 2Gi
