{{- if .Values.garage.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/component: object-storage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 2

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "__HOST_IP__:3901"
    rpc_secret = "__RPC_SECRET__"

    # Garage v2 requires <node_id>@<addr>; bare ip:port is silently unusable
    # ("Unable to parse and/or resolve peer hostname") and a fresh node never
    # joins. 10.0.0.7 (AXE-7800) was removed from the layout.
    bootstrap_peers = [
      "332f5e30f99d2a88372f3f0937d2bfe9af679f329ead6f42c0d213b084897e65@10.0.0.4:3901",
      "c2194d82e4ed754a0dfebfa9f4cf165dbc84b9ba123b2a7ca5c3a6492246b7e5@10.0.0.5:3901",
      "c36296bd28f0888a1c64211376612ce50d836d5bb0a37110360be46ac1f24e95@10.0.0.6:3901",
    ]

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    {{- if .Values.garage.ingress.virtualHostedStyle }}
    # Tells Garage which DNS suffix to strip from the Host header to extract
    # the bucket name. Required for virtual-hosted-style S3 addressing
    # (e.g. ovms-models.s3.el-jefe.me -> bucket "ovms-models").
    root_domain = ".{{ .Values.garage.ingress.host }}"
    {{- end }}

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "__ADMIN_TOKEN__"
{{- end }}
