apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks-uuids-eso
  namespace: monitoring
  labels:
    app: healthchecks-verifier
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    name: healthchecks-uuids
    creationPolicy: Owner
  data:
  # Full map for the verifier, which needs every slug.
  - secretKey: uuids.json
    remoteRef:
      key: HEALTHCHECKS_UUIDS_JSON
  # Single UUID for the heartbeat, so a shell script never has to parse JSON.
  # This is a SEPARATE Doppler key, not a field extracted from the map above:
  # `remoteRef.property` does NOT work with the Doppler provider — it silently
  # returns the entire secret value instead of the selected field, which made
  # the heartbeat curl a 523-byte JSON blob as if it were a UUID (verified
  # 2026-08-10). A dedicated key is also immune to the line-wrapping that
  # corrupts long values entered through the Doppler web UI; set it with the
  # CLI: doppler secrets set HEALTHCHECKS_HEARTBEAT_UUID=... -p portfolio -c prd
  - secretKey: k3s-cluster-heartbeat
    remoteRef:
      key: HEALTHCHECKS_HEARTBEAT_UUID
