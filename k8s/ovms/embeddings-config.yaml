apiVersion: v1
kind: ConfigMap
metadata:
  name: ovms-embeddings-config
  namespace: ovms
  labels:
    app: ovms-embeddings
    portfolio: "true"
data:
  # OVMS config: registers the e5-large embeddings MediaPipe graph AND the
  # interval_ai TensorFlow SavedModel (KServe v2 /v2/models/interval_ai, served
  # here instead of Triton since 2026-09-30; on the i915 via the OpenVINO GPU plugin).
  # e5-large: MediaPipe
  # graph. base_path points at /config (this ConfigMap mount) where graph.pbtxt
  # lives; the model files stay on the read-only PVC, referenced by absolute
  # models_path in the graph.
  config.json: |
    {
      "mediapipe_config_list": [
        { "name": "e5-large", "base_path": "/config" },
        { "name": "qwen2.5-1.5b-instruct", "graph_path": "/config/llm-graph.pbtxt" }
      ],
      "model_config_list": [
        {
          "config": {
            "name": "interval_ai",
            "base_path": "/models/interval_ai",
            "target_device": "GPU",
            "plugin_config": { "INFERENCE_PRECISION_HINT": "f32" }
          }
        }
      ]
    }
  # OpenAI-compatible embeddings graph (OVMS 2025.4 EmbeddingsCalculatorOV).
  # e5 requires MEAN pooling; embeddings are L2-normalized server-side.
  graph.pbtxt: |
    input_stream: "REQUEST_PAYLOAD:input"
    output_stream: "RESPONSE_PAYLOAD:output"
    node {
      name: "EmbeddingsExecutor"
      input_side_packet: "EMBEDDINGS_NODE_RESOURCES:embeddings_servable"
      calculator: "EmbeddingsCalculatorOV"
      input_stream: "REQUEST_PAYLOAD:input"
      output_stream: "RESPONSE_PAYLOAD:output"
      node_options: {
        [type.googleapis.com / mediapipe.EmbeddingsCalculatorOVOptions]: {
          models_path: "/models/e5-large/1",
          plugin_config: '{"NUM_STREAMS": "1"}',
          normalize_embeddings: true,
          pooling: CLS,
          target_device: "GPU"   # explicit: bookmarked + intervalai embeddings run on the i915, not the CPU
        }
      }
    }
  # 2026-10-01: OpenAI-compatible chat (/v3/chat/completions, model
  # "qwen2.5-1.5b-instruct") for shared-ai-gateway's auto tier (tags, descriptions).
  # Weights: OpenVINO/Qwen2.5-1.5B-Instruct-int4-ov (Apache-2.0) in s3://ovms-models.
  llm-graph.pbtxt: |
    input_stream: "HTTP_REQUEST_PAYLOAD:input"
    output_stream: "HTTP_RESPONSE_PAYLOAD:output"
    node: {
      name: "LLMExecutor"
      calculator: "HttpLLMCalculator"
      input_stream: "LOOPBACK:loopback"
      input_stream: "HTTP_REQUEST_PAYLOAD:input"
      input_side_packet: "LLM_NODE_RESOURCES:llm"
      output_stream: "LOOPBACK:loopback"
      output_stream: "HTTP_RESPONSE_PAYLOAD:output"
      input_stream_info: {
        tag_index: 'LOOPBACK:0',
        back_edge: true
      }
      node_options: {
        [type.googleapis.com / mediapipe.LLMCalculatorOptions]: {
          models_path: "/models/qwen2.5-1.5b-instruct",
          plugin_config: '{}',
          enable_prefix_caching: false,
          cache_size: 1,
          max_num_seqs: 4,
          device: "GPU"
        }
      }
      input_stream_handler {
        input_stream_handler: "SyncSetInputStreamHandler",
        options {
          [mediapipe.SyncSetInputStreamHandlerOptions.ext] {
            sync_set {
              tag_index: "LOOPBACK:0"
            }
          }
        }
      }
    }
