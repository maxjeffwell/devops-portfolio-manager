{{- if .Values.crowdsec.logProcessor.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-log-processor-config
  namespace: {{ .Release.Namespace }}
data:
  acquis.yaml: |
    source: file
    filenames:
      # Per-pod logs (Traefik mounts the hostPath with subPathExpr=$(POD_NAME),
      # 2 replicas since 2026-09-25). The flat path is kept for any leftover file.
      - /var/log/traefik/*/access.log
      - /var/log/traefik/access.log
    # Each Traefik rollout creates new per-pod directories; inotify only sees new
    # files in directories that already existed at startup, so poll the glob.
    discovery_poll_enable: true
    discovery_poll_interval: 30s
    labels:
      type: traefik
  00-traefik-xff-rightmost.yaml: |
    # Runs BEFORE crowdsecurity/traefik-logs (same stage, alphabetical order).
    #
    # Traefik trusts the cloudflared hop (10.42.0.0/16) so it logs the raw
    # X-Forwarded-For list as ClientHost, e.g. "127.0.0.1,103.215.74.185": a
    # client-supplied spoof first, then the real address Cloudflare appended.
    # The hub parser feeds ClientHost straight into source_ip, which fails to
    # parse -- so those requests are never scored (and a parsed 127.0.0.1 would
    # be whitelisted anyway). Rewrite ClientHost to the RIGHTMOST element: no
    # proxy after Cloudflare appends to the header, so it is the real client.
    name: local/traefik-xff-rightmost
    description: "Reduce a multi-hop ClientHost (X-Forwarded-For list) to the rightmost address"
    filter: >-
      evt.Parsed.program startsWith 'traefik'
      && TrimSpace(evt.Parsed.message) startsWith "{"
      && UnmarshalJSON(evt.Parsed.message, evt.Unmarshaled, "xff") in ["", nil]
      && evt.Unmarshaled.xff.ClientHost != nil
      && evt.Unmarshaled.xff.ClientHost contains ","
    statics:
      - parsed: message
        expression: >-
          Replace(evt.Parsed.message,
                  '"ClientHost":"' + evt.Unmarshaled.xff.ClientHost + '"',
                  '"ClientHost":"' + TrimSpace(Split(evt.Unmarshaled.xff.ClientHost, ",")[-1]) + '"',
                  1)
      - meta: xff_rewritten
        expression: evt.Unmarshaled.xff.ClientHost
  s3-api-whitelist.yaml: |
    # Stops scoring S3 API requests that Garage ACCEPTED.
    #
    # Why: crowdsecurity/http-crawl-non_statics bans an address that fetches
    # more than 40 distinct non-static paths faster than 2 per second. That is
    # exactly what an S3 client does when it syncs a folder: on 2026-11-20 an
    # Obsidian vault sync of 59 notes got the home VPN exit address banned for
    # 4 hours, which also cut off every other site behind the bouncer
    # (todo.el-jefe.me among them).
    #
    # Scope, deliberately narrow:
    #   - only the Garage S3 host and its per-bucket subdomains
    #   - only GET and HEAD, the two verbs the crawl scenario counts
    #   - only 2xx answers. Garage has no anonymous access for those verbs, so
    #     a 2xx GET or HEAD carried a valid signature from a key holder.
    # Everything else on this host is still scored: 403 (bad or missing
    # signature), 404, and anything probing it without credentials.
    #
    # The verb list is load-bearing, not tidiness: Garage answers an
    # unauthenticated OPTIONS (CORS preflight) with 200 for ANY path
    # ("OPTIONS /.env" -> 200, checked 2026-11-20). Without the verb test a
    # scanner could probe this host with OPTIONS and never be scored.
    #
    # A whitelist in s02-enrich drops the event before any scenario sees it,
    # so this applies to every scenario, not only the crawl one.
    name: local/s3-api-whitelist
    description: "Do not score S3 GET/HEAD requests that Garage accepted (2xx)"
    whitelist:
      reason: "authenticated S3 API request accepted by Garage"
      expression:
        - >-
          evt.Meta.service == 'http'
          && (evt.Meta.target_fqdn == '{{ .Values.garage.ingress.host }}'
              || evt.Meta.target_fqdn endsWith '.{{ .Values.garage.ingress.host }}')
          && evt.Meta.http_verb in ['GET', 'HEAD']
          && evt.Meta.http_status startsWith '2'
  jellyfin-2fa-whitelist.yaml: |
    # Stops scoring the 403s Jellyfin's two-factor plugin returns while a
    # signed-in session has not finished its 2FA challenge.
    #
    # Why: the plugin answers EVERY API call with 403 until the challenge is
    # completed, and a Jellyfin client fires dozens of calls at once. On
    # 2026-11-21 one sign-in from home produced 33 such 403s in 10 seconds;
    # crowdsecurity/http-probing banned the home address for 4 hours, and the
    # VPS firewall bouncer then dropped the WireGuard mesh with it
    # (headscale.el-jefe.me/health went 504).
    #
    # Scope, deliberately narrow:
    #   - only the Jellyfin host
    #   - only status 403
    #   - not /metrics, which a separate Traefik route answers with 403 for
    #     everyone
    # Jellyfin answers 401, not 403, when the token is missing or invalid, and
    # 404 for paths that do not exist (checked 2026-11-21), so a 403 from this
    # host means the request carried a valid login token. Scanners without
    # credentials are still scored on their 401s and 404s.
    name: local/jellyfin-2fa-whitelist
    description: "Do not score Jellyfin 403s (valid session blocked pending 2FA)"
    whitelist:
      reason: "Jellyfin 403 for an authenticated session (2FA pending or not permitted)"
      expression:
        - >-
          evt.Meta.service == 'http'
          && evt.Meta.target_fqdn == '{{ .Values.crowdsec.logProcessor.jellyfinHost }}'
          && evt.Meta.http_status == '403'
          && !(evt.Meta.http_path startsWith '/metrics')
{{- end }}
