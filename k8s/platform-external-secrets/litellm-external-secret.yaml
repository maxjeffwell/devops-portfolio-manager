# LiteLLM proxy secrets (2026-10-23): database on the native Patroni cluster (db/role `litellm`,
# VIP 192.168.50.60:5000, Prisma TLS sslaccept=strict against /etc/pg-ha/ca.crt) + master key.
# LITELLM_SALT_KEY encrypts credentials LiteLLM stores in its database: never rotate it.
# Consumed by shared-ai-gateway k8s/litellm.yaml (envFrom).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: default
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: LITELLM_DATABASE_URL
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: LITELLM_MASTER_KEY
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: LITELLM_SALT_KEY
