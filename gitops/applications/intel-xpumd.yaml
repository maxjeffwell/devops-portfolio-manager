# Intel XPUM daemon v2.2.0 on the Iris Xe nodes (neon, dm): GPU engine
# utilization, frequency and hw_status -> Prometheus, alerts + Grafana dashboard.
# Source is the rendered chart + kustomize (k8s/intel-xpumd), same pattern as
# intel-gpu-dra. Needs the DRA driver (adminAccess claim) on both nodes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intel-xpumd
  namespace: argocd
  labels:
    app: intel-xpumd
    infrastructure: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/maxjeffwell/devops-portfolio-manager.git
    targetRevision: main
    path: k8s/intel-xpumd
  destination:
    server: https://kubernetes.default.svc
    namespace: intel-xpumd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
