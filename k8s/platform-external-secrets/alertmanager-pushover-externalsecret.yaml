# Pushover credentials for Alertmanager's second notification channel
# (2026-11-26). Critical alerts go to Gotify AND Pushover; Gotify lives inside
# the cluster, Pushover does not. Alertmanager reads the two values as files
# (alertmanagerSpec.secrets in helm-charts/monitoring/values.yaml), so they
# never appear in its config or in this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
  namespace: monitoring
spec:
  data:
  - remoteRef:
      key: PUSHOVER_USER_KEY
    secretKey: user-key
  - remoteRef:
      key: PUSHOVER_API_TOKEN
    secretKey: token
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: alertmanager-pushover
