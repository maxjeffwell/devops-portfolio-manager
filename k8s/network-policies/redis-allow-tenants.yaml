# NetworkPolicy default/redis-allow-tenants. Exported from the live cluster 2026-09-26 (it was
# hand-applied, tracked by nothing); verified with an empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-tenants
  namespace: default
spec:
  ingress:
  - from:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          portfolio: 'true'
    ports:
    - port: 6379
      protocol: TCP
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
