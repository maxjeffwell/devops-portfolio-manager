---
# Stirling PDF's /configs volume — holds the embedded H2 database with every
# user account, plus settings.yml and the app's own DB dumps under backup/db.
#
# Declared HERE rather than left to the chart (persistence.existingClaim points
# at it) for one reason: the chart's pvc.yaml template supports labels but not
# annotations, and this volume needs `k8up.io/backup: "false"`.
#
# 🔑 Why that annotation: k8up's PVC backup method mounts the PV a SECOND time
# on the node. The openebs LVM CSI driver refuses that — `verifyMount: device
# already mounted` — so a PVC-level backup of this volume can never succeed
# while the app is running. It is backed up instead by the
# k8up.io/backupcommand annotation on the pod (see
# helm-charts/stirling-pdf/values-override.yaml), which streams a tar of
# /configs out of the running container and needs no mount at all.
# The qdrant and cluster-nfs schedules do not hit this because their volumes
# are iSCSI-backed, whose drivers permit the second mount.
#
# Spec matches the chart-generated PVC exactly so ArgoCD adopts the existing
# volume in place rather than provisioning a new one. The PV reclaim policy is
# Retain, so the data survives even if this object is ever recreated.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  annotations:
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: openebs-lvmpv
  resources:
    requests:
      storage: 2Gi
  volumeName: pvc-d1e0e989-f4e4-4b23-b853-c09cd3b12021
