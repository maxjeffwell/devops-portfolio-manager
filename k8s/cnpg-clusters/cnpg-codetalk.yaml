# cnpg-codetalk: captured from the live cluster 2026-09-05 (was live-patched, untracked).
# Same field set as cnpg-bookmarked. Migrated off Synology iSCSI to mayastor-2 2026-09-05 (repl=2, primary on m720q).
# bootstrap: was the pg_basebackup migration source (gone); now initdb with the real db identity (2026-10-02), see the comment on bootstrap
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-codetalk
  namespace: default
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:14
  # 2026-10-06: 2 instances (user decision) — replica joins via pg_basebackup.
  instances: 2
  enablePDB: false
  priorityClassName: portfolio-critical
  inheritedMetadata:
    labels:
      portfolio: 'true'
  affinity:
    enablePodAntiAffinity: true
    # 2026-10-06: hostname list replaced by the real constraint (a Mayastor engine
    # node = elitedesk/m720q/m920s) so the second instance can land on m920s.
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: openebs.io/engine
            operator: In
            values: [mayastor]
    podAntiAffinityType: required
    tolerations:
    - effect: NoSchedule
      key: nfs
      value: broken
    topologyKey: kubernetes.io/hostname
  # Created by pg_basebackup from cnpg-codetalk-src, a migration source that no
  # longer exists (cluster and its TLS Secrets gone; the instance manager logged
  # 'secrets "cnpg-codetalk-src-replication" not found'). Replaced with initdb
  # carrying the real database identity, read from pg_database. bootstrap is
  # only read at creation (plus the db/owner names for monitoring and app-role
  # reconciliation, which are unchanged), so this is inert today.
  bootstrap:
    initdb:
      database: codetalk
      owner: codetalk_user
      secret:
        name: cnpg-codetalk-app
      encoding: UTF8
      localeCType: C
      localeCollate: C
  probes:
    liveness:
      isolationCheck:
        connectionTimeout: 5000
        enabled: true
        requestTimeout: 5000
  storage:
    resizeInUseVolumes: true
    size: 5Gi
    storageClass: mayastor-2
  # 2026-09-07 right-sizing. Measured 2-day peaks across the cnpg clusters:
  # cpu 23m against a 250m request, memory 319Mi against a 256Mi request. So the
  # cpu reservation was ~10x too big while memory was slightly too small.
  resources:
    limits:
      memory: 512Mi
    requests:
      # 2026-09-16: cpu 100m -> 60m. 14-day peak is 27m, so 100m reserved ~3.7x
      # the real peak. elitedesk sat at 95.9% of allocatable CPU in *requests*
      # while only ~26% busy, which is what preempted kube-state-metrics on the
      # 09-07 reboot. 60m is still >2x peak. Memory untouched.
      cpu: 60m
      memory: 384Mi
  monitoring:
    customQueriesConfigMap:
    - key: queries
      name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: true
  enableSuperuserAccess: false
  # Continuous WAL archiving to B2 via the Barman Cloud plugin
  # (ObjectStore cnpg-codetalk-b2, see barman-cloud-b2.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-codetalk-b2
  backup:
    target: prefer-standby
    volumeSnapshot:
      className: mayastor-snapclass-cnpg
      online: true
      onlineConfiguration:
        immediateCheckpoint: false
        waitForArchive: true
      snapshotOwnerReference: none
