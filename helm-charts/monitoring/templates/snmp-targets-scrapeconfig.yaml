{{- if .Values.snmpExporter.enabled }}
{{- range .Values.snmpTargets }}
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: snmp-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    release: prometheus
spec:
  jobName: snmp-{{ .name }}
  metricsPath: /snmp
  scheme: HTTP
  scrapeInterval: {{ .scrapeInterval | default "60s" }}
  scrapeTimeout: {{ .scrapeTimeout | default "30s" }}
  params:
    module: [{{ .module | default "hrstorage" }}]
    auth: [{{ .auth }}]
  staticConfigs:
    - targets:
        - {{ .target | quote }}
      labels:
        host: {{ .host | quote }}
        role: {{ .role | quote }}
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: snmp-exporter.{{ $.Release.Namespace }}.svc.cluster.local:9116
{{- end }}
{{- end }}
