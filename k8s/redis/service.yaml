apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
  labels:
    app: redis
spec:
  type: ClusterIP
  # 2026-10-15: cut over to the KubeBlocks replication cluster (cluster-ha.yaml).
  # Follows the primary via the role label KubeBlocks maintains on the pods, so
  # a Sentinel failover re-points this Service without any client change.
  selector:
    app.kubernetes.io/instance: redis-ha
    apps.kubeblocks.io/component-name: redis
    kubeblocks.io/role: primary
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
