apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovms-embeddings
  namespace: ovms
  labels:
    app: ovms-embeddings
    portfolio: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ovms-embeddings
  template:
    metadata:
      labels:
        app: ovms-embeddings
        portfolio: "true"
    spec:
      # 2026-10-05 (user decision): dm + neon carry a gpu-priority=true:PreferNoSchedule
      # taint so the scheduler steers non-GPU work elsewhere; GPU workloads tolerate it.
      tolerations:
        - key: gpu-priority
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      nodeSelector:
        gpu-node: "true"
        # 2026-10-02 GPU split (user decision): neonmarmoset Xe = jellyfin + ovms-embeddings;
        # debian-marmoset Xe = immich-ml + ovms-llm. Hostname-pinned.
        kubernetes.io/hostname: neonmarmoset
      priorityClassName: portfolio-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # GID 992 = `render` group on debian-marmoset, owns /dev/dri/renderD128.
        # Required for Iris Xe access via the Intel GPU device plugin.
        supplementalGroups: [992]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ovms-models-m920s
        - name: config
          configMap:
            name: ovms-embeddings-config
      # Hydrates /models from Garage S3 on first start; idempotent no-op
      # afterwards. Uses aws-cli (boto3-based, doesn't have OVMS's SDK bug).
      initContainers:
        - name: model-loader
          image: amazon/aws-cli:2.17.43
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              # Sync each model from garage once (marker = a file that only exists after a full sync).
              # e5-large: OpenVINO IR for the embeddings graph. interval_ai: TensorFlow SavedModel
              # (intervalai-server's 51-feature regressor, moved here from Triton 2026-09-30).
              for m in "e5-large:1/openvino_model.bin" "interval_ai:1/saved_model.pb" "qwen3-embedding-0.6b:openvino_model.bin"; do
                name=${m%%:*}; marker=${m#*:}
                if [ -f "/models/$name/$marker" ]; then
                  echo "$name already present, skipping sync"
                  continue
                fi
                echo "Syncing s3://ovms-models/$name -> /models/$name ..."
                # In-cluster Garage (2026-10-02): ~53 MB/s vs ~3.4 MiB/s via public s3.el-jefe.me.
                aws --endpoint-url=http://garage.monitoring.svc.cluster.local:3900 s3 sync "s3://ovms-models/$name" "/models/$name"
                # List the marker's dir: the qwen models are flat (no 1/), and a failed ls under set -e kills the init container.
                ls -la "/models/$name/$(dirname "$marker")/"
              done
              # OpenVINO picks the first *.pb it sees; TensorFlow's optional fingerprint.pb
              # must not be there or the SavedModel fails to load.
              rm -f /models/interval_ai/1/fingerprint.pb
              # Partial downloads left by a killed sync (aws-cli writes <file>.<8 random chars>
              # then renames). Harmless to OVMS but they waste space on the thin volume.
              rm -f /models/*/*.bin.???????? /models/*/1/*.bin.????????
              echo "Sync complete"
          env:
            - { name: AWS_REGION, value: garage }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ovms-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ovms-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - { name: models, mountPath: /models }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            # 2026-10-02: 256Mi -> 1Gi. Against in-cluster garage (~53 MB/s) aws-cli's
            # transfer buffers hit ~250Mi RSS -> OOMKilled 7x (it was fine at 3.4 MiB/s via
            # the public endpoint). Init-container limits don't add to the pod's footprint.
            limits:   { memory: 1Gi }
      containers:
        - name: ovms
          image: openvino/model_server:2025.4-gpu
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            # Graph mode: serves the e5-large embeddings MediaPipe graph from
            # the ovms-embeddings-config ConfigMap, exposing /v3/embeddings.
            # target_device (AUTO) now lives in the graph's node_options.
            - "--config_path=/config/config.json"
            - "--port=9000"
            - "--rest_port=8000"
            - "--log_level=INFO"
            # OVMS answers /metrics with HTTP 400 unless metrics are enabled;
            # without this the ovms/ovms-embeddings ServiceMonitor is always down.
            - "--metrics_enable"
          ports:
            - { name: rest, containerPort: 8000, protocol: TCP }
            - { name: grpc, containerPort: 9000, protocol: TCP }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: config, mountPath: /config, readOnly: true }
          resources:
            requests:
              cpu: "1"
              # 1500Mi reserved but steady-state usage is ~343Mi. debian-marmoset
              # is the only gpu-node=true node, and after its 2026-08-09 reboot
              # repacked 85 pods onto it, requests hit 99% of allocatable (~19Mi
              # free) — which left channels-dvr-db-sync (hard-pinned there for its
              # node-local PVCs, 64Mi) permanently unschedulable. Freeing ~730Mi
              # here fixes that. Real node usage is ~10G/15G with zero memory
              # pressure, so this reservation was the constraint, not actual RAM.
              # NOTE: the 3Gi LIMIT below is deliberately unchanged — the pod does
              # burst past 1500Mi during model load, and the limit is what governs
              # that. Do not lower the limit.
              # 2026-09-27: 768Mi -> 1Gi. Steady state has grown from ~343Mi (Aug)
              # to ~933Mi now (14d p95 1042Mi), so 768Mi was under TYPICAL usage,
              # not just the load burst. Still sized to steady state, not the
              # 1705Mi load peak, to keep debian-marmoset's requests packable.
              # 2026-09-30: 1Gi -> 2Gi. interval_ai (from Triton) now loads alongside e5-large;
              # measured 1787Mi resident with both models. Limit stays 3Gi.
              # 2026-10-01: 2Gi -> 3Gi. + qwen2.5-1.5b-instruct LLM for the gateway's
              # auto tier (int4 weights ~0.9 GB + 1 GB KV cache in shared iGPU memory).
              # 2026-10-01: 3Gi -> 3584Mi. + qwen3-embedding-0.6b (int8, 0.6 GB) for bookmarked.
              # 2026-10-02: 3584Mi -> 7Gi. Measured 6629Mi working set with all four graphs;
              # the request was ~3Gi BELOW real use, so the scheduler counted dm memory as
              # free that OVMS was actually holding. Request now matches reality.
              # 2026-10-02: 7Gi -> 5Gi. The LLM (~2.2Gi working set) moved to ovms-llm.
              # Re-measure with all three remaining models loaded and match it.
              memory: 5Gi
              gpu.intel.com/i915: "1"
            limits:
              # fp16 e5-large (~1.1GB) + OVMS runtime needs >1500Mi; the old
              # limit OOMKilled the pod repeatedly (exit 137) on model load.
              # 2026-10-01: 3Gi -> 6Gi for the qwen2.5-1.5b-instruct LLM graph.
              # 2026-10-01: 6Gi -> 7Gi for the qwen3-embedding-0.6b graph; -> 8Gi after
              # measuring 6293Mi resident with all four graphs loaded (88% of 7Gi).
              memory: 8Gi
              gpu.intel.com/i915: "1"
          livenessProbe:
            httpGet: { path: /v2/health/live, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /v2/health/ready, port: 8000 }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /v2/health/ready, port: 8000 }
            periodSeconds: 10
            # fp16 e5-large GPU compile/load can take minutes; allow ~10 min
            # so the kubelet doesn't SIGKILL mid-compile (caused a restart loop).
            failureThreshold: 60
