apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      # 2026-09-25: m920s (was debian-marmoset, a laptop that reboots). m920s
      # reaches B2 and runs the Velero node-agent; the CNPG DB lives on
      # elitedesk/m720q over mayastor-2 anyway. vmi2951245 was rejected — no
      # outbound route to Backblaze B2.
      #
      # 2026-09-26: hard pin loosened so the pod can follow its data. The volume
      # (vaultwarden-data-r2) has 2 replicas on mayastor-2, so with a hard pin a
      # dead m920s still took the vault down. Allowed on any Mayastor storage
      # node (m920s/elitedesk/m720q; all three verified to reach B2 and run the
      # Velero node-agent), still preferring m920s.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: openebs.io/engine
                    operator: In
                    values: [mayastor]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [m920s]
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:17
          command:
            - sh
            - -c
            - 'until pg_isready -h cnpg-vaultwarden-rw -p 5432; do echo "waiting for db"; sleep 3; done'
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.36.0-alpine
          ports:
            - containerPort: 80
          env:
            - name: DOMAIN
              value: "https://vaultwarden.el-jefe.me"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cnpg-vaultwarden-app
                  key: uri
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "true"
            - name: ENABLE_WEBSOCKET
              value: "true"
            - name: SHOW_PASSWORD_HINT
              value: "false"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: ADMIN_TOKEN
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /alive
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /alive
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data-r2
