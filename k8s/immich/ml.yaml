# Immich machine learning (CLIP smart search, face detection/recognition, OCR)
# on an Intel iGPU via OpenVINO. The -openvino image needs /dev/dri, which the
# Intel GPU device plugin injects for gpu.intel.com/i915; that request is what
# limits scheduling to the i915 nodes. 2026-10-02: Xe iGPU nodes only (see
# nodeSelector) -- 96 EUs vs the UHD 630's 24. The render
# group is gid 992 on every iGPU node. Models download from Hugging Face on first
# use into /cache (replicated Mayastor PVC since 2026-09-30). Runs as uid 1000
# like the server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
  namespace: immich
  labels:
    app: immich
    component: ml
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich
      component: ml
  template:
    metadata:
      labels:
        app: immich
        component: ml
        portfolio: "true"
      annotations:
        backup.velero.io/backup-volumes-excludes: cache,tmp
    spec:
      # 2026-10-02 GPU split (user decision): neonmarmoset Xe = jellyfin + ovms-embeddings;
      # debian-marmoset Xe = immich-ml + ovms-llm. Hostname-pinned.
      # 2026-10-05 (user decision): dm + neon carry a gpu-priority=true:PreferNoSchedule
      # taint so the scheduler steers non-GPU work elsewhere; GPU workloads tolerate it.
      tolerations:
        - key: gpu-priority
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      nodeSelector:
        intel-gpu-gen: xe
        kubernetes.io/hostname: debian-marmoset
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # 992 = `render` group on every iGPU node (owner of /dev/dri/renderD128).
        supplementalGroups: [992]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ml
          image: ghcr.io/immich-app/immich-machine-learning:v3.2.4-openvino   # 2026-10-06: kept in step with the server
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - { name: TZ, value: America/New_York }
            - { name: MACHINE_LEARNING_CACHE_FOLDER, value: /cache }
            # One worker: the initial import is a one-time burst, and one worker
            # keeps peak RAM bounded on a shared node. Raise later if wanted.
            - { name: MACHINE_LEARNING_WORKERS, value: "1" }
            - { name: MACHINE_LEARNING_MODEL_TTL, value: "600" }
          ports:
            - name: http
              containerPort: 3003
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              gpu.intel.com/i915: "1"
            limits:
              cpu: "4"
              # OpenVINO uses more RAM than the CPU path. Measured 9/16: ~3.0Gi steady
              # with CLIP visual + buffalo_l detect/recognise + OCR loaded; 4Gi got
              # OOM-killed once, so 6Gi (elitedesk has 15Gi real headroom).
              memory: 6Gi
              gpu.intel.com/i915: "1"
          volumeMounts:
            - { name: cache, mountPath: /cache }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /ping, port: 3003 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ping, port: 3003 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /ping, port: 3003 }
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - { name: cache, persistentVolumeClaim: { claimName: immich-ml-models } }
        - { name: tmp, emptyDir: { sizeLimit: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-ml
  namespace: immich
  labels:
    app: immich
    component: ml
spec:
  selector:
    app: immich
    component: ml
  ports:
    - name: http
      port: 3003
      targetPort: 3003
