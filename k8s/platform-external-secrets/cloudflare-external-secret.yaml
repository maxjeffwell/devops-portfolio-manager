# ExternalSecret default/cloudflare-external-secret. Exported from the LIVE spec 2026-09-26 (was hand-applied;
# the old copies in k8s/external-secrets were stale). Verified with an empty kubectl diff.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-external-secret
  namespace: default
  annotations:
    force-sync: '1770776166'
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: CLOUDFLARE_API_TOKEN
      metadataPolicy: None
    secretKey: api-token
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: CLOUDFLARE_ZONE_ID
      metadataPolicy: None
    secretKey: zone-id
  refreshInterval: 24h18m48s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: cloudflare-secrets
