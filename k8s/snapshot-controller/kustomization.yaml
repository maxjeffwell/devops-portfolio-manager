apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The CSI snapshot-controller (kube-system), under GitOps since 2026-11-21
# (ArgoCD app `snapshot-controller`). Hand-applied on 2026-03-28 until then.
#
# Both files are the pristine upstream manifests, vendored; local changes are
# patches below.
#   source: https://github.com/kubernetes-csi/external-snapshotter/tree/v8.0.1/deploy/kubernetes/snapshot-controller
#   version: v8.0.1
#   sha256 rbac-snapshot-controller.yaml:  aefaadbfb97cbb22848769b0fef1b6faa27b56dd5d2d232f3e06eb7573bcfa4a
#   sha256 setup-snapshot-controller.yaml: 7e9a0a05f03928f5937e87c4a3bf08ecf24cd5b53c71cbc69991ca321e7237b4
#
# The VolumeSnapshot CRDs are deliberately NOT here: deleting one deletes every
# snapshot object of that kind, so they stay hand-managed. When upgrading the
# controller, apply the matching CRDs from client/config/crd of the same tag
# first.
resources:
  - rbac-snapshot-controller.yaml
  - setup-snapshot-controller.yaml

patches:
  # Upstream's v8.0.1 tag still names the v7.0.1 image and logs at --v=5; the
  # cluster runs the v8.0.1 image at --v=2. Requests 10m/48Mi as running.
  # Memory limit added 2026-11-21 as a runaway guard (15d peak 40Mi).
  - target:
      kind: Deployment
      name: snapshot-controller
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: registry.k8s.io/sig-storage/snapshot-controller:v8.0.1
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --v=2
          - --leader-election=true
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi

  # The running ClusterRole also allows `create` on volumesnapshots, which the
  # v8.0.1 file does not list (the 2026-03 install evidently used a newer RBAC
  # file). Kept as running so adopting this into git removes nothing; revisit
  # when the controller is next upgraded. Index 6 = the volumesnapshots rule.
  - target:
      kind: ClusterRole
      name: snapshot-controller-runner
    patch: |-
      - op: test
        path: /rules/6/resources/0
        value: volumesnapshots
      - op: replace
        path: /rules/6/verbs
        value: ["create", "get", "list", "watch", "update", "patch", "delete"]
