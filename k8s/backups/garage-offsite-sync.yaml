apiVersion: batch/v1
kind: CronJob
metadata:
  name: garage-offsite-sync
  namespace: default
  labels:
    app: garage-offsite-sync
spec:
  # Every day at 06:00 Eastern, after the nightly dump jobs (03:00-05:00) have
  # written to Garage. Was Sundays only until 2026-11-26: the dumps, the Neon
  # storage and the laptop repositories change daily, so a weekly off-site copy
  # could be seven days behind. The sync is incremental, so a daily run only
  # carries that day's changes.
  timeZone: "America/New_York"
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: garage-offsite-sync
        spec:
          restartPolicy: OnFailure
          # Run next to the Garage S3 gateway (hostNet on m920s since 2026-09-25;
          # vmi2951245 is being retired).
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["m920s"]
          containers:
          - name: rclone-sync
            image: rclone/rclone:1.69
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -eu
              echo "[$(date -u)] Starting Garage -> B2 off-site sync"

              # Build rclone config from env (avoids writing secrets to disk)
              export RCLONE_CONFIG_GARAGE_TYPE=s3
              export RCLONE_CONFIG_GARAGE_PROVIDER=Other
              export RCLONE_CONFIG_GARAGE_ENDPOINT="${GARAGE_ENDPOINT}"
              export RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID="${GARAGE_ACCESS_KEY_ID}"
              export RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY="${GARAGE_SECRET_ACCESS_KEY}"
              export RCLONE_CONFIG_GARAGE_REGION=garage
              export RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE=true

              export RCLONE_CONFIG_B2_TYPE=s3
              export RCLONE_CONFIG_B2_PROVIDER=Other
              export RCLONE_CONFIG_B2_ENDPOINT="${B2_ENDPOINT}"
              export RCLONE_CONFIG_B2_ACCESS_KEY_ID="${B2_ACCESS_KEY_ID}"
              export RCLONE_CONFIG_B2_SECRET_ACCESS_KEY="${B2_SECRET_ACCESS_KEY}"
              export RCLONE_CONFIG_B2_REGION=us-east-005
              export RCLONE_CONFIG_B2_FORCE_PATH_STYLE=true

              # Sync each dump-style prefix from Garage:velero -> B2:offsite-bucket.
              # Skip kopia/, restic/, backups/ (Velero already ships those to B2 directly).
              for prefix in mongodb-backups postgresql-backups dns-backups doppler-backups influxdb-backups; do
                echo "[$(date -u)] --- syncing prefix: ${prefix} ---"
                rclone sync \
                  "garage:${SOURCE_BUCKET}/${prefix}" \
                  "b2:${OFFSITE_BUCKET}/${prefix}" \
                  --transfers=4 \
                  --checkers=8 \
                  --stats=30s \
                  --stats-one-line \
                  --bwlimit="${UPLOAD_LIMIT}" \
                  --retries=3 \
                  --low-level-retries=10
              done

              # Neon pageserver remote storage (whole bucket). This IS the durable
              # copy of every Neon tenant/timeline/branch — pageserver + safekeeper
              # disks are caches/WAL buffers. velero-key has READ-only on it
              # (granted 2026-09-27; the pageservers write with mimir-key).
              # Layer files are immutable, so copying a live bucket is safe apart
              # from a small index_part-vs-layer race that the next run fixes.
              echo "[$(date -u)] --- syncing bucket: ${NEON_BUCKET} ---"
              rclone sync \
                "garage:${NEON_BUCKET}" \
                "b2:${OFFSITE_BUCKET}/${NEON_BUCKET}" \
                --transfers=4 \
                --checkers=8 \
                --stats=30s \
                --stats-one-line \
                --bwlimit="${UPLOAD_LIMIT}" \
                --retries=3 \
                --low-level-retries=10

              # The zenbook laptop's restic repository (whole bucket; the list is in
              # ZENBOOK_BUCKETS). The laptop backs up to Garage only; this is its
              # off-site copy (added 2026-11-25, velero-key has READ-only on it).
              # Pack files are immutable, so copying a live repository is safe
              # apart from a small race with a prune, which the next run fixes.
              # MODEL_BUCKETS (2026-11-27): the AI model store the KServe/OVMS
              # servers pull from (converted OpenVINO models, the custom-trained
              # interval_ai model, the rescued bge-reranker). Only copy at home was
              # Garage itself. Models are not secret, so a plain copy is fine.
              for bucket in ${ZENBOOK_BUCKETS} ${MODEL_BUCKETS}; do
                echo "[$(date -u)] --- syncing bucket: ${bucket} ---"
                rclone sync \
                  "garage:${bucket}" \
                  "b2:${OFFSITE_BUCKET}/${bucket}" \
                  --transfers=4 \
                  --checkers=8 \
                  --stats=30s \
                  --stats-one-line \
                  --bwlimit="${UPLOAD_LIMIT}" \
                  --retries=3 \
                  --low-level-retries=10
              done

              echo "[$(date -u)] Off-site sync complete"
              rclone size "b2:${OFFSITE_BUCKET}" || true
            env:
            - name: SOURCE_BUCKET
              value: "app-dumps"
            - name: NEON_BUCKET
              value: "neon-storage"
            # restic only (owner, 2026-11-26). The Kopia mirror (kopia-zenbook-sync,
            # 75 GiB) backs up the same folder, so sending it too would upload the
            # laptop twice; it stays at home, on the Synology and in Garage.
            - name: ZENBOOK_BUCKETS
              value: "restic-zenbook"
            - name: MODEL_BUCKETS
              value: "ovms-models"
            # Upload ceiling for every rclone call in this job (bytes per second,
            # rclone units). 2M = 2 MiB/s, about half of the home uplink, the same
            # ceiling the two NAS sync jobs use. Was 20M until 2026-11-26, which is
            # above the uplink, so the job took all of it for as long as it ran.
            - name: UPLOAD_LIMIT
              value: "2M"
            - name: OFFSITE_BUCKET
              value: "garage-offsite"   # create on B2 first; lifecycle: 90d
            - name: GARAGE_ENDPOINT
              value: "http://garage.monitoring.svc.cluster.local:3900"
            - name: B2_ENDPOINT
              value: "https://s3.us-east-005.backblazeb2.com"
            - name: GARAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-velero-creds
                  key: aws_access_key_id
            - name: GARAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-velero-creds
                  key: aws_secret_access_key
            # B2 creds — needs a new secret (see ExternalSecret below if using ESO/Doppler)
            - name: B2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: b2-offsite-credentials
                  key: aws_access_key_id
            - name: B2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: b2-offsite-credentials
                  key: aws_secret_access_key
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: b2-offsite-credentials-eso
  namespace: default
spec:
  refreshInterval: 23h48m42s
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: b2-offsite-credentials
    creationPolicy: Owner
  data:
  - secretKey: aws_access_key_id
    remoteRef:
      key: B2_OFFSITE_KEY_ID
  - secretKey: aws_secret_access_key
    remoteRef:
      key: B2_OFFSITE_APPLICATION_KEY
