# GPU Operator Helm values override
#
# Operator, NFD master and NFD gc are pinned to debian-marmoset. Only
# marmoset (NVIDIA) and debian-marmoset (Intel iGPU) have GPUs, so GPU
# tooling stays on GPU nodes: the VPSes and elitedesk have none. The chart's
# built-in control-plane affinity is only *preferred*, so historically these
# drifted onto whichever node had room (NFD master sat on vmi3115606 with
# ~100 restarts/week, every one a "http2: client connection lost" on the lossy
# VPS<->VPS tailscale path). marmoset is excluded because it carries the
# workload=gpu taint and is the node these controllers manage.
#
# Managed by ArgoCD (gitops/applications/gpu-operator.yaml).
# After manual sync, re-run patch-operator-probes.sh to fix hardcoded operator probes.

# Preserve existing user values
driver:
  enabled: false
migManager:
  enabled: false
toolkit:
  enabled: true
  # K3s containerd integration — without these env vars the toolkit installer
  # tries default containerd paths (/run/containerd/containerd.sock,
  # /etc/containerd/config.toml) which don't exist on K3s and the
  # nvidia-container-toolkit-daemonset enters CrashLoopBackOff with
  # "unable to dial: dial unix /runtime/sock-dir/containerd.sock"
  env:
    - name: CONTAINERD_CONFIG
      value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl
    - name: CONTAINERD_SOCKET
      value: /run/k3s/containerd/containerd.sock
    - name: CONTAINERD_RUNTIME_CLASS
      value: nvidia
    - name: CONTAINERD_SET_AS_DEFAULT
      value: "true"
    # Toolkit >=1.18 defaults to config-source [command, file]: it runs
    # `containerd config dump` via the host PATH, which on marmoset hits
    # Docker's containerd (2.3.x) and emits a version=4 config that K3s's
    # embedded containerd (2.1.x, max version 3) rejects — killing the
    # k3s-agent (2026-08-08 outage). Force reading CONTAINERD_CONFIG instead.
    - name: RUNTIME_CONFIG_SOURCE
      value: file
devicePlugin:
  enabled: true
  # Time-slicing config. Previously a hand-`kubectl apply`ed ConfigMap plus a
  # manual edit to ClusterPolicy.spec.devicePlugin.config — both invisible to
  # ArgoCD (it three-way-merges against its own last-applied, so fields it
  # never set are neither pruned nor reported out-of-sync; the app read
  # "Synced" the whole time). On a rebuild the chart would have rendered
  # neither, silently dropping marmoset back to 1 replica per GPU.
  #
  # `default: marmoset` is the fallback config name; the node carries no
  # nvidia.com/device-plugin.config label, so this is what is always used.
  config:
    create: true
    name: device-plugin-config
    default: marmoset
    data:
      # NOTE: migStrategy here is overridden at runtime by the MIG_STRATEGY=single
      # env var the operator sets on the DaemonSet. The plugin's own "Running
      # with config" log dump is authoritative, not this file.
      #
      # NOTE: a `devices: ["GPU-8060da56-..."]` line used to sit under the
      # resource below, intending to restrict time-slicing to marmoset's GTX
      # 1080 and spare the 4GB MX150. The plugin IGNORES it —
      #   "Customizing the 'devices' field in sharing.timeSlicing.resources
      #    is not yet supported in the config. Ignoring..."
      # It was dropped rather than carried forward, because it reads as an
      # active restriction while doing nothing. Consequence: marmoset
      # advertises 4 opaque nvidia.com/gpu slots across TWO different GPUs
      # (GTX 1080 8GB + MX150 4GB), so a GPU request can land on the 4GB card.
      # Latent today — nothing requests nvidia.com/gpu. The only real fix is
      # excluding the MX150 at the driver level (NVreg_ExcludeDevices on
      # 0000:02:00.0); deliberately not done.
      marmoset: |-
        version: v1
        flags:
          migStrategy: none
        sharing:
          timeSlicing:
            resources:
            - name: nvidia.com/gpu
              replicas: 2
dcgmExporter:
  enabled: true
nodeStatusExporter:
  enabled: true

# GPU DaemonSets (device-plugin, toolkit, validator, etc.) need to tolerate
# both the standard nvidia.com/gpu taint and the custom workload=gpu taint on
# marmoset. Without both, DaemonSets show DESIRED: 0 and no GPU is advertised.
daemonsets:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: workload
      operator: Equal
      value: gpu
      effect: NoSchedule

# Operator controller — pinned to debian-marmoset (see header). `affinity` here
# replaces the chart's default control-plane preference wholesale.
operator:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - debian-marmoset
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 128Mi

node-feature-discovery:
  # Bump to v0.18.3 (latest patch)
  image:
    repository: registry.k8s.io/nfd/node-feature-discovery
    tag: v0.18.3
  # NFD master — pinned to debian-marmoset (see header). Note the laptop is
  # cordoned by the UPS drain hook during outages; the pod rides it out as
  # Pending until uncordon, which is acceptable for a label aggregator.
  # Leader election has a known panic bug in v0.18.x (NamespaceLister.stop nil
  # pointer on lease loss). Can't disable via values — flag is hardcoded in chart
  # template. Aggressive lease durations reduce loss frequency to near zero.
  master:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - debian-marmoset
    config:
      extraLabelNs: ["nvidia.com"]
      leaderElection:
        leaseDuration: 120s
        renewDeadline: 90s
        retryPeriod: 10s
    livenessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
      periodSeconds: 20
      failureThreshold: 5
    readinessProbe:
      initialDelaySeconds: 10
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 10
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 100m
        memory: 128Mi
  # NFD worker - fix aggressive probe timeouts causing restarts on all nodes
  # Root cause: health server at :8080 starts slowly → "connection refused"
  # before liveness kicks in. startupProbe gates liveness until server is ready.
  worker:
    # Only run the worker on nodes that actually have a GPU.
    #
    # vmi2951245 and vmi3115606 are Contabo VPSes with zero nvidia.com/gpu and
    # zero gpu.intel.com/i915 capacity, so the worker there discovers nothing
    # gpu-operator consumes — but it still exits(1) on the FIRST transient
    # apiserver error (nfd-worker has no retry around the NodeFeature PUT).
    # Every brief blip becomes a restart: 3155 on vmi3115606, 42 on vmi2951245,
    # while every other pod on those same nodes rides the blip out. The probe
    # tuning below fixed the health-server restarts; it cannot fix this one,
    # because the exit is by design in nfd-worker.
    #
    # Verified before pinning: no workload in the cluster selects on
    # feature.node.kubernetes.io/* labels, and the 46 such labels on each VPS
    # node are unused. Existing labels freeze rather than disappear (nfd-gc only
    # reaps NodeFeature objects for deleted nodes).
    #
    # Remove this affinity if a GPU is ever added to one of the VPSes.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - marmoset
                    - debian-marmoset
    tolerations:
      - key: node-role.kubernetes.io/master
        operator: Equal
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: workload
        operator: Equal
        value: gpu
        effect: NoSchedule
    startupProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 10
      failureThreshold: 30
      timeoutSeconds: 5
    livenessProbe:
      initialDelaySeconds: 0
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 5
    readinessProbe:
      initialDelaySeconds: 0
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 10
  gc:
    # Same pin as master; gc only reaps NodeFeature objects, no node deps.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - debian-marmoset
    livenessProbe:
      initialDelaySeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      initialDelaySeconds: 5
      timeoutSeconds: 5
