apiVersion: v1
kind: Namespace
metadata:
  name: tdarr
  annotations:
    # Before the ResourceClaimTemplate (wave -1): its adminAccess request is
    # only admitted in a namespace carrying the admin-access label.
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: tdarr
    # 2026-10-07: allows adminAccess ResourceClaims (gpu-claim.yaml) so tdarr
    # can share the Iris Xe with other namespaces under Intel GPU DRA.
    resource.kubernetes.io/admin-access: "true"
