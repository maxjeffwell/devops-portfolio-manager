# /admin is tailnet-only (2026-11-21).
#
# The admin panel is guarded by a single shared token and is NOT covered by
# user 2FA; an admin can delete accounts and strip 2FA from users. It must not
# be reachable from the internet.
#
# Public traffic arrives through the CDN, so Traefik's TCP peer is never a
# tailnet address → 403 at Traefik. Only clients that reach Traefik directly
# over the tailnet are allowed.
#
# No ipStrategy on purpose: the check uses the TCP peer address, which cannot
# be spoofed with an X-Forwarded-For header.
#
# Same pattern as k8s/jellyfin/ingressroute-metrics-block.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vaultwarden-admin-tailnet-only
  namespace: vaultwarden
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden-admin-tailnet
  namespace: vaultwarden
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vaultwarden.el-jefe.me`) && PathPrefix(`/admin`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: vaultwarden-admin-tailnet-only
      services:
        - name: vaultwarden
          port: 80
  tls:
    secretName: vaultwarden-tls
