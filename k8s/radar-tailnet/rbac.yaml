---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-tailnet
  namespace: radar
---
# Tailscale containerboot persists node identity in a Secret (TS_KUBE_SECRET)
# so the headscale preauth key is only needed for first registration.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-tailnet-state
  namespace: radar
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["radar-tailnet-ts-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-tailnet-state
  namespace: radar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radar-tailnet-state
subjects:
  - kind: ServiceAccount
    name: radar-tailnet
    namespace: radar
