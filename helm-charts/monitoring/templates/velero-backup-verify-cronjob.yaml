{{- if .Values.veleroBackupVerify.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: velero-backup-verify
  namespace: velero
  labels:
    app: velero-backup-verify
spec:
  # Run weekly on Sundays at 4 AM UTC
  schedule: {{ .Values.veleroBackupVerify.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: velero-server
          restartPolicy: OnFailure
          containers:
          - name: verify
            # Use alpine + downloaded velero CLI because velero/velero:v1.17.1
            # is distroless (no /bin/sh), which prevents the script below from
            # bootstrapping. The cluster has direct internet egress for
            # github.com release downloads via velero ns (no NetworkPolicy).
            image: alpine:3.21
            command:
            - /bin/sh
            - -c
            - |
              set -e
              # kubectl is needed for the namespace cleanup at the end; without it
              # the `kubectl delete namespace` silently no-ops and the restored
              # copy of `default` is left running.
              apk add -q --no-cache curl jq kubectl >/dev/null
              cd /tmp
              VELERO_VERSION={{ .Values.veleroBackupVerify.veleroVersion | default "v1.18.0" }}
              curl -sL "https://github.com/vmware-tanzu/velero/releases/download/${VELERO_VERSION}/velero-${VELERO_VERSION}-linux-amd64.tar.gz" | tar xz
              mv "velero-${VELERO_VERSION}-linux-amd64/velero" /usr/local/bin/
              chmod +x /usr/local/bin/velero
              echo "=== Velero Backup Verification ==="
              echo "Date: $(date)"

              # Check BackupStorageLocation status
              echo ""
              echo "Checking BackupStorageLocation status..."
              BSL_STATUS=$(velero backup-location get -o json | jq -r '.items[0].status.phase')
              if [ "$BSL_STATUS" != "Available" ]; then
                echo "ERROR: BackupStorageLocation is $BSL_STATUS, not Available!"
                exit 1
              fi
              echo "✓ BackupStorageLocation is Available"

              # Get latest successful backup
              echo ""
              echo "Finding latest successful backup..."
              LATEST_BACKUP=$(velero backup get --selector velero.io/schedule-name=daily-backup -o json | \
                jq -r '[.items[] | select(.status.phase=="Completed")] | sort_by(.metadata.creationTimestamp) | last | .metadata.name')

              if [ -z "$LATEST_BACKUP" ] || [ "$LATEST_BACKUP" = "null" ]; then
                echo "ERROR: No successful daily backup found!"
                exit 1
              fi
              echo "✓ Latest backup: $LATEST_BACKUP"

              # Check backup details
              echo ""
              echo "Backup details:"
              velero backup describe "$LATEST_BACKUP" --details | grep -E "Phase:|Started:|Completed:|Items Backed Up:|Errors:|Warnings:"

              # Verify backup age (should be less than 48 hours old).
              # BusyBox `date -d` cannot parse ISO 8601, so let jq convert the
              # timestamp to epoch seconds (fromdateiso8601).
              BACKUP_EPOCH=$(velero backup get "$LATEST_BACKUP" -o json | jq -r '.status.completionTimestamp | fromdateiso8601')
              BACKUP_AGE_HOURS=$(( ($(date +%s) - BACKUP_EPOCH) / 3600 ))

              if [ "$BACKUP_AGE_HOURS" -gt 48 ]; then
                echo "WARNING: Latest backup is $BACKUP_AGE_HOURS hours old (>48h)"
              else
                echo "✓ Backup age: $BACKUP_AGE_HOURS hours"
              fi

              # Create test restore (dry-run style - to a test namespace)
              echo ""
              echo "Creating test restore..."
              TEST_RESTORE="verify-$(date +%Y%m%d%H%M%S)"

              # The restore is a live copy of `default`, so leave out everything
              # that ACTS on its own once created: CronJobs would fire on schedule
              # (the restore takes ~30 min), ACME orders/challenges re-request
              # certs, and CNPG Cluster CRs make the operator build duplicate
              # database clusters with fresh PVCs.
              # KubeBlocks (neon-cluster) likewise: the Cluster CR would build a
              # second Neon pageserver writing to the SAME neon-storage bucket,
              # and its children (svc/cm/secret/pvc, all labelled
              # managed-by=kubeblocks) come back carrying
              # component.kubeblocks.io/finalizer with no Component to clear it,
              # wedging the namespace in Terminating (2026-09-27 run).
              velero restore create "$TEST_RESTORE" \
                --from-backup "$LATEST_BACKUP" \
                --include-namespaces default \
                --namespace-mappings default:velero-test-restore \
                --exclude-resources cronjobs.batch,orders.acme.cert-manager.io,challenges.acme.cert-manager.io,certificaterequests.cert-manager.io,clusters.postgresql.cnpg.io,backups.postgresql.cnpg.io,scheduledbackups.postgresql.cnpg.io,clusters.apps.kubeblocks.io,components.apps.kubeblocks.io,instancesets.workloads.kubeblocks.io,services \
                --selector 'app.kubernetes.io/managed-by notin (kubeblocks)' \
                --wait

              # Check restore status
              RESTORE_STATUS=$(velero restore get "$TEST_RESTORE" -o json | jq -r '.status.phase')

              # Capture the restore's own error/warning summary in THIS log before
              # the restore object (and its files in object storage) are deleted.
              echo ""
              echo "Restore summary:"
              velero restore describe "$TEST_RESTORE" --details 2>/dev/null | grep -E "Phase:|Total items|Items restored|Errors:|Warnings:" || true
              # Greedy match up to the trailing ` logSource=` key: API-server errors embed
              # escaped quotes (Service \"x\" is invalid ...), and a [^"]* match used to
              # cut the message at the first backslash (2026-10-04 run showed `Service \`).
              velero restore logs "$TEST_RESTORE" 2>/dev/null | grep -E 'level=(error|warn)' | sed -E 's/.*msg="(.*)" logSource=.*/\1/' | sort | uniq -c | sort -rn | head -40 || true

              if [ "$RESTORE_STATUS" = "Completed" ] || [ "$RESTORE_STATUS" = "PartiallyFailed" ]; then
                echo "✓ Test restore completed with status: $RESTORE_STATUS"

                # Clean up test namespace.
                # Velero restores each PV with its ORIGINAL reclaim policy, and the
                # Mayastor classes are Retain, so deleting the namespace alone left the
                # restored CNPG PVs Released with live 2-replica volumes behind them
                # (6 x 5Gi after the 2026-10-04 run). Flip them to Delete first so the
                # PVC cascade frees the backend volumes.
                echo "Cleaning up test namespace..."
                for pv in $(kubectl get pv -o json | jq -r '.items[] | select(.spec.claimRef.namespace=="velero-test-restore") | .metadata.name'); do
                  kubectl patch pv "$pv" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}' >/dev/null && echo "  reclaim=Delete on $pv"
                done
                kubectl delete namespace velero-test-restore --wait=false

                # Delete the restore object
                velero restore delete "$TEST_RESTORE" --confirm

                echo ""
                echo "=== Verification Complete ==="
                exit 0
              else
                echo "ERROR: Test restore failed with status: $RESTORE_STATUS"
                velero restore describe "$TEST_RESTORE" --details
                exit 1
              fi
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
{{- end }}
