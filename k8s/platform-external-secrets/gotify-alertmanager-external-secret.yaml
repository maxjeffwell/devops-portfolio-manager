# 2026-09-26: remoteRef was GOTIFY_ALERTMANAGER_TOKEN, a Doppler key that never
# existed (so the live Secret was hand-made on 2026-02-07). The live token is
# byte-identical (sha256-checked) to KEEL_GOTIFY_TOKEN -- keel and the
# alertmanager bridge share one Gotify app token -- so it maps that key now.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify-alertmanager-external-secret
  namespace: monitoring
spec:
  data:
  - remoteRef:
      key: KEEL_GOTIFY_TOKEN
    secretKey: gotify-token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: gotify-alertmanager-token
