# KafkaTopic web.vitals — real-user web vitals beacons published by
# analytics-service POST /analytics/rum and consumed by analytics-service into
# InfluxDB bucket web-perf. Hand-applied like the other topics (no ArgoCD app
# syncs k8s/kafka/). Created 2026-10-06.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  labels:
    strimzi.io/cluster: vertex-kafka
  name: web.vitals
  namespace: microservices
spec:
  config:
    retention.ms: 604800000
  partitions: 3
  replicas: 1
