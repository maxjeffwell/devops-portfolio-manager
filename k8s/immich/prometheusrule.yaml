# Login alerts for Immich, from Traefik's per-route request counters (the
# dedicated immich-login IngressRoute in edge.yaml). Log-based alerting is not
# used because Loki's ruler is not managed from this repo.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: immich-login
  namespace: immich
  labels:
    app: immich
    release: prometheus
spec:
  groups:
    - name: immich-login
      rules:
        - alert: ImmichFailedLogins
          # Two forms OR-ed: increase() misses a counter series that is born already
          # above zero (first event after a Traefik start); the "now minus then-or-zero"
          # form catches that case.
          expr: >-
            (sum(increase(traefik_service_requests_total{exported_service=~"immich-immich-login-.*@kubernetescrd", code="401"}[15m])) >= 5)
            or
            ((sum(traefik_service_requests_total{exported_service=~"immich-immich-login-.*@kubernetescrd", code="401"})
              - (sum(traefik_service_requests_total{exported_service=~"immich-immich-login-.*@kubernetescrd", code="401"} offset 15m) or vector(0))) >= 5)
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Immich: {{ $value | printf \"%.0f\" }} failed logins in 15 min"
            description: "Wrong-password responses on immich.el-jefe.me/api/auth/login. Immich logs each one as 'Failed login attempt for user … from ip address …' (kubectl -n immich logs deploy/immich-server). If it is not you, check `cscli decisions list` and consider banning the address."
        # No separate "throttled" alert: requests rejected by the rate-limit middleware
        # never reach the Traefik service, so they are not in
        # traefik_service_requests_total (router-level metrics are not enabled).
        # Guessing still shows up above: the attempts that pass the limiter are 401s.
