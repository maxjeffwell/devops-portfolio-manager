priorityClassName: portfolio-app
# Firebook - Frontend-only application (Firebase backend)
# 2026-10-15: 2 client replicas (hostname spread + PDB) so a server loss or a
# deploy never drops the frontend; the server side is HPA-managed (min 2).
replicaCount: 2

# Use Recreate strategy to avoid resource pressure during deploys
strategy:
  # 2026-10-15: Recreate -> RollingUpdate for the 2-replica client
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  client:
    repository: maxjeffwell/firebook
    tag: 20261007-030932-57c0da7
    pullPolicy: Always

service:
  client:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30004

resources:
  client:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

# Environment variables (empty for frontend-only)
env:
  client: []

serviceAccount:
  create: false

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  runAsUser: 1001

# Ingress Configuration
ingress:
  enabled: true
  host: firebook-k8s.el-jefe.me
  # canonical name, repointed 2026-09-22 from the retired ASUSTOR "marmoset" cloudflared tunnel
  extraHosts:
    - firebook.el-jefe.me

topologySpreadConstraints:
  enabled: true
  maxSkew: 1

nodeSelector: {}

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - "true"

# 2026-10-15: one client replica on the edge VPS (assets served from the public IP)
# and one at home on a server, so neither a VPS outage nor a server loss drops the
# site. The required affinity limits the pods to the four `site`-labelled nodes
# (vmi3610371=edge; elitedesk/m720q/m920s=home); the spread over `site` with
# DoNotSchedule forces one replica per site with replicaCount 2.
nodeSelectorClient: {}
affinityClient:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: site
              operator: In
              values: [edge, home]
tolerationsClient:
  - key: role
    operator: Equal
    value: edge
    effect: PreferNoSchedule
topologySpreadConstraintsClient:
  enabled: true
  maxSkew: 1
  topologyKey: site
  whenUnsatisfiable: DoNotSchedule

# Embeddings DB for the Firebase Cloud Functions: database "firebook" on the
# in-cluster KubeBlocks Neon (neon-cluster), exposed via edge Traefik with TLS.
# DNS: firebook-db.el-jefe.me CNAME edge.el-jefe.me, DNS-only (not proxied).
database:
  expose:
    enabled: true
    host: firebook-db.el-jefe.me
    service: neon-cluster-neon-compute-neon-compute
    port: 55432
  # Idempotent Argo PostSync Job that (re)creates role/db/pgvector/table and the
  # lockdown. Never touches the firebook password (that lives in the Firebase console).
  bootstrap:
    enabled: true
    computePod: neon-cluster-neon-compute-0
    image: alpine/k8s:1.34.3

pdb:
  enabled: true
  minAvailable: 1
