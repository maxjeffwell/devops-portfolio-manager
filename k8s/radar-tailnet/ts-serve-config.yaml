---
apiVersion: v1
kind: ConfigMap
metadata:
  name: radar-tailnet-serve
  namespace: radar
data:
  # Raw TCP forward: tailnet :443 -> nginx :8443 in the same pod.
  # TLS terminates at nginx with the cert-manager certificate.
  serve.json: |
    {
      "TCP": {
        "443": {
          "TCPForward": "127.0.0.1:8443"
        }
      }
    }
