# qwen2.5-1.5b-instruct served through KServe (2026-11-26).
# Replaced the hand-written ovms-llm Deployment on 2026-11-26 after a side-by-side
# comparison (same answers, same latency). Callers use the ovms-llm Service
# (llm.yaml): http://ovms-llm.ovms:8000/v3.
# 2026-11-26: two copies, one per GPU node (qwen-llm on debian-marmoset, qwen-llm-2
# on neonmarmoset), so the model stays up when one laptop is down. The Service
# spreads requests over both. Each copy loads and unloads on its own.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen-llm-kserve-config
  namespace: ovms
  labels:
    portfolio: "true"
data:
  config.json: |
    {
      "mediapipe_config_list": [
        { "name": "qwen2.5-1.5b-instruct", "graph_path": "/config/llm-graph.pbtxt" }
      ],
      "model_config_list": []
    }
  # KServe downloads the model into /mnt/models before the server starts.
  llm-graph.pbtxt: |
    input_stream: "HTTP_REQUEST_PAYLOAD:input"
    output_stream: "HTTP_RESPONSE_PAYLOAD:output"
    node: {
      name: "LLMExecutor"
      calculator: "HttpLLMCalculator"
      input_stream: "LOOPBACK:loopback"
      input_stream: "HTTP_REQUEST_PAYLOAD:input"
      input_side_packet: "LLM_NODE_RESOURCES:llm"
      output_stream: "LOOPBACK:loopback"
      output_stream: "HTTP_RESPONSE_PAYLOAD:output"
      input_stream_info: {
        tag_index: 'LOOPBACK:0',
        back_edge: true
      }
      node_options: {
        [type.googleapis.com / mediapipe.LLMCalculatorOptions]: {
          models_path: "/mnt/models",
          plugin_config: '{}',
          enable_prefix_caching: false,
          cache_size: 1,
          max_num_seqs: 4,
          device: "GPU"
        }
      }
      input_stream_handler {
        input_stream_handler: "SyncSetInputStreamHandler",
        options {
          [mediapipe.SyncSetInputStreamHandlerOptions.ext] {
            sync_set {
              tag_index: "LOOPBACK:0"
            }
          }
        }
      }
    }
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-llm
  namespace: ovms
  labels:
    portfolio: "true"
  annotations:
    serving.kserve.io/deploymentMode: Standard
    # One GPU per node: nothing to scale to, so no HPA.
    serving.kserve.io/autoscalerClass: none
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    labels:
      portfolio: "true"
      # Shared by both copies; the ovms-llm Service selects it.
      model-group: llm
    deploymentStrategy:
      type: Recreate
    tolerations:
      - key: gpu-priority
        operator: Equal
        value: "true"
        effect: PreferNoSchedule
    nodeSelector:
      gpu-node: "true"
      intel-gpu-gen: xe
      # 2026-10-02 GPU split (user decision): the LLM runs on debian-marmoset's Xe iGPU.
      kubernetes.io/hostname: debian-marmoset
    priorityClassName: portfolio-critical
    serviceAccountName: ovms-models
    terminationGracePeriodSeconds: 30
    securityContext:
      seccompProfile:
        type: RuntimeDefault
      # GID 992 = `render` group, owns /dev/dri/renderD128.
      supplementalGroups: [992]
    # Iris Xe via Intel GPU DRA (adminAccess claim, gpu-claim.yaml).
    resourceClaims:
      - { name: igpu, resourceClaimTemplateName: igpu }
    volumes:
      - name: config
        configMap:
          name: qwen-llm-kserve-config
    model:
      modelFormat:
        name: openvino-graph
      runtime: ovms-gpu-graph
      # Downloaded from Garage on every pod start (about 12 s for ~1 GB) into an
      # emptyDir. Credentials come from the ovms-models ServiceAccount.
      storageUri: s3://ovms-models/qwen2.5-1.5b-instruct
      volumeMounts:
        - { name: config, mountPath: /config, readOnly: true }
      resources:
        requests:
          cpu: "1"
          # 2026-11-26: 4Gi -> 2Gi. With idle unload the model is out of memory most
          # of the day, and each GPU node now holds an LLM copy and an embeddings
          # copy. Loaded working set is still 3-4Gi (measured 2026-10-06), so the
          # limit stays where it was.
          memory: 2Gi
        limits:
          memory: 5Gi
        claims: [{ name: igpu }]
---
apiVersion: serving.kserve.io/v1beta1
