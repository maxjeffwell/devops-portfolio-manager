# CNPG cluster for the auth database. Adopted into GitOps 2026-09-16 — it was
# the only one of the four `default`-namespace clusters still unmanaged, so its
# settings lived solely in the cluster and would have vanished on any rebuild.
#
# !! NO SECRET HERE, ON PURPOSE !!
# Credentials live in Secret/cnpg-auth-app (owner neondb_owner) and
# Secret/cnpg-auth-superuser, both hand-created with real passwords and owned by
# nothing. Same rule as cnpg-bookmarked: do not "complete" this manifest by
# adding Secrets — syncing a placeholder password would overwrite the live one.
#
# Regenerated from the RUNNING cluster, not from its last-applied-configuration
# annotation, which had drifted badly: that annotation still says
# storageClass democratic-synology-iscsi-mp and className synology-snapshotclass,
# but the cluster was migrated to mayastor-2 / mayastor-snapclass like its
# siblings. Applying the annotation's version would have been a storage change
# against a live database.
#
# As with the other files here, only deliberately-declared fields are listed.
# The remaining ~16 fields on the live object (logLevel, postgresUID/GID, probes,
# replicationSlots, the *Delay fields, primaryUpdate*, smartShutdownTimeout,
# postgresql, failoverDelay, min/maxSyncReplicas) are CloudNativePG webhook
# defaults, left to the operator so ArgoCD selfHeal does not fight it.
#
# The cnpg-clusters Application syncs with prune: true. Deleting this file
# therefore deletes the Cluster, and with it the auth database.
#
# Two items carried over from the migration were reviewed 2026-09-16, one
# adoption commit later, so the adoption itself stayed a verified no-op. The
# first was pruned; the second turned out not to be a defect and was kept:
#
#  1. bootstrap.pg_basebackup and externalClusters both pointed at cnpg-auth-src,
#     a migration source whose Cluster, cnpg-auth-src-rw Service and both TLS
#     Secrets were all gone. Pruned. bootstrap now carries initdb with the REAL
#     database identity -- neondb / neondb_owner / UTF8 / C / C, read from
#     pg_database -- rather than the webhook's app/app that cnpg-bookmarked was
#     left with. bootstrap is read only at cluster creation, so this is inert
#     today but truthful if the cluster is ever recreated from this file. The
#     CNPG webhook accepted the change in a server-side dry run before commit.
#
#  2. enableSuperuserAccess is true and superuserSecret names cnpg-auth-superuser.
#     Deliberately KEPT ON (decision 2026-09-16). This was first flagged as a
#     defect matching cnpg-bookmarked's ("password never applied") because
#     status.superuserSecretVersion is empty. That reading was WRONG. The
#     postgres password IS set -- cloned from cnpg-auth-src by the basebackup --
#     and it MATCHES the Secret: a TCP scram login with the Secret's password
#     succeeded. CNPG simply never had to apply it, so it never stamped the
#     version. Superuser access over TCP works and is retained on purpose for
#     admin tooling; nothing in-cluster currently uses it (only unix-socket peer
#     sessions). Do NOT "fix" this by switching the flag off -- CNPG would NULL a
#     working password.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-auth
  namespace: default
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  instances: 1
  enablePDB: false
  priorityClassName: portfolio-critical
  inheritedMetadata:
    labels:
      portfolio: 'true'
  affinity:
    enablePodAntiAffinity: true
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - elitedesk
            - m720q
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  # Inert (read only at creation) but truthful -- see (1) in the header.
  bootstrap:
    initdb:
      database: neondb
      owner: neondb_owner
      encoding: UTF8
      localeCType: C
      localeCollate: C
  storage:
    resizeInUseVolumes: true
    size: 5Gi
    storageClass: mayastor-2
  # 2026-09-16: cpu 250m -> 100m. 14-day peak is 27m, so 250m reserved ~9x the
  # real peak and it was the single largest slice of elitedesk's CPU-request
  # saturation (95.9% of allocatable while ~26% busy). Memory left at 256Mi:
  # unlike its siblings, which needed 384Mi, cnpg-auth's 14-day peak is 157Mi.
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  monitoring:
    customQueriesConfigMap:
    - key: queries
      name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: true
  # Kept on -- see (2) in the header. The password is real and matches the Secret.
  enableSuperuserAccess: true
  superuserSecret:
    name: cnpg-auth-superuser
  backup:
    target: prefer-standby
    volumeSnapshot:
      className: mayastor-snapclass-cnpg
      online: true
      onlineConfiguration:
        immediateCheckpoint: false
        waitForArchive: true
      snapshotOwnerReference: none
