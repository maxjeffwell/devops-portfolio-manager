# Synology CSI Driver Helm Values
# Chart: synology-csi (from SynologyOpenSource/synology-csi repo)
# Chart version: 0.9.3-SNAPSHOT
# Image: synology/synology-csi:v1.2.1
#
# Install:
#   helm install synology-csi ./deploy/helm \
#     -n synology-csi --create-namespace \
#     -f values.yaml
#
# The client-info secret must be created separately (contains DSM credentials).
# See client-info-secret.yaml.
#
# 2026-10-02: the chart has NO priorityClassName value, so the node DaemonSet was
# priority 0 (a preemption victim -> evicting it breaks iSCSI mounts on that node).
# Patched live, outside helm (survives helm upgrade via 3-way merge; re-apply after
# an uninstall/reinstall). Same patch on kube-system/csi-s3, which has no source here:
#   kubectl -n synology-csi patch ds synology-csi-node \
#     -p '{"spec":{"template":{"spec":{"priorityClassName":"system-node-critical"}}}}'

storageClasses:
  - name: synology-iscsi
    provisioner: csi.san.synology.com
    reclaimPolicy: Retain
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    parameters:
      dsm: "10.0.0.5"
      fsType: btrfs
      location: /volume1

# 2026-09-25: synology-snapshotclass carries the Velero label velero.io/csi-volumesnapshot-class=true,
# added with `kubectl label` because this chart has no labels value for the snapshot class.
# Helm three-way merge keeps it on upgrade; re-add it if the release is ever reinstalled.
