# External Secrets Operator Helm values
# Chart: external-secrets/external-secrets v1.2.1
# Release: external-secrets (namespace: external-secrets)
#
# Install/upgrade:
#   helm upgrade --install external-secrets external-secrets/external-secrets \
#     -n external-secrets -f external-secrets-values.yaml

# Pin all ESO components to one home node (m720q). Was vmi3115606 until
# 2026-09-06; that VPS is being decommissioned and all workloads move home.
nodeSelector:
  kubernetes.io/hostname: m720q

# 2026-09-30: explicit request for the core controller. It ran on the namespace
# LimitRange default (10m/64Mi) while using 62-128Mi (7d p95) and ~25m CPU.
# webhook (84Mi) and cert-controller (53Mi) stay on the default. No limits.
resources:
  requests:
    cpu: 25m
    memory: 128Mi

webhook:
  nodeSelector:
    kubernetes.io/hostname: m720q

certController:
  nodeSelector:
    kubernetes.io/hostname: m720q
