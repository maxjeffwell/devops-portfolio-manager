# One-time token that guards the first-owner claim (see the setupToken block in
# helm-charts/opentodo/values-override.yaml). Doppler: portfolio/prd,
# OPENTODO_SETUP_TOKEN. Read it with:
#   doppler secrets get OPENTODO_SETUP_TOKEN --project portfolio --config prd --plain
# Once the owner account exists it is unused; this and the Doppler entry can
# then be removed together with setupToken.existingSecret.
#
# File name: this repo's .gitignore drops every *secret*.yaml except names
# ending -externalsecret.yaml. The first version of this file was called
# externalsecret.yaml, was silently left out of the commit, and the pod could
# not start for want of its Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opentodo-setup-token
  namespace: opentodo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: opentodo-setup-token
    creationPolicy: Owner
  data:
    - secretKey: setup-token
      remoteRef:
        key: OPENTODO_SETUP_TOKEN
