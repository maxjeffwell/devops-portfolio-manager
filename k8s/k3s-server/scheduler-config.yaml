# kube-scheduler configuration for the embedded k3s scheduler (all 3 servers).
# 2026-09-30: score nodes with memory weighted 3x over CPU. Default scoring
# weights them equally, so a node with lots of free CPU kept winning placements
# even when its memory requests were the fullest (m920s). Memory is the tight
# resource on these nodes; CPU is mostly idle.
# 2026-10-02: spread load instead. With memory weighted 3x, the two 29 GiB
# nodes (elitedesk, m720q) kept winning until 73-83 % CPU requested while the
# others sat at 14-34 %. Now: LeastAllocated with cpu and memory weighted 1:1,
# and the NodeResourcesFit score counts double (plugin weight 2) so free
# resources outweigh BalancedAllocation and ImageLocality. Do NOT up-weight
# NodeResourcesBalancedAllocation: it favors nodes whose cpu% and mem% are
# close even when both are high (tried and reverted 2026-10-02).
# clientConnection.kubeconfig is REQUIRED here: k3s passes --kubeconfig as a
# flag, and kube-scheduler ignores that flag once --config is used.
apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
clientConnection:
  kubeconfig: /var/lib/rancher/k3s/server/cred/scheduler.kubeconfig
leaderElection:
  leaderElect: true
profiles:
  - schedulerName: default-scheduler
    plugins:
      score:
        enabled:
          # Default plugin; listing it only changes its weight (default 1).
          - name: NodeResourcesFit
            weight: 2
    pluginConfig:
      - name: NodeResourcesFit
        args:
          apiVersion: kubescheduler.config.k8s.io/v1
          kind: NodeResourcesFitArgs
          scoringStrategy:
            type: LeastAllocated
            resources:
              - name: memory
                weight: 1
              - name: cpu
                weight: 1
