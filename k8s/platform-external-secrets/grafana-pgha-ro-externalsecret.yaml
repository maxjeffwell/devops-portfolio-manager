# Password of `grafana_ro` on the native Patroni HA cluster (2026-11-28): pg_monitor only (pg_stat_* views),
# default_transaction_read_only, connection limit 10. Used by Grafana's "pg-ha (read pool)" datasource
# on VIP 192.168.50.60:5001, which HAProxy balances across all Patroni members (primary + replicas).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-pgha-ro
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-pgha-ro
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: PGHA_GRAFANA_RO_PASSWORD
