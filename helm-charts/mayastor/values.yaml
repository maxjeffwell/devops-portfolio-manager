# Mayastor (openebs/openebs umbrella chart) — Helm values override
# Chart: openebs/openebs (https://openebs.github.io/openebs)
# Release name: mayastor (in namespace openebs)
#
# Apply with:
#   helm upgrade --install mayastor openebs/openebs \
#     --namespace openebs --create-namespace \
#     -f helm-charts/mayastor/values.yaml
#
# Only pinning the localpv-provisioner Deployment (io-engine is a DaemonSet
# and must stay one-per-data-plane-node; we don't pin those).
#
# localpv-provisioner does leader-election → frequent API writes → was
# chronically restarting on vmi3115606 due to Tailscale-to-control-plane
# micro-blips. Pinned to vmi2951245 (the API server node) 2026-05-25.

# NOTE 2026-08-25: body below is `helm -n openebs get values mayastor -o yaml`
# (git had drifted far behind the live release; upgrading from the old file
# would have dropped io_engine hugepages, etcd, nodeSelectors, CRD toggles).
# The csi-snapshot-controller sidecar is removed by post-render.sh (no chart
# toggle exists as of umbrella 4.5.1 / mayastor 2.11.1).
#
#   helm upgrade mayastor openebs/openebs --version 4.6.1 -n openebs -f helm-charts/mayastor/values.yaml
#
# 2026-09-15: upgraded 4.4.0 -> 4.6.1 (mayastor 2.10.0 -> 2.12.1). post-render.sh is
# RETIRED: the chart now has mayastor.csi.controller.snapshotController.enabled=false.
# io_engine.pool.ioAlerts.stallDeadline pinned to 110s (chart default renders "110s110s").
#
# 2026-09-22: api-rest memory 32Mi/64Mi -> 64Mi/128Mi (helm rev 12); Deployment-only change.
#
# 2026-09-17: io_engine cpu LIMIT 1 -> 2 (request stays 1). The single reactor
# spins core 1 at 100 %, so gRPC/etcd/NATS helper threads pushed the container
# over a 1-core CFS quota: 11-15 % of periods throttled = reactor stalls.
# DaemonSet is OnDelete: pods pick this up only when deleted, ONE NODE AT A TIME.
#
# Pinned hand-patched state (else helm reverts it): io_engine.coreList=[1] +
# cpu request 1, etcd.pdb.create=false (zero-budget PDB purge 8/23), localpv-provisioner
# leader election off + pinned to vmi2951245, hostpathClass off (SC deleted).
# Known chart-driven residuals accepted 8/25: csi-node --nvme-nr-io-queues
# follows coreList (2->1); provisioner also gets the chart's 5s NoExecute
# tolerations appended.

USER-SUPPLIED VALUES: null
alloy:
  enabled: false
engines:
  local:
    lvm:
      enabled: false
    rawfile:
      enabled: false
    zfs:
      enabled: false
  replicated:
    mayastor:
      enabled: true
localpv-provisioner:
  hostpathClass:
    enabled: false
  localpv:
    enableLeaderElection: false
    nodeSelector:
      kubernetes.io/hostname: vmi2951245
    tolerations:
    - effect: PreferNoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
loki:
  enabled: false
mayastor:
  agents:
    core:
      rebuild:
        partial:
          waitPeriod: 30m
  alloy:
    enabled: false
  apis:
    rest:
      # 2026-09-22: chart default is 32Mi request / 64Mi limit. api-rest sits
      # flat at 50-58Mi (30-day max 58Mi, no growth), i.e. 1.6x its request and
      # 6Mi under its limit, so any burst would OOM-kill it. cpu untouched
      # (1m used of 50m). Deployment change only: no io-engine impact.
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi
  crds:
    csi:
      volumeSnapshots:
        enabled: false
    enabled: true
  csi:
    controller:
      snapshotController:
        enabled: false
    node:
      initContainers:
        enabled: true
  etcd:
    clusterDomain: cluster.local
    enabled: true
    localpvScConfig:
      enabled: false
    nodeSelector:
      kubernetes.io/arch: amd64
    pdb:
      create: false
    persistence:
      enabled: true
      size: 2Gi
      storageClass: local-path
    replicaCount: 1
  eventing:
    enabled: true
  io_engine:
    coreList:
    - 1
    envcontext: iova-mode=pa
    pool:
      ioAlerts:
        stallDeadline: 110s
    resources:
      limits:
        cpu: '2'
        hugepages2Mi: 2Gi
        # Chart default; kept explicit because the request below now differs.
        memory: 1Gi
      requests:
        cpu: '1'
        hugepages2Mi: 2Gi
        # 2026-09-24: was 1Gi (chart default, equal to the limit). The io-engine
        # data path lives in the 2Gi hugepages accounted separately; the memory
        # cgroup working set is ~130Mi (7-day avg 63-130Mi on elitedesk/m720q).
        # 1Gi over-reserved ~960Mi on each of the two storage nodes. 256Mi keeps
        # usage under request so the pod stays low in the eviction order; the
        # 1Gi limit still covers any burst. DaemonSet is OnDelete: apply with
        # helm, then delete io-engine pods ONE node at a time, waiting for the
        # pool to re-import (>1 min past the REST API's stale "Online") before
        # touching the second node. helm rev 13.
        memory: 256Mi
    target:
      nvmf:
        iface: bond0
  localpv-provisioner:
    enabled: false
  loki:
    enabled: false
  nodeSelector:
    kubernetes.io/arch: amd64
    openebs.io/engine: mayastor
  obs:
    callhome:
      enabled: false
  tolerations:
  - effect: NoSchedule
    key: workload
    operator: Equal
    value: gpu
openebs-crds:
  csi:
    volumeSnapshots:
      enabled: false
      keep: true
