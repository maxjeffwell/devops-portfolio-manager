# 2026-10-02 GPU split (user decision): neonmarmoset Xe = jellyfin + ovms-embeddings;
# debian-marmoset Xe = immich-ml + the LLM.
# 2026-11-26: the qwen2.5-1.5b-instruct LLM is served by KServe (InferenceService
# qwen-llm in kserve-llm.yaml). This file keeps what callers and the model depend
# on: the model volume and the stable ovms-llm Service name.
# OpenAI-compatible chat at http://ovms-llm.ovms:8000/v3 (model "qwen2.5-1.5b-instruct")
# for shared-ai-gateway's auto tier and litellm's local-llama / ollama-llama3.2-3b.
# Weights: OpenVINO/Qwen2.5-1.5B-Instruct-int4-ov (Apache-2.0) in s3://ovms-models.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ovms-llm-models
  namespace: ovms
  labels:
    app: ovms-llm
    portfolio: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: mayastor-ovms-models
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ovms-llm
  namespace: ovms
  labels:
    app: ovms-llm
spec:
  type: ClusterIP
  # Alias onto the KServe-managed pod so callers keep http://ovms-llm.ovms:8000.
  selector:
    serving.kserve.io/inferenceservice: qwen-llm
  ports:
    - { name: rest, port: 8000, targetPort: 8000, protocol: TCP }
    - { name: grpc, port: 9000, targetPort: 9000, protocol: TCP }
