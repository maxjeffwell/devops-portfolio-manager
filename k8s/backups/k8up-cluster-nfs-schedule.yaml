# K8up pilot (2026-08-18): restic backup of cluster-nfs PVC data → Garage S3
# bucket "k8up" on the ASUSTOR (tailscale endpoint, reachable from all nodes).
# Chosen as pilot because nfs-data (16Gi) was the audit's coverage hole: velero
# fs-backup silently skipped it for 10 days whenever the nfs-server pod wasn't
# Running at 05:30 (K8up mounts PVCs node-locally and has no such dependency).
#
# Secrets k8up-repo-password + k8up-s3-credentials are created out-of-band in the
# cluster-nfs namespace (garage key "k8up-key"; restic password escrowed at
# ~/.k8up-restic-password on debian-marmoset — TODO: move both to Doppler + ESO).
#
# 01:15 daily = clear of the velero 02:00 daily; weekly check + prune on Sunday
# afternoon, clear of the Sunday-morning velero weeklies.
# Owned by the `backups` ArgoCD app.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: k8up-cluster-nfs
  namespace: cluster-nfs
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo-password
      key: password
    s3:
      endpoint: http://100.64.0.12:3900
      bucket: k8up
      accessKeyIDSecretRef:
        name: k8up-s3-credentials
        key: username
      secretAccessKeySecretRef:
        name: k8up-s3-credentials
        key: password
  backup:
    schedule: '15 1 * * *'
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2
  check:
    schedule: '30 12 * * 0'
  prune:
    schedule: '30 13 * * 0'
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
