# 2026-10-07: Channels DVR transcodes on debian-marmoset's Iris Xe through Intel
# GPU DRA (app intel-gpu-dra). adminAccess lets it share the iGPU with
# immich-ml/ovms-llm/tdarr-node (Intel's driver has no consumable capacity).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: igpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            adminAccess: true
