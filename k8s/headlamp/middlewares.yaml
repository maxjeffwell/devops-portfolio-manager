# Only Cloudflare may reach Headlamp's router (2026-11-27). headlamp.el-jefe.me is
# a proxied CNAME; without this, anyone could hit the edge IP directly with the
# Host header and skip Cloudflare's WAF and rate limiting. Copied from
# k8s/vaultwarden/middlewares.yaml (vaultwarden-cdn-only): peer-address check (no
# ipStrategy), ranges = https://www.cloudflare.com/ips/, keep in step with that
# file and with Traefik's forwardedHeaders.trustedIPs.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headlamp-cdn-only
  namespace: headlamp
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
