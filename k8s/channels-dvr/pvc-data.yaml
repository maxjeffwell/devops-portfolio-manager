# DVR data dir (Database/, Images/, Logs/, Streaming/ live-TV buffers).
# 2026-09-25: mayastor-sata (single replica on the m920s BX300 pool); was
# local-path pinned to the debian-marmoset laptop. The claim size is now
# real (Mayastor is thick). Recordings do NOT go here — /recordings is a
# separate PVC added as an extra disk in the Channels UI.
# 2026-09-26: back to the ORIGINAL name, now on mayastor-2-sata-thin (2
# replicas: m920s BX300 + elitedesk USB BX500, thin). A brief detour through
# channels-dvr-data-r2 on mayastor-2 (NVMe) was reverted: NVMe is scarce, and
# DVR config belongs on SATA. 1764 files / 2.03 GB copied with per-file sha256
# verification.
# 2026-10-09: mayastor-2-sata-thin can no longer provision (both media=sata pools are
# now on m920s after the 2 TB BX500 moved there), so the claim was recreated under the
# same name on mayastor-sata-thin (1 replica on m920s's tier=sata pools): copied via a
# temp PVC twice, 1851 files + 1 symlink, sha256 manifests identical both times.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: channels-dvr-data
  namespace: channels-dvr
  labels:
    app: channels-dvr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: mayastor-sata-thin
  resources:
    requests:
      storage: 15Gi
