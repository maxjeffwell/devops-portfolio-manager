# NetworkPolicy lunary/allow-lunary-to-cnpg. Exported from the live cluster 2026-09-26 (it was
# hand-applied, tracked by nothing); verified with an empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lunary-to-cnpg
  namespace: lunary
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
      podSelector:
        matchLabels:
          cnpg.io/cluster: cnpg-lunary
  - ports:
    - port: 443
      protocol: TCP
  podSelector:
    matchLabels:
      app: lunary-backend
  policyTypes:
  - Egress
