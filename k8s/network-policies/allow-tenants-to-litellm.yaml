# NetworkPolicy default/allow-tenants-to-litellm. Exported from the live cluster 2026-09-26 (it was
# hand-applied, tracked by nothing); verified with an empty kubectl diff.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tenants-to-litellm
  namespace: default
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: app.kubernetes.io/managed-by
          operator: In
          values:
          - multi-tenant-platform
    ports:
    - port: 4000
      protocol: TCP
  podSelector:
    matchLabels:
      app: litellm
  policyTypes:
  - Ingress
