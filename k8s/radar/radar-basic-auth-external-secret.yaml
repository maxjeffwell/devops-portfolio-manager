---
# Basic-auth credential for the radar Traefik basicAuth middleware.
# Doppler (portfolio/prd) holds plaintext RADAR_PASSWORD; the template
# renders the htpasswd line (bcrypt) Traefik expects in the `users` key.
# 24h refresh: bcrypt is salted, so every render rewrites the secret —
# force-refresh after rotating the password in Doppler:
#   kubectl annotate externalsecret radar-basic-auth -n radar force-sync=$(date +%s)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radar-basic-auth
  namespace: radar
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  data:
    - remoteRef:
        key: RADAR_PASSWORD
      secretKey: password
  target:
    name: radar-basic-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        users: '{{ htpasswd "maxjeffwell" .password }}'
