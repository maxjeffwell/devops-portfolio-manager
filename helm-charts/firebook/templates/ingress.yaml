{{- if .Values.ingress.enabled }}
{{- $hosts := list .Values.ingress.host }}
{{- range .Values.ingress.extraHosts }}{{ $hosts = append $hosts . }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    {{- range $hosts }}
    - {{ . }}
    {{- end }}
    secretName: {{ .Release.Name }}-tls
  rules:
  {{- range $hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $.Release.Name }}-client
            port:
              number: {{ $.Values.service.client.port }}
  {{- end }}
{{- end }}
